<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#faf9f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sophie – Weiter</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{ height:100%; }
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:#2a2420;
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  background:#faf9f6;
  position:relative;
  overflow-x:hidden;
  overflow-y:auto;
  padding:24px 0 48px;
}
.bg{
  position:absolute; inset:-40px;
  background:
    radial-gradient(900px 500px at 20% 25%, rgba(196,168,130,.08), transparent 60%),
    radial-gradient(700px 500px at 80% 65%, rgba(196,168,130,.05), transparent 60%);
}
.wrap{
  width:min(640px,92vw);
  position:relative;
  z-index:2;
  margin:0 auto;
}

/* -- Top bar -- */
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:24px;
  font-size:13px;
}
.lang{ display:flex; gap:8px; }
.lang span{
  cursor:pointer;
  padding:4px 8px;
  border-radius:10px;
  border:1px solid #ede8e2;
  opacity:.7;
}
.lang .active{ background:#2a2420; color:#fff; opacity:1; }
.back{
  color:#7a6a5a;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
  padding:6px 10px;
  border-radius:10px;
  background:rgba(0,0,0,.04);
  border:1px solid #ede8e2;
  cursor:pointer;
}

/* -- Header -- */
.header{
  text-align:center;
  margin-bottom:28px;
}
.header h1{
  margin:0 0 10px;
  font-size:27px;
  font-weight:700;
  line-height:1.2;
  letter-spacing:-.3px;
}
.header p{
  margin:0;
  font-size:15px;
  color:#7a6a5a;
  line-height:1.5;
}

/* -- Primary row: Start + TopUp 5 -- */
.primary-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:16px;
}
.card{
  border-radius:20px;
  padding:20px 18px;
  display:flex;
  flex-direction:column;
}
.card-start{
  background:#fff;
  border:1.5px solid #c4a882;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
}
.card-topup{
  background:rgba(0,0,0,.03);
  border:1px solid #ede8e2;
}
.card-badge{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  letter-spacing:.03em;
  padding:3px 9px;
  border-radius:8px;
  margin-bottom:12px;
  align-self:flex-start;
}
.badge-start{ background:rgba(196,168,130,.15); color:#8a7050; }
.badge-topup{ background:rgba(0,0,0,.05); color:#5a4a40; }
.card-name{
  font-size:13px;
  font-weight:500;
  color:#7a6a5a;
  margin-bottom:4px;
}
.card-price{
  font-size:28px;
  font-weight:800;
  margin-bottom:0;
  line-height:1;
}
.card-per{
  font-size:11px;
  color:#a09080;
  margin-bottom:10px;
  margin-top:3px;
}
.card-sub{
  font-size:12.5px;
  color:#7a6a5a;
  line-height:1.5;
  margin-bottom:16px;
  flex:1;
}
.card-btn{
  width:100%;
  padding:13px 10px;
  border-radius:13px;
  border:0;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:opacity .15s;
}
.card-btn:hover{ opacity:.9; }
.card-btn:disabled{ opacity:.35; cursor:not-allowed; }
.btn-start{ background:#2a2420; color:#fff; }
.btn-topup{ background:#fff; color:#2a2420; border:1px solid #ede8e2; }

/* -- Upgrade row: Plus + Premium -- */
.upgrade-wrap{
  margin-bottom:16px;
}
.upgrade-label{
  font-size:11px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#a09080;
  text-align:center;
  margin-bottom:8px;
}
.upgrade-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.upgrade-btn{
  padding:14px 10px;
  border-radius:14px;
  border:1px solid #ede8e2;
  background:rgba(0,0,0,.02);
  color:#2a2420;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:background .15s, border-color .15s;
  width:100%;
  text-align:center;
}
.upgrade-btn:hover{ background:rgba(0,0,0,.04); border-color:#c4a882; }
.upgrade-btn:disabled{ opacity:.25; cursor:not-allowed; }
.upgrade-btn .plan-name{
  font-size:12px;
  font-weight:500;
  color:#7a6a5a;
  margin-bottom:2px;
}
.upgrade-btn .plan-price{
  font-size:18px;
  font-weight:800;
}
.upgrade-btn .plan-tokens{
  display:block;
  font-size:10px;
  font-weight:500;
  color:#a09080;
  margin-top:3px;
}

/* -- More topups -- */
.topup-wrap{
  margin-bottom:20px;
}
.topup-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.pack-btn{
  padding:10px 10px 9px;
  border-radius:12px;
  border:1px solid #ede8e2;
  background:rgba(0,0,0,.02);
  color:#7a6a5a;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:background .15s, color .15s;
  width:100%;
}
.pack-btn:hover{ background:rgba(0,0,0,.04); color:#2a2420; }
.pack-btn:disabled{ opacity:.25; cursor:not-allowed; }
.pack-btn span{
  display:block;
  font-size:10px;
  font-weight:500;
  opacity:.7;
  margin-top:2px;
  letter-spacing:.02em;
}

/* -- Legal -- */
.legal-block{
  border-top:1px solid rgba(0,0,0,.03);
  padding-top:16px;
  margin-bottom:14px;
}
.legal-block label{
  display:flex;
  gap:9px;
  font-size:12px;
  color:#7a6a5a;
  line-height:1.5;
  margin-bottom:8px;
}
.legal-block label:last-child{ margin-bottom:0; }
.legal-block input[type=checkbox]{ flex-shrink:0; margin-top:2px; accent-color:#c4a882; }
.legal-block a{ color:#2a2420; text-decoration:underline; }

/* -- Login link -- */
.login-link{
  display:none;
  text-align:center;
  margin-bottom:14px;
  font-size:13px;
  color:#7a6a5a;
}
.login-link a{
  color:#5a4a40;
  text-decoration:underline;
  cursor:pointer;
}

/* -- Msg -- */
.msg{
  text-align:center;
  font-size:13px;
  color:#7a6a5a;
  min-height:18px;
  margin-bottom:6px;
}

/* -- Footer -- */
.footer{
  margin-top:16px;
  text-align:center;
  font-size:12px;
  opacity:.4;
}
.footer a{ color:#7a6a5a; text-decoration:none; }

/* -- Responsive -- */
@media (max-width:460px){
  .primary-row{ grid-template-columns:1fr; }
  .card-price{ font-size:25px; }
  .header h1{ font-size:23px; }
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="wrap">

  <!-- Top bar -->
  <div class="top">
    <a class="back" id="backBtn" href="/">← Zurück</a>
    <div class="lang">
      <span id="langDE">DE</span>
      <span id="langEN">EN</span>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <h1 id="tH1"></h1>
    <p id="tLead"></p>
  </div>

  <!-- Primary: Start Abo + €5 TopUp -->
  <div class="primary-row">

    <!-- Start -->
    <div class="card card-start">
      <div class="card-badge badge-start" id="tStartBadge"></div>
      <div class="card-name" id="tStartName"></div>
      <div class="card-price">&euro;9,90</div>
      <div class="card-per" id="tStartPer"></div>
      <div class="card-sub" id="tStartSub"></div>
      <button class="card-btn btn-start" id="btnStart" disabled></button>
    </div>

    <!-- €5 TopUp -->
    <div class="card card-topup">
      <div class="card-badge badge-topup" id="tTopup5Badge"></div>
      <div class="card-name" id="tTopup5Name"></div>
      <div class="card-price">&euro;5</div>
      <div class="card-sub" id="tTopup5Sub"></div>
      <button class="card-btn btn-topup" id="btnTopup5" disabled></button>
    </div>

  </div>

  <!-- Upgrade: Plus + Premium -->
  <div class="upgrade-wrap">
    <div class="upgrade-label" id="tUpgradeLabel"></div>
    <div class="upgrade-row">
      <button class="upgrade-btn" id="btnPlus" disabled>
        <div class="plan-name" id="tPlusName"></div>
        <div class="plan-price">&euro;19,90</div>
        <span class="plan-tokens" id="tPlusTokens"></span>
      </button>
      <button class="upgrade-btn" id="btnPremium" disabled>
        <div class="plan-name" id="tPremiumName"></div>
        <div class="plan-price">&euro;39,90</div>
        <span class="plan-tokens" id="tPremiumTokens"></span>
      </button>
    </div>
  </div>

  <!-- More TopUps: €10 + €20 -->
  <div class="topup-wrap">
    <div class="upgrade-label" id="tMoreTokens"></div>
    <div class="topup-row">
      <button class="pack-btn" id="btnTopup10" disabled>
        &euro;10 <span id="tTokens10"></span>
      </button>
      <button class="pack-btn" id="btnTopup20" disabled>
        &euro;20 <span id="tTokens20"></span>
      </button>
    </div>
  </div>

  <!-- Legal -->
  <div class="legal-block">
    <label>
      <input type="checkbox" id="legal1">
      <span id="tLegal1"></span>
    </label>
    <label>
      <input type="checkbox" id="legal2">
      <span id="tLegal2"></span>
    </label>
  </div>

  <!-- Login -->
  <div class="login-link" id="loginHint">
    <span id="tLoginHint"></span> <a id="btnLogin"></a>
  </div>

  <!-- Msg -->
  <div class="msg" id="msg"></div>

  <!-- Footer -->
  <div class="footer">
    <a href="/impressum.html">Impressum</a> ·
    <a href="/privacy.html" id="tPrivacy">Datenschutz</a>
  </div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL     = "https://ohzfojsbmzinpxhcynpt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oemZvanNibXppbnB4aGN5bnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mzc1MjcsImV4cCI6MjA4NzAxMzUyN30.7eGSeEvOCj9vMqFJj9C0SR8DiiYygbFUvpQ8rIVEc0I";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TEXT = {
  de:{
    h1:            "Mach jetzt weiter mit Sophie.",
    lead:          "Starte sofort — oder spar mit einem Abo.",
    startBadge:    "★ Beste Wahl",
    startName:     "Start · monatlich",
    startPer:      "pro Monat · 300 Tokens",
    startSub:      "300 Tokens pro Monat. Voice, Chat, Memory. Jederzeit kündbar.",
    startBtn:      "Jetzt starten",
    topup5Badge:   "⚡ Ohne Abo",
    topup5Name:    "50 Tokens",
    topup5Sub:     "Ohne Bindung. Premium-Qualität. Einfach loslegen.",
    topup5Btn:     "5€ — sofort los",
    upgradeLabel:  "Mehr Power",
    plusName:      "Plus",
    plusTokens:    "800 Tokens · bessere KI",
    premiumName:   "Premium",
    premiumTokens: "2.000 Tokens · beste KI",
    moreTokens:    "Mehr Tokens laden",
    tokens10:      "100 Tokens",
    tokens20:      "250 Tokens",
    loginHint:     "Noch kein Login?",
    loginLink:     "Einloggen, um fortzufahren",
    loading:       "Einen Moment…",
    checkoutErr:   "Fehler beim Starten des Checkouts.",
    topupErr:      "Fehler beim Starten des Top-ups.",
    legalMissing:  "Bitte bestätige beide Checkboxen.",
    privacy:       "Datenschutz",
    legal1:        `Ich akzeptiere die <a href="/terms.html" target="_blank" rel="noopener">AGB</a> und die <a href="/privacy.html" target="_blank" rel="noopener">Datenschutzerklärung</a>.`,
    legal2:        `Ich stimme ausdrücklich zu, dass die Ausführung der Dienstleistung sofort beginnt. Mir ist bekannt, dass ich dadurch mein Widerrufsrecht verliere.`,
  },
  en:{
    h1:            "Keep going with Sophie.",
    lead:          "Start instantly — or save with a plan.",
    startBadge:    "★ Best Value",
    startName:     "Start · monthly",
    startPer:      "per month · 300 Tokens",
    startSub:      "300 tokens per month. Voice, chat, memory. Cancel anytime.",
    startBtn:      "Get started",
    topup5Badge:   "⚡ No subscription",
    topup5Name:    "50 Tokens",
    topup5Sub:     "No commitment. Premium quality. Just go.",
    topup5Btn:     "€5 — start now",
    upgradeLabel:  "More power",
    plusName:      "Plus",
    plusTokens:    "800 tokens · better AI",
    premiumName:   "Premium",
    premiumTokens: "2,000 tokens · best AI",
    moreTokens:    "More tokens",
    tokens10:      "100 tokens",
    tokens20:      "250 tokens",
    loginHint:     "Not signed in?",
    loginLink:     "Sign in to continue",
    loading:       "One moment…",
    checkoutErr:   "Failed to start checkout.",
    topupErr:      "Failed to start top-up.",
    legalMissing:  "Please confirm both checkboxes.",
    privacy:       "Privacy Policy",
    legal1:        `I accept the <a href="/terms.html" target="_blank" rel="noopener">Terms</a> and the <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.`,
    legal2:        `I agree that the service begins immediately and acknowledge that I lose my right of withdrawal once the service starts.`,
  }
};

const c1 = document.getElementById("legal1");
const c2 = document.getElementById("legal2");
const msg = document.getElementById("msg");
const btnStart   = document.getElementById("btnStart");
const btnPlus    = document.getElementById("btnPlus");
const btnPremium = document.getElementById("btnPremium");
const btnTopup5  = document.getElementById("btnTopup5");
const btnTopup10 = document.getElementById("btnTopup10");
const btnTopup20 = document.getElementById("btnTopup20");
const btnLogin   = document.getElementById("btnLogin");
const loginHint  = document.getElementById("loginHint");
const allBtns = [btnStart, btnPlus, btnPremium, btnTopup5, btnTopup10, btnTopup20];

let currentLang = "en";
if ((navigator.language || "").toLowerCase().startsWith("de")) currentLang = "de";

function setLang(l){
  currentLang = l;
  document.getElementById("langDE").classList.toggle("active", l === "de");
  document.getElementById("langEN").classList.toggle("active", l === "en");

  const t = TEXT[l];
  document.getElementById("tH1").textContent            = t.h1;
  document.getElementById("tLead").textContent           = t.lead;
  document.getElementById("tStartBadge").textContent     = t.startBadge;
  document.getElementById("tStartName").textContent      = t.startName;
  document.getElementById("tStartPer").textContent       = t.startPer;
  document.getElementById("tStartSub").textContent       = t.startSub;
  btnStart.textContent                                   = t.startBtn;
  document.getElementById("tTopup5Badge").textContent    = t.topup5Badge;
  document.getElementById("tTopup5Name").textContent     = t.topup5Name;
  document.getElementById("tTopup5Sub").textContent      = t.topup5Sub;
  btnTopup5.textContent                                  = t.topup5Btn;
  document.getElementById("tUpgradeLabel").textContent   = t.upgradeLabel;
  document.getElementById("tPlusName").textContent       = t.plusName;
  document.getElementById("tPlusTokens").textContent     = t.plusTokens;
  document.getElementById("tPremiumName").textContent    = t.premiumName;
  document.getElementById("tPremiumTokens").textContent  = t.premiumTokens;
  document.getElementById("tMoreTokens").textContent     = t.moreTokens;
  document.getElementById("tTokens10").textContent       = t.tokens10;
  document.getElementById("tTokens20").textContent       = t.tokens20;
  document.getElementById("tLegal1").innerHTML           = t.legal1;
  document.getElementById("tLegal2").innerHTML           = t.legal2;
  document.getElementById("tPrivacy").textContent        = t.privacy;
  document.getElementById("tLoginHint").textContent      = t.loginHint;
  btnLogin.textContent                                   = t.loginLink;
  document.getElementById("backBtn").textContent         = l === "de" ? "← Zurück" : "← Back";
  updateEnabled();
}

document.getElementById("langDE").onclick = () => setLang("de");
document.getElementById("langEN").onclick = () => setLang("en");

document.getElementById("backBtn").addEventListener("click", e => {
  e.preventDefault();
  if (history.length > 1) { history.back(); } else { window.location.href = "/"; }
});

function updateEnabled(){
  const ok = c1.checked && c2.checked;
  allBtns.forEach(b => b.disabled = !ok);
}
c1.onchange = updateEnabled;
c2.onchange = updateEnabled;

function goLogin(){
  const redirect = encodeURIComponent(window.location.pathname + window.location.search);
  window.location.href = `/login/?redirect=${redirect}`;
}
btnLogin.onclick = goLogin;

async function getTokenOrLogin(){
  const { data: { session } } = await supabase.auth.getSession();
  if (!session?.access_token) { goLogin(); return null; }
  return session.access_token;
}

function legalPayload(){
  return { termsAccepted:true, privacyAccepted:true, waiverAccepted:true, lang:currentLang, at:new Date().toISOString() };
}

function setAllDisabled(v){ allBtns.forEach(b => b.disabled = v); }

async function startCheckout(plan){
  msg.textContent = "";
  if (!(c1.checked && c2.checked)){ msg.textContent = TEXT[currentLang].legalMissing; return; }
  setAllDisabled(true);
  try {
    const token = await getTokenOrLogin(); if (!token) return;
    const res = await fetch("/api/billing?action=checkout", {
      method:"POST",
      headers:{ "Content-Type":"application/json", Authorization:`Bearer ${token}` },
      body:JSON.stringify({ plan, legal:legalPayload() }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data?.url){ msg.textContent = data?.error ? `Error: ${data.error}` : TEXT[currentLang].checkoutErr; return; }
    window.location.href = data.url;
  } catch { msg.textContent = TEXT[currentLang].checkoutErr; }
  finally { updateEnabled(); }
}

async function startTopup(pack){
  msg.textContent = "";
  if (!(c1.checked && c2.checked)){ msg.textContent = TEXT[currentLang].legalMissing; return; }
  setAllDisabled(true);
  msg.textContent = currentLang === "de" ? "Checkout wird geöffnet…" : "Opening checkout…";
  try {
    const token = await getTokenOrLogin(); if (!token) return;
    const res = await fetch("/api/billing?action=topup", {
      method:"POST",
      headers:{ "Content-Type":"application/json", Authorization:`Bearer ${token}` },
      body:JSON.stringify({ pack, legal:legalPayload() }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data?.url){ msg.textContent = data?.error ? `Error: ${data.error}` : TEXT[currentLang].topupErr; return; }
    window.location.href = data.url;
  } catch { msg.textContent = TEXT[currentLang].topupErr; }
  finally { msg.textContent = ""; updateEnabled(); }
}

btnStart.onclick   = () => startCheckout("start");
btnPlus.onclick    = () => startCheckout("plus");
btnPremium.onclick = () => startCheckout("premium");
btnTopup5.onclick  = () => startTopup(5);
btnTopup10.onclick = () => startTopup(10);
btnTopup20.onclick = () => startTopup(20);

(async function init(){
  setLang(currentLang);
  const { data: { session } } = await supabase.auth.getSession();
  if (!session?.access_token) loginHint.style.display = "block";
})();
</script>

</body>
</html>

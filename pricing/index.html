<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#faf9f6">
<title>Sophie – Pricing</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;font-family:system-ui,-apple-system,sans-serif;color:#2a2420;
  min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
  background:#faf9f6;padding:24px 0 48px;overflow-x:hidden;
}
.wrap{width:min(720px,94vw);margin:0 auto;}

/* Top */
.top{display:flex;justify-content:space-between;margin-bottom:20px;font-size:13px;}
.lang{display:flex;gap:8px;}
.lang span{cursor:pointer;padding:4px 8px;border-radius:10px;border:1px solid #ede8e2;opacity:.7;}
.lang .active{background:#2a2420;color:#fff;opacity:1;}
.back{color:#7a6a5a;text-decoration:none;font-size:14px;font-weight:600;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.04);border:1px solid #ede8e2;cursor:pointer;}

/* Header */
.header{text-align:center;margin-bottom:24px;}
.header h1{margin:0 0 6px;font-size:24px;font-weight:700;letter-spacing:-.3px;}
.header p{margin:0;font-size:13px;color:#7a6a5a;}

/* Plans grid — all buttons identical */
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px;}
.plan{
  border-radius:14px;padding:14px 10px 12px;text-align:center;
  display:flex;flex-direction:column;align-items:center;
  background:#fff;border:1.5px solid #ede8e2;position:relative;
  transition:border-color .2s,box-shadow .2s;
}

/* Current plan = green ring */
.plan.current{border-color:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.25);}
.current-badge{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  font-size:9px;font-weight:700;padding:2px 8px;border-radius:6px;
  background:#22c55e;color:#fff;white-space:nowrap;display:none;
}
.plan.current .current-badge{display:block;}

/* Best value = star + text in top-right corner */
.best-star{
  position:absolute;top:6px;right:8px;
  font-size:9px;font-weight:700;color:#8a7050;
  display:none;
}
.plan.show-best .best-star{display:block;}
/* Hide best star when it's the current plan */
.plan.current .best-star{display:none;}

.plan-name{font-size:13px;font-weight:700;margin-bottom:6px;margin-top:4px;}
.plan-price{font-size:26px;font-weight:800;line-height:1;}
.plan-per{font-size:10px;color:#a09080;margin-top:2px;}
.plan-tokens{font-size:11px;color:#7a6a5a;margin-top:8px;font-weight:600;}
.plan-spacer{flex:1;}

/* All plan buttons look the same */
.plan-btn{
  width:100%;padding:9px 4px;border-radius:10px;border:0;
  font-size:12px;font-weight:700;cursor:pointer;margin-top:10px;
  transition:opacity .15s;
  background:#2a2420;color:#fff;
}
.plan-btn:hover{opacity:.88;}
.plan-btn:disabled{opacity:.3;cursor:not-allowed;}
.plan.current .plan-btn{background:#22c55e;color:#fff;opacity:1;cursor:default;pointer-events:none;}

/* TopUps — compact */
.topup-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a09080;text-align:center;margin-bottom:8px;}
.topups{display:flex;gap:8px;margin-bottom:20px;}
.tu{
  flex:1;border-radius:10px;padding:8px 6px;text-align:center;
  background:rgba(0,0,0,.02);border:1px solid #ede8e2;
}
.tu-price{font-size:16px;font-weight:800;}
.tu-tokens{font-size:9px;color:#a09080;margin:2px 0 6px;}
.tu-btn{
  width:100%;padding:6px 4px;border-radius:8px;border:1px solid #ede8e2;
  background:#fff;color:#2a2420;font-size:10px;font-weight:700;cursor:pointer;
}
.tu-btn:hover{opacity:.88;}
.tu-btn:disabled{opacity:.3;cursor:not-allowed;}

/* Legal */
.legal{border-top:1px solid rgba(0,0,0,.04);padding-top:14px;margin-bottom:12px;}
.legal label{display:flex;gap:8px;font-size:11px;color:#7a6a5a;line-height:1.5;margin-bottom:6px;}
.legal input[type=checkbox]{flex-shrink:0;margin-top:2px;accent-color:#c4a882;}
.legal a{color:#2a2420;text-decoration:underline;}
.legal label.highlight{animation:shake .4s ease;color:#c0392b;}
.legal label.highlight input[type=checkbox]{outline:2px solid #c0392b;outline-offset:2px;border-radius:2px;}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

.login-link{display:none;text-align:center;margin-bottom:12px;font-size:12px;color:#7a6a5a;}
.login-link a{color:#5a4a40;text-decoration:underline;cursor:pointer;}
.msg{text-align:center;font-size:12px;color:#7a6a5a;min-height:16px;margin-bottom:4px;}
.footer{margin-top:14px;text-align:center;font-size:11px;opacity:.4;}
.footer a{color:#7a6a5a;text-decoration:none;}

@media(max-width:480px){
  .plans{grid-template-columns:repeat(2,1fr);}
  .plan-price{font-size:22px;}
  .topups{flex-wrap:wrap;}
  .tu{min-width:calc(33% - 6px);}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <a class="back" id="backBtn" href="/">&#8592; Zurück</a>
    <div class="lang"><span id="langDE">DE</span><span id="langEN">EN</span></div>
  </div>

  <div class="header">
    <h1 id="tH1"></h1>
    <p id="tLead"></p>
  </div>

  <!-- Plans -->
  <div class="plans">
    <div class="plan" id="planFree">
      <div class="current-badge" id="badgeFree"></div>
      <div class="plan-name">Free</div>
      <div class="plan-price">&euro;0</div>
      <div class="plan-per"></div>
      <div class="plan-tokens" id="tFreeTokens"></div>
      <div class="plan-spacer"></div>
      <button class="plan-btn" id="btnFree" disabled></button>
    </div>

    <div class="plan" id="planStart">
      <div class="current-badge" id="badgeStart"></div>
      <div class="plan-name">Start</div>
      <div class="plan-price">&euro;9,90</div>
      <div class="plan-per" id="tStartPer"></div>
      <div class="plan-tokens">300 Tokens</div>
      <div class="plan-spacer"></div>
      <button class="plan-btn" id="btnStart" disabled></button>
    </div>

    <div class="plan show-best" id="planPlus">
      <div class="current-badge" id="badgePlus"></div>
      <div class="best-star" id="tBestStar"></div>
      <div class="plan-name">Plus</div>
      <div class="plan-price">&euro;19,90</div>
      <div class="plan-per" id="tPlusPer"></div>
      <div class="plan-tokens">800 Tokens</div>
      <div class="plan-spacer"></div>
      <button class="plan-btn" id="btnPlus" disabled></button>
    </div>

    <div class="plan" id="planPremium">
      <div class="current-badge" id="badgePremium"></div>
      <div class="plan-name">Premium</div>
      <div class="plan-price">&euro;39,90</div>
      <div class="plan-per" id="tPremiumPer"></div>
      <div class="plan-tokens">2.000 Tokens</div>
      <div class="plan-spacer"></div>
      <button class="plan-btn" id="btnPremium" disabled></button>
    </div>
  </div>

  <!-- TopUps -->
  <div class="topup-label" id="tTopupLabel"></div>
  <div class="topups">
    <div class="tu">
      <div class="tu-price">&euro;5</div>
      <div class="tu-tokens">50 Tokens</div>
      <button class="tu-btn" id="btnTu5" disabled></button>
    </div>
    <div class="tu">
      <div class="tu-price">&euro;10</div>
      <div class="tu-tokens">100 Tokens</div>
      <button class="tu-btn" id="btnTu10" disabled></button>
    </div>
    <div class="tu">
      <div class="tu-price">&euro;20</div>
      <div class="tu-tokens">250 Tokens</div>
      <button class="tu-btn" id="btnTu20" disabled></button>
    </div>
  </div>

  <!-- Legal -->
  <div class="legal">
    <label><input type="checkbox" id="c1"><span id="tL1"></span></label>
    <label><input type="checkbox" id="c2"><span id="tL2"></span></label>
  </div>
  <div class="login-link" id="loginHint"><span id="tLoginHint"></span> <a id="btnLogin"></a></div>
  <div class="msg" id="msg"></div>
  <div class="footer"><a href="/impressum.html">Impressum</a> · <a href="/privacy.html" id="tPrivacy">Datenschutz</a></div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase = createClient(
  "https://ohzfojsbmzinpxhcynpt.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oemZvanNibXppbnB4aGN5bnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mzc1MjcsImV4cCI6MjA4NzAxMzUyN30.7eGSeEvOCj9vMqFJj9C0SR8DiiYygbFUvpQ8rIVEc0I"
);

const L={
  de:{
    h1:"Mach weiter mit Sophie.",
    lead:"Wähle deinen Plan:",
    freeTokens:"50 Tokens zum Start",
    bestStar:"★ Beste Wahl",
    startPer:"/ Monat",plusPer:"/ Monat",premiumPer:"/ Monat",
    selectPlan:"Plan wählen",
    topupLabel:"Ohne Abo · nutzen wann du willst",tuBtn:"Auftanken",
    currentBadge:"Dein Plan",
    loginHint:"Noch kein Login?",loginLink:"Einloggen",
    err:"Fehler beim Checkout.",tErr:"Fehler beim Top-up.",
    legal:"Bitte bestätige beide Checkboxen.",
    l1:`Ich akzeptiere die <a href="/terms.html" target="_blank">AGB</a> und die <a href="/privacy.html" target="_blank">Datenschutzerklärung</a>.`,
    l2:`Ich stimme zu, dass die Dienstleistung sofort beginnt und mir bekannt ist, dass ich dadurch mein Widerrufsrecht verliere.`,
  },
  en:{
    h1:"Keep going with Sophie.",
    lead:"Choose your plan:",
    freeTokens:"50 tokens to start",
    bestStar:"★ Best Value",
    startPer:"/ month",plusPer:"/ month",premiumPer:"/ month",
    selectPlan:"Select Plan",
    topupLabel:"No subscription · use whenever you want",tuBtn:"Refill",
    currentBadge:"Your plan",
    loginHint:"Not signed in?",loginLink:"Sign in",
    err:"Checkout failed.",tErr:"Top-up failed.",
    legal:"Please confirm both checkboxes.",
    l1:`I accept the <a href="/terms.html" target="_blank">Terms</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>.`,
    l2:`I agree the service begins immediately and acknowledge I lose my right of withdrawal.`,
  }
};

const $ = id => document.getElementById(id);
const c1=$("c1"),c2=$("c2"),msg=$("msg");
const btnFree=$("btnFree"),btnStart=$("btnStart"),btnPlus=$("btnPlus"),btnPremium=$("btnPremium");
const btnTu5=$("btnTu5"),btnTu10=$("btnTu10"),btnTu20=$("btnTu20");
const allBtns=[btnStart,btnPlus,btnPremium,btnTu5,btnTu10,btnTu20];
let lang="en";
if((navigator.language||"").startsWith("de"))lang="de";

function setLang(l){
  lang=l;
  $("langDE").classList.toggle("active",l==="de");
  $("langEN").classList.toggle("active",l==="en");
  const t=L[l];
  $("tH1").textContent=t.h1;$("tLead").textContent=t.lead;
  $("tFreeTokens").textContent=t.freeTokens;
  $("tBestStar").textContent=t.bestStar;
  $("tStartPer").textContent=t.startPer;
  $("tPlusPer").textContent=t.plusPer;
  $("tPremiumPer").textContent=t.premiumPer;
  // All plan buttons say the same thing
  btnFree.textContent=t.selectPlan;
  btnStart.textContent=t.selectPlan;
  btnPlus.textContent=t.selectPlan;
  btnPremium.textContent=t.selectPlan;
  $("tTopupLabel").textContent=t.topupLabel;
  btnTu5.textContent=t.tuBtn;btnTu10.textContent=t.tuBtn;btnTu20.textContent=t.tuBtn;
  $("tL1").innerHTML=t.l1;$("tL2").innerHTML=t.l2;
  $("tPrivacy").textContent=l==="de"?"Datenschutz":"Privacy";
  $("tLoginHint").textContent=t.loginHint;$("btnLogin").textContent=t.loginLink;
  $("backBtn").innerHTML=l==="de"?"&#8592; Zurück":"&#8592; Back";
  ["badgeFree","badgeStart","badgePlus","badgePremium"].forEach(id=>{
    const el=$(id);if(el)el.textContent=t.currentBadge;
  });
  updateEnabled();
}
$("langDE").onclick=()=>setLang("de");
$("langEN").onclick=()=>setLang("en");
$("backBtn").addEventListener("click",e=>{e.preventDefault();history.length>1?history.back():location.href="/";});

function updateEnabled(){allBtns.forEach(b=>b.disabled=false);btnFree.disabled=false;}
function highlightCheckboxes(){
  const labels=document.querySelectorAll(".legal label");
  labels.forEach(l=>{l.classList.remove("highlight");void l.offsetWidth;l.classList.add("highlight");});
  labels[0]?.scrollIntoView({behavior:"smooth",block:"center"});
  setTimeout(()=>labels.forEach(l=>l.classList.remove("highlight")),2000);
}
c1.onchange=updateEnabled;c2.onchange=updateEnabled;

function goLogin(){location.href=`/login/?redirect=${encodeURIComponent(location.pathname+location.search)}`;}
$("btnLogin").onclick=goLogin;

async function tok(){
  const{data:{session}}=await supabase.auth.getSession();
  if(!session?.access_token){goLogin();return null;}
  return session.access_token;
}
function lp(){return{termsAccepted:true,privacyAccepted:true,waiverAccepted:true,lang,at:new Date().toISOString()};}
function dis(v){allBtns.forEach(b=>b.disabled=v);}

async function checkout(plan){
  msg.textContent="";
  if(!(c1.checked&&c2.checked)){msg.textContent=L[lang].legal;highlightCheckboxes();return;}
  dis(true);
  try{
    const t=await tok();if(!t)return;
    const r=await fetch("/api/billing?action=checkout",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${t}`},body:JSON.stringify({plan,legal:lp()})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d?.url){msg.textContent=d?.error||L[lang].err;return;}
    location.href=d.url;
  }catch{msg.textContent=L[lang].err;}
  finally{updateEnabled();}
}
async function topup(pack){
  msg.textContent="";
  if(!(c1.checked&&c2.checked)){msg.textContent=L[lang].legal;highlightCheckboxes();return;}
  dis(true);
  try{
    const t=await tok();if(!t)return;
    const r=await fetch("/api/billing?action=topup",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${t}`},body:JSON.stringify({pack,legal:lp()})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d?.url){msg.textContent=d?.error||L[lang].tErr;return;}
    location.href=d.url;
  }catch{msg.textContent=L[lang].tErr;}
  finally{msg.textContent="";updateEnabled();}
}

btnFree.onclick=()=>checkout("free");
btnStart.onclick=()=>checkout("start");
btnPlus.onclick=()=>checkout("plus");
btnPremium.onclick=()=>checkout("premium");
btnTu5.onclick=()=>topup(5);btnTu10.onclick=()=>topup(10);btnTu20.onclick=()=>topup(20);

const PLAN_MAP={free:"planFree",start:"planStart",plus:"planPlus",premium:"planPremium"};

(async function(){
  setLang(lang);
  const{data:{session}}=await supabase.auth.getSession();
  if(!session?.access_token){$("loginHint").style.display="block";return;}
  try{
    const{data:sub}=await supabase.from("user_subscriptions").select("plan,is_active,status").eq("user_id",session.user.id).maybeSingle();
    const active=!!(sub?.is_active||sub?.status==="active");
    const key=active?(sub?.plan||"free"):"free";
    const el=$(PLAN_MAP[key]||"planFree");
    if(el){
      el.classList.add("current");
      const btn=el.querySelector(".plan-btn");
      if(btn)btn.textContent=L[lang].currentBadge;
    }
  }catch{}
})();
</script>
</body>
</html>

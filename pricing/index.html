<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sophie – Weiter</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html{ height:100%; }

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  background:#0b0f14;
  position:relative;
  overflow-x:hidden;
  overflow-y:auto;
  padding:24px 0 48px;
}

.bg{
  position:absolute; inset:-40px;
  background:
    radial-gradient(900px 500px at 20% 25%, rgba(140,180,255,.18), transparent 60%),
    radial-gradient(700px 500px at 80% 65%, rgba(255,170,210,.14), transparent 60%),
    radial-gradient(900px 600px at 50% 110%, rgba(120,255,210,.10), transparent 65%);
}

.wrap{
  width:min(640px,92vw);
  position:relative;
  z-index:2;
  margin:0 auto;
}

/* ── Top bar ── */
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
  font-size:13px;
  opacity:.85;
}

.lang{ display:flex; gap:8px; }
.lang span{
  cursor:pointer;
  padding:4px 8px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.15);
}
.lang .active{ background:white; color:#0b0f14; }

.back{
  color:rgba(255,255,255,.8);
  text-decoration:none;
  font-size:14px;
  font-weight:600;
  padding:6px 10px;
  border-radius:10px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);
  cursor:pointer;
}

/* ── Header ── */
.header{
  text-align:center;
  margin-bottom:28px;
}
.header h1{
  margin:0 0 10px;
  font-size:26px;
  font-weight:700;
  line-height:1.2;
}
.header p{
  margin:0;
  font-size:15px;
  color:rgba(255,255,255,.72);
  line-height:1.5;
}

/* ── Legal (shared across all buttons) ── */
.legal-block{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.10);
  border-radius:16px;
  padding:16px 20px;
  margin-bottom:20px;
}
.legal-block label{
  display:flex;
  gap:10px;
  font-size:13px;
  color:rgba(255,255,255,.75);
  line-height:1.5;
  margin-bottom:10px;
}
.legal-block label:last-child{ margin-bottom:0; }
.legal-block input[type=checkbox]{ flex-shrink:0; margin-top:2px; }
.legal-hint{
  font-size:12px;
  color:rgba(255,255,255,.45);
  text-align:center;
  margin-bottom:6px;
}

/* ── Primary row: Abo + €5 ── */
.primary-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:12px;
}

.card{
  border-radius:20px;
  padding:20px 18px;
  display:flex;
  flex-direction:column;
}

/* Abo — featured */
.card-abo{
  background:rgba(100,140,255,.13);
  border:1.5px solid rgba(120,160,255,.45);
  box-shadow:0 0 28px rgba(100,140,255,.12);
}

/* €5 top-up — prominent secondary */
.card-topup5{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.22);
}

.card-badge{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  padding:3px 9px;
  border-radius:8px;
  margin-bottom:12px;
  align-self:flex-start;
}
.badge-abo{ background:rgba(120,160,255,.22); color:#a8c4ff; }
.badge-topup5{ background:rgba(255,255,255,.12); color:rgba(255,255,255,.8); }

.card-name{
  font-size:14px;
  font-weight:600;
  color:rgba(255,255,255,.75);
  margin-bottom:4px;
}
.card-price{
  font-size:28px;
  font-weight:800;
  margin-bottom:3px;
  line-height:1;
}
.card-sub{
  font-size:12px;
  color:rgba(255,255,255,.5);
  margin-bottom:14px;
  flex:1;
}

.card-btn{
  width:100%;
  padding:13px 10px;
  border-radius:13px;
  border:0;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:opacity .15s;
  margin-top:0;
}
.card-btn:hover{ opacity:.9; }
.card-btn:disabled{ opacity:.45; cursor:not-allowed; }

.btn-abo{ background:white; color:#0b0f14; }
.btn-topup5{ background:rgba(255,255,255,.15); color:white; border:1px solid rgba(255,255,255,.25); }

/* ── Secondary row: €10 + €20 ── */
.secondary-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}

.secondary-label{
  font-size:11px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:rgba(255,255,255,.38);
  margin-bottom:10px;
  text-align:center;
}

.pack-btn{
  padding:12px 10px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);
  color:rgba(255,255,255,.75);
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:background .15s;
  width:100%;
}
.pack-btn:hover{ background:rgba(255,255,255,.10); }
.pack-btn:disabled{ opacity:.35; cursor:not-allowed; }
.pack-btn span{
  display:block;
  font-size:11px;
  font-weight:500;
  opacity:.6;
  margin-top:3px;
  letter-spacing:.02em;
}

/* ── Msg ── */
.msg{
  text-align:center;
  font-size:13px;
  color:rgba(255,255,255,.72);
  min-height:18px;
  margin-bottom:4px;
}

/* ── Login button ── */
.btn-login{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);
  color:rgba(255,255,255,.65);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:12px;
  display:none;
}
.btn-login:hover{ background:rgba(255,255,255,.10); }

/* ── Footer ── */
.footer{
  margin-top:20px;
  text-align:center;
  font-size:12px;
  opacity:.5;
}
.footer a{ color:white; text-decoration:none; }

/* ── Responsive ── */
@media (max-width:460px){
  .primary-row{ grid-template-columns:1fr; }
  .secondary-row{ grid-template-columns:1fr 1fr; }
  .card-price{ font-size:24px; }
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="wrap">

  <!-- Top bar -->
  <div class="top">
    <a class="back" id="backBtn" href="/">← Zurück</a>
    <div class="lang">
      <span id="langDE">DE</span>
      <span id="langEN">EN</span>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <h1 id="tH1"></h1>
    <p id="tLead"></p>
  </div>

  <!-- Legal checkboxes — shared, above all pay buttons -->
  <div class="legal-block">
    <label>
      <input type="checkbox" id="legal1">
      <span id="tLegal1"></span>
    </label>
    <label>
      <input type="checkbox" id="legal2">
      <span id="tLegal2"></span>
    </label>
  </div>

  <!-- Login button (hidden if logged in) -->
  <button class="btn-login" id="btnLogin"></button>

  <!-- Primary: Abo + €5 -->
  <div class="primary-row">

    <!-- Abo -->
    <div class="card card-abo">
      <div class="card-badge badge-abo" id="tAboBadge"></div>
      <div class="card-name" id="tAboName"></div>
      <div class="card-price">€19,90</div>
      <div class="card-sub" id="tAboSub"></div>
      <button class="card-btn btn-abo" id="btnAbo" disabled></button>
    </div>

    <!-- €5 Top-up -->
    <div class="card card-topup5">
      <div class="card-badge badge-topup5" id="tTopup5Badge"></div>
      <div class="card-name" id="tTopup5Name"></div>
      <div class="card-price">€5</div>
      <div class="card-sub" id="tTopup5Sub"></div>
      <button class="card-btn btn-topup5" id="btnTopup5" disabled></button>
    </div>

  </div>

  <!-- Secondary: €10 + €20 -->
  <div class="secondary-label" id="tMoreTime"></div>
  <div class="secondary-row">
    <button class="pack-btn" id="btnTopup10" disabled>
      €10
      <span id="tSophieTime10"></span>
    </button>
    <button class="pack-btn" id="btnTopup20" disabled>
      €20
      <span id="tSophieTime20"></span>
    </button>
  </div>

  <!-- Status message -->
  <div class="msg" id="msg"></div>

  <!-- Footer -->
  <div class="footer">
    <a href="/impressum.html">Impressum</a> ·
    <a href="/privacy.html" id="tPrivacy">Datenschutz</a>
  </div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://ohzfojsbmzinpxhcynpt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oemZvanNibXppbnB4aGN5bnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mzc1MjcsImV4cCI6MjA4NzAxMzUyN30.7eGSeEvOCj9vMqFJj9C0SR8DiiYygbFUvpQ8rIVEc0I";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TEXT = {
  de:{
    h1:"Noch nicht fertig.",
    lead:"Wähl deinen Weg — und wir machen gleich weiter.",
    aboBadge:"★ Beste Wahl",
    aboName:"Abo · monatlich",
    aboSub:"Bestes Preis-Leistungs-Verhältnis. Memory, Kontinuität, stabiler Zugang.",
    aboBtn:"Abo starten",
    topup5Badge:"⚡ Sofort los",
    topup5Name:"5€ Sophie Time",
    topup5Sub:"Ohne Bindung. Genau jetzt weitermachen.",
    topup5Btn:"€5 kaufen",
    moreTime:"Mehr Zeit",
    sophieTime10:"Sophie Time",
    sophieTime20:"Sophie Time",
    login:"Ich bin noch nicht eingeloggt",
    loading:"Einen Moment…",
    checkoutError:"Fehler beim Starten des Checkouts.",
    topupError:"Fehler beim Starten des Top-ups.",
    legalMissing:"Bitte bestätige beide Checkboxen.",
    privacy:"Datenschutz",
    legal1:`Ich akzeptiere die <a href="/terms.html" target="_blank" rel="noopener">AGB</a> und die <a href="/privacy.html" target="_blank" rel="noopener">Datenschutzerklärung</a>.`,
    legal2:`Ich stimme ausdrücklich zu, dass die Ausführung der Dienstleistung sofort beginnt. Mir ist bekannt, dass ich dadurch mein Widerrufsrecht verliere.`,
  },
  en:{
    h1:"Not done yet.",
    lead:"Choose your path — and we'll pick up right where we left off.",
    aboBadge:"★ Best Value",
    aboName:"Subscription · monthly",
    aboSub:"Best value. Memory, continuity, and reliable access.",
    aboBtn:"Start subscription",
    topup5Badge:"⚡ Start now",
    topup5Name:"€5 Sophie Time",
    topup5Sub:"No commitment. Continue right now.",
    topup5Btn:"Buy €5",
    moreTime:"More time",
    sophieTime10:"Sophie Time",
    sophieTime20:"Sophie Time",
    login:"I'm not logged in yet",
    loading:"One moment…",
    checkoutError:"Failed to start checkout.",
    topupError:"Failed to start top-up.",
    legalMissing:"Please confirm both checkboxes.",
    privacy:"Privacy Policy",
    legal1:`I accept the <a href="/terms.html" target="_blank" rel="noopener">Terms</a> and the <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.`,
    legal2:`I agree that the service begins immediately and acknowledge that I lose my right of withdrawal once the service starts.`,
  }
};

// Elements
const c1 = document.getElementById("legal1");
const c2 = document.getElementById("legal2");
const msg = document.getElementById("msg");
const btnAbo     = document.getElementById("btnAbo");
const btnTopup5  = document.getElementById("btnTopup5");
const btnTopup10 = document.getElementById("btnTopup10");
const btnTopup20 = document.getElementById("btnTopup20");
const btnLogin   = document.getElementById("btnLogin");

let currentLang = "en";
const navLang = (navigator.language || "").toLowerCase();
if (navLang.startsWith("de")) currentLang = "de";

function setLang(l){
  currentLang = l;
  document.getElementById("langDE").classList.toggle("active", l === "de");
  document.getElementById("langEN").classList.toggle("active", l === "en");

  const t = TEXT[l];
  document.getElementById("tH1").textContent          = t.h1;
  document.getElementById("tLead").textContent         = t.lead;
  document.getElementById("tAboBadge").textContent     = t.aboBadge;
  document.getElementById("tAboName").textContent      = t.aboName;
  document.getElementById("tAboSub").textContent       = t.aboSub;
  btnAbo.textContent                                   = t.aboBtn;
  document.getElementById("tTopup5Badge").textContent  = t.topup5Badge;
  document.getElementById("tTopup5Name").textContent   = t.topup5Name;
  document.getElementById("tTopup5Sub").textContent    = t.topup5Sub;
  btnTopup5.textContent                                = t.topup5Btn;
  document.getElementById("tMoreTime").textContent     = t.moreTime;
  document.getElementById("tSophieTime10").textContent = t.sophieTime10;
  document.getElementById("tSophieTime20").textContent = t.sophieTime20;
  document.getElementById("tLegal1").innerHTML         = t.legal1;
  document.getElementById("tLegal2").innerHTML         = t.legal2;
  document.getElementById("tPrivacy").textContent      = t.privacy;
  btnLogin.textContent                                 = t.login;
  document.getElementById("backBtn").textContent       = l === "de" ? "← Zurück" : "← Back";

  updateEnabled();
}

document.getElementById("langDE").onclick = () => setLang("de");
document.getElementById("langEN").onclick = () => setLang("en");

document.getElementById("backBtn").addEventListener("click", e => {
  e.preventDefault();
  if (history.length > 1) { history.back(); } else { window.location.href = "/"; }
});

function updateEnabled(){
  const ok = c1.checked && c2.checked;
  btnAbo.disabled     = !ok;
  btnTopup5.disabled  = !ok;
  btnTopup10.disabled = !ok;
  btnTopup20.disabled = !ok;
}
c1.onchange = updateEnabled;
c2.onchange = updateEnabled;

function goLogin(){
  const redirect = encodeURIComponent(window.location.pathname + window.location.search);
  window.location.href = `/login/?redirect=${redirect}`;
}
btnLogin.onclick = goLogin;

async function getTokenOrLogin(){
  const { data: { session } } = await supabase.auth.getSession();
  if (!session?.access_token) { goLogin(); return null; }
  return session.access_token;
}

function legalPayload(){
  return {
    termsAccepted:   true,
    privacyAccepted: true,
    waiverAccepted:  true,
    lang:            currentLang,
    at:              new Date().toISOString()
  };
}

function setAllDisabled(state){
  btnAbo.disabled     = state;
  btnTopup5.disabled  = state;
  btnTopup10.disabled = state;
  btnTopup20.disabled = state;
}

async function startCheckout(){
  msg.textContent = "";
  if (!(c1.checked && c2.checked)) { msg.textContent = TEXT[currentLang].legalMissing; return; }

  setAllDisabled(true);
  const prev = btnAbo.textContent;
  btnAbo.textContent = TEXT[currentLang].loading;

  try {
    const token = await getTokenOrLogin();
    if (!token) return;

    const res = await fetch("/api/billing?action=checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ plan: "plus", legal: legalPayload() }),
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data?.url) {
      msg.textContent = data?.error ? `Error: ${data.error}` : TEXT[currentLang].checkoutError;
      return;
    }
    window.location.href = data.url;

  } catch { msg.textContent = TEXT[currentLang].checkoutError; }
  finally { btnAbo.textContent = prev; updateEnabled(); }
}

async function startTopup(pack){
  msg.textContent = "";
  if (!(c1.checked && c2.checked)) { msg.textContent = TEXT[currentLang].legalMissing; return; }

  setAllDisabled(true);
  msg.textContent = currentLang === "de" ? "Checkout wird geöffnet…" : "Opening checkout…";

  try {
    const token = await getTokenOrLogin();
    if (!token) return;

    const res = await fetch("/api/billing?action=topup", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ pack, legal: legalPayload() }),
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data?.url) {
      msg.textContent = data?.error ? `Error: ${data.error}` : TEXT[currentLang].topupError;
      return;
    }
    window.location.href = data.url;

  } catch { msg.textContent = TEXT[currentLang].topupError; }
  finally { msg.textContent = ""; updateEnabled(); }
}

btnAbo.onclick      = startCheckout;
btnTopup5.onclick   = () => startTopup(5);
btnTopup10.onclick  = () => startTopup(10);
btnTopup20.onclick  = () => startTopup(20);

(async function init(){
  setLang(currentLang);
  const { data: { session } } = await supabase.auth.getSession();
  if (session?.access_token) {
    btnLogin.style.display = "none";
  } else {
    btnLogin.style.display = "block";
  }
})();
</script>

</body>
</html>

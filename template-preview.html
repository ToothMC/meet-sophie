<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Template Preview</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
  .tab-bar { display: flex; gap: 0; margin-bottom: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
  .tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; background: #ddd; border: none; font-family: inherit; }
  .tab:first-child { border-radius: 10px 0 0 10px; }
  .tab:last-child { border-radius: 0 10px 10px 0; }
  .tab.active { background: #111; color: #fff; }
  .preview { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  .preview-frame { display: none; }
  .preview-frame.active { display: block; }
</style>
</head>
<body>

<div class="tab-bar">
  <button class="tab active" onclick="show('talk')">Talk mit Sophie</button>
  <button class="tab" onclick="show('meeting')">Meeting Report</button>
  <button class="tab" onclick="show('scorecard')">ScoreCard</button>
</div>

<div class="preview">
  <div id="talk" class="preview-frame active"></div>
  <div id="meeting" class="preview-frame"></div>
  <div id="scorecard" class="preview-frame"></div>
</div>

<script>
function show(id) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['talk','meeting','scorecard'][i] === id));
  document.querySelectorAll('.preview-frame').forEach(f => f.classList.toggle('active', f.id === id));
}
</script>

<script type="module">
import { DEFAULT_TEMPLATES } from './lib/report-templates.js';
document.getElementById('talk').innerHTML = DEFAULT_TEMPLATES.default;
document.getElementById('meeting').innerHTML = DEFAULT_TEMPLATES.meeting;
document.getElementById('scorecard').innerHTML = DEFAULT_TEMPLATES.salespitch;
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#faf9f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sophie — Meeting Mode</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:#2a2420;background:#faf9f6;
  display:flex;flex-direction:column;
  min-height:100vh;min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---- TOPBAR / BANNER ---- */
.topbar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;
  padding-top:max(12px, env(safe-area-inset-top));
  background:rgba(250,249,246,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid #ede8e2;
}
.topbar .back{
  color:#7a6a5a;text-decoration:none;font-size:14px;
  padding:6px 10px;border-radius:8px;
  background:rgba(0,0,0,.04);border:1px solid #ede8e2;
  white-space:nowrap;
}
.topbar .back:hover{background:rgba(0,0,0,.08);color:#2a2420}
.topbar .title{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2a2420}
/* Phase badge, participants bar, recording status — hidden (clean UI) */
.phase-badge{display:none!important}
.participants-bar{display:none!important}
#recordingStatus{display:none!important}
@keyframes sophiePulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ---- SETUP SCREEN ---- */
.setup-screen{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.setup-card{
  width:100%;max-width:420px;
  background:#fff;border:1px solid #ede8e2;
  border-radius:16px;padding:28px 24px;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
}
.setup-card h2{font-size:20px;font-weight:600;margin:0 0 20px;text-align:center;color:#2a2420}
.setup-card label{
  display:block;font-size:12px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:#a09080;margin-bottom:6px;margin-top:16px;
}
.setup-card label:first-of-type{margin-top:0}
.setup-card input[type="text"]{
  width:100%;padding:12px 14px;font-size:16px;
  background:#fff;border:1px solid #ede8e2;
  border-radius:10px;color:#2a2420;outline:none;
  font-family:inherit;min-height:48px;
}
.setup-card input[type="text"]:focus{border-color:#c4a882}
.type-pill{
  padding:10px 18px;font-size:14px;font-weight:600;
  border:1px solid #ede8e2;border-radius:10px;
  background:#fff;color:#7a6a5a;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
.type-pill:hover{border-color:#c4a882;color:#2a2420}
.type-pill.active{background:#2a2420;color:#fff;border-color:#2a2420}
#parentMeetingSelect{
  width:100%;padding:12px 14px;font-size:14px;
  border:1px solid #ede8e2;border-radius:10px;
  background:#fff;color:#2a2420;cursor:pointer;
  font-family:inherit;appearance:auto;
  -webkit-appearance:menulist;
}
.setup-card .btn-primary{
  display:block;width:100%;margin-top:24px;padding:14px;font-size:16px;font-weight:700;
  border:none;border-radius:12px;cursor:pointer;
  background:#2a2420;color:#fff;
  font-family:inherit;
}
.setup-card .btn-primary:disabled{opacity:.5;cursor:not-allowed}

/* ---- MAIN MEETING AREA ---- */
.meeting-area{
  flex:1;display:none;flex-direction:column;
  max-width:680px;width:100%;margin:0 auto;
}
.meeting-area.active{display:flex}

/* ---- CONTEXT PANEL ---- */
.context-panel{
  border-bottom:1px solid #ede8e2;
  overflow:hidden;transition:max-height .3s ease;
}
.context-panel.collapsed .context-body{display:none}
.context-toggle{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;cursor:pointer;user-select:none;
  font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:#a09080;
}
.context-toggle:hover{color:#2a2420}
.context-toggle .arrow{transition:transform .2s}
.context-panel.collapsed .context-toggle .arrow{transform:rotate(-90deg)}
.context-body{padding:0 16px 12px}
.context-body textarea{
  width:100%;padding:8px 10px;font-size:13px;line-height:1.5;
  background:#fff;border:1px solid #ede8e2;
  border-radius:8px;color:#2a2420;resize:vertical;min-height:60px;
  font-family:inherit;outline:none;margin-bottom:8px;
}
.context-body textarea:focus{border-color:#c4a882}
.context-body textarea::placeholder{color:#b0a090}
.save-context-btn{
  font-size:12px;padding:5px 12px;border-radius:6px;
  background:rgba(0,0,0,.04);border:1px solid #ede8e2;
  color:#7a6a5a;cursor:pointer;font-family:inherit;
}
.save-context-btn:hover{background:rgba(0,0,0,.08);color:#2a2420}

/* ---- CHAT ---- */
.chat-area{
  flex:1;overflow-y:auto;padding:16px;
  display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.msg{
  max-width:85%;padding:10px 14px;border-radius:14px;
  font-size:14px;line-height:1.55;word-wrap:break-word;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.user{
  align-self:flex-end;
  background:#2a2420;color:#fff;
  border-bottom-right-radius:4px;
}
.msg.assistant{
  align-self:flex-start;
  background:#fff;color:#2a2420;
  border:1px solid #ede8e2;
  border-bottom-left-radius:4px;
}
.msg.system{
  align-self:center;text-align:center;
  font-size:12px;color:#a09080;
  background:none;padding:4px;
}
.msg.assistant .typing-dots{display:inline-block}
.msg.assistant .typing-dots::after{content:'...';animation:dots 1.2s infinite}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}100%{content:'.'}}

/* ---- INPUT BAR ---- */
.input-bar{
  display:flex;align-items:flex-end;gap:8px;
  padding:12px 16px;
  padding-bottom:max(12px, env(safe-area-inset-bottom));
  border-top:1px solid #ede8e2;
  background:rgba(250,249,246,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.input-bar textarea{
  flex:1;padding:10px 14px;font-size:14px;line-height:1.5;
  background:#fff;border:1px solid #ede8e2;
  border-radius:12px;color:#2a2420;resize:none;
  min-height:42px;max-height:120px;
  font-family:inherit;outline:none;
}
.input-bar textarea:focus{border-color:#c4a882}
.input-bar textarea::placeholder{color:#b0a090}
.send-btn{
  padding:10px 16px;font-size:14px;font-weight:600;
  background:#34c47a;color:#000;border:none;border-radius:12px;
  cursor:pointer;white-space:nowrap;font-family:inherit;
}
.send-btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- PHASE CTA ---- */
.phase-cta{
  padding:10px 16px;text-align:center;
  border-top:1px solid #ede8e2;
}
.phase-cta button{
  padding:10px 24px;font-size:14px;font-weight:700;
  border:none;border-radius:10px;cursor:pointer;
  font-family:inherit;
}
.phase-cta .cta-live{background:#34c47a;color:#fff}
.phase-cta .cta-post{background:#ef4444;color:#fff}
.phase-cta .cta-close{background:rgba(0,0,0,.06);color:#2a2420;border:1px solid #ede8e2}

/* ---- REPORT CARD ---- */
.report-card{
  margin:16px;padding:20px;
  background:#fff;border:1px solid #ede8e2;
  border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.04);
}

/* ---- FILE UPLOAD ---- */
.upload-area{
  margin-top:8px;padding:12px;
  border:2px dashed #ede8e2;border-radius:10px;
  text-align:center;cursor:pointer;transition:border-color .2s;
}
.upload-area:hover{border-color:#c4a882}
.upload-area input[type="file"]{display:none}
.upload-area .upload-label{
  font-size:12px;color:#a09080;
}
.upload-area .upload-label:hover{color:#2a2420}
.file-list{margin-top:8px}
.file-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;margin-bottom:4px;
  background:#fff;border:1px solid #ede8e2;
  border-radius:8px;font-size:12px;color:#5a4a40;
}
.file-item .file-icon{font-size:14px;flex-shrink:0}
.file-item .file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .file-status{font-size:10px;color:#34c47a}
.uploading{opacity:.5}

/* ---- HINT MESSAGES ---- */
.msg.assistant.hint{
  border-left:3px solid #eab308;
  background:#fffbeb;
  font-size:13px;
  color:#5a4a40;
}

/* ---- FOLLOWUP DIFF ---- */
.diff-section{margin-top:16px;border-top:1px solid #ede8e2;padding-top:14px}
.diff-section h4{
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#a09080;margin:0 0 8px;
}
.diff-item{
  font-size:13px;line-height:1.5;padding:4px 0;
  color:#3a3028;
  border-bottom:1px solid #f0ece6;
  display:flex;align-items:center;gap:8px;
}
.diff-item:last-child{border-bottom:none}
.diff-icon{font-size:14px;flex-shrink:0}
.diff-icon.done{color:#34d399}
.diff-icon.open{color:#f5c842}
.diff-icon.escalated{color:#ff5a5a}
.diff-icon.new{color:#6cb4ff}

/* ---- MUTE TOGGLE ---- */
.mute-toggle{
  padding:6px 10px;font-size:13px;border-radius:8px;cursor:pointer;
  border:1px solid #ede8e2;background:rgba(0,0,0,.03);
  color:#a09080;transition:all .2s;white-space:nowrap;
  font-family:inherit;display:none;
}
.mute-toggle:hover{background:rgba(0,0,0,.06);color:#2a2420}
.mute-toggle.active{
  background:rgba(52,196,122,.1);border-color:rgba(52,196,122,.3);
  color:#22c55e;
}
.mute-toggle.active .mute-icon::after{content:"🔊"}
.mute-toggle .mute-icon::after{content:"🔇"}

/* ---- PARTICIPANTS BAR ---- */
.participants-bar{
  display:none;align-items:center;gap:6px;
  padding:6px 16px;font-size:12px;color:#a09080;
  border-bottom:1px solid #ede8e2;
  overflow-x:auto;white-space:nowrap;
}
.participants-bar.visible{display:flex}
.participant-chip{
  padding:3px 8px;border-radius:10px;font-size:11px;
  background:#fff;border:1px solid #ede8e2;
  color:#5a4a40;flex-shrink:0;
}
.participant-chip.sophie{
  background:rgba(52,196,122,.12);border-color:rgba(52,196,122,.2);
  color:#34c47a;transition:all .3s;
}
.participant-chip.sophie.speaking{
  background:rgba(52,196,122,.25);border-color:rgba(52,196,122,.5);
  animation:pulse-speak 1.2s infinite;
}
@keyframes pulse-speak{0%,100%{box-shadow:0 0 0 0 rgba(52,196,122,.3)}50%{box-shadow:0 0 0 6px rgba(52,196,122,0)}}

/* ---- EXPORT BUTTON ---- */
.export-bar{
  display:flex;gap:8px;margin-top:12px;
}
/* Export section labels */
.report-export-title{
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:#b0a090;font-weight:600;text-align:center;margin:12px 0 6px;
}
.export-row{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
}
.export-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:20px;
  background:none;border:1px solid #ddd6cc;color:#6a5a50;
  font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:all .18s ease;
}
.export-btn:hover{background:#f0ece6;border-color:#c4a882;color:#2c2420}
.export-btn.primary{background:#2c2420;color:#faf9f6;border-color:#2c2420}
.export-btn.primary:hover{background:#3d3028;border-color:#3d3028;color:#faf9f6}

/* ---- LOADING ---- */
.loading-screen{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#a09080;
}
.hidden{display:none!important}

/* ---- LIVE TIMER ---- */
.live-timer{
  font-size:12px;color:rgba(255,90,90,.7);font-weight:600;
  letter-spacing:.04em;text-align:center;padding:4px;
}
</style>
</head>
<body>

<!-- Auth Loading -->
<div id="authLoading" class="loading-screen">
  <p>Loading...</p>
</div>

<!-- Setup Screen (create new meeting) -->
<div id="setupScreen" class="setup-screen hidden">
  <div class="setup-card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <a href="/" style="color:#7a6a5a;text-decoration:none;font-size:20px;line-height:1">&larr;</a>
      <h2 id="setupTitle" style="margin:0;flex:1">New Meeting</h2>
    </div>

    <label id="lblType">Meeting Type</label>
    <div id="meetingTypePills" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px">
      <button type="button" class="type-pill active" data-value="team">Team</button>
      <button type="button" class="type-pill" data-value="client">Client</button>
      <button type="button" class="type-pill" data-value="strategy">Strategy</button>
      <button type="button" class="type-pill" data-value="other">Other</button>
    </div>

    <label id="lblTitle">Title (optional)</label>
    <input type="text" id="meetingTitle" placeholder="e.g. Q2 Planning" />

    <label id="lblParent">Previous Meeting (optional)</label>
    <select id="parentMeetingSelect">
      <option value="">—</option>
    </select>

    <button class="btn-primary" id="createBtn">Start Preparation</button>
  </div>
</div>

<!-- Meeting Area -->
<div id="meetingArea" class="meeting-area">
  <!-- Topbar -->
  <div class="topbar">
    <a href="/talk/" class="back" id="backBtn">&larr;</a>
    <span class="title" id="meetingTitleDisplay">Meeting</span>
    <button class="mute-toggle" id="muteToggle"><span class="mute-icon"></span> Sophie</button>
    <button class="mute-toggle" id="meetingPauseBtn" style="display:none">⏸ Pause</button>
    <span class="phase-badge" id="phaseBadge" data-phase="prep">PREP</span>
  </div>

  <!-- Participants Bar -->
  <div class="participants-bar" id="participantsBar"></div>

  <!-- Context Panel (PREP phase) -->
  <div class="context-panel" id="contextPanel">
    <div class="context-toggle" id="contextToggle">
      <span class="arrow">&#x25BE;</span> <span id="ctxLabel">Context</span>
    </div>
    <div class="context-body">
      <textarea id="ctxAgenda" placeholder="Agenda..." rows="2"></textarea>
      <textarea id="ctxParticipants" placeholder="Participants..." rows="2"></textarea>
      <textarea id="ctxGoal" placeholder="Goal of this meeting..." rows="2"></textarea>
      <button class="save-context-btn" id="saveContextBtn">Save Context</button>

      <!-- File Upload -->
      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept=".pdf,.docx,.pptx,.txt,.png,.jpg,.jpeg,.webp" multiple />
        <span class="upload-label" id="uploadLabel">📎 Drop files or click to upload</span>
        <div style="font-size:10px;color:#a09080;margin-top:4px" id="uploadHint">TXT, DOCX, PDF, Images</div>
      </div>
      <div class="file-list" id="fileList"></div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea"></div>

  <!-- Live Timer -->
  <div class="live-timer hidden" id="liveTimer"></div>

  <!-- Input Bar -->
  <!-- Sophie status indicator -->
  <div id="sophieStatus" style="display:none;text-align:center;padding:6px 12px;font-size:12px;color:#c4a882;animation:sophiePulse 2s ease-in-out infinite"></div>

  <div class="input-bar" id="inputBar">
    <textarea id="chatInput" placeholder="Type here..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" disabled>Send</button>
  </div>

  <!-- Recording Status (visible during live phase) -->
  <div id="recordingStatus" class="hidden" style="display:none;padding:6px 12px;font-size:11px;font-family:monospace;background:#f0f0f0;border-radius:8px;margin:8px 0;color:#666;line-height:1.6">
    🔴 REC: <span id="recStatusText">—</span>
  </div>

  <!-- Phase CTA -->
  <div class="phase-cta" id="phaseCta">
    <button class="cta-live" id="ctaLive">Start Meeting &rarr;</button>
    <button class="cta-post hidden" id="ctaPost">End Meeting &rarr;</button>
    <button class="cta-close hidden" id="ctaClose">Close</button>
  </div>

  <!-- Report Card (POST phase) — single source, no separate summary -->
  <div class="report-card hidden" id="summaryCard">
    <div id="reportProgress" style="margin-bottom:16px">
      <div style="font-size:15px;font-weight:600;color:#2a2420;margin-bottom:10px" id="reportTitle">Erstelle Sitzungsprotokoll...</div>
      <div style="height:6px;background:#e5e7eb;border-radius:6px;overflow:hidden">
        <div id="reportProgressBar" style="height:100%;background:linear-gradient(90deg,#c4a882,#8B7355);width:5%;transition:width .6s ease;border-radius:6px"></div>
      </div>
      <div style="font-size:12px;color:#a09080;margin-top:8px" id="reportProgressLabel">Daten werden aufbereitet...</div>
    </div>
    <div id="reportPreview" class="hidden" style="border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#fff">
      <iframe id="reportFrame" style="width:100%;border:none;min-height:400px" sandbox="allow-same-origin"></iframe>
    </div>
    <div id="reportActions" class="hidden">
      <div class="report-export-title">Inhalt</div>
      <div class="export-row" style="gap:16px">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#6a5a50;cursor:pointer;user-select:none">
          <input type="checkbox" id="optLeanCheck" checked onchange="onReportOptionChange()" style="accent-color:#c4a882;width:16px;height:16px"> Lean Check
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#6a5a50;cursor:pointer;user-select:none">
          <input type="checkbox" id="optTranscript" onchange="onReportOptionChange()" style="accent-color:#c4a882;width:16px;height:16px"> Gesprächsverlauf
        </label>
        <button class="export-btn" id="reportRegenerateBtn" disabled style="opacity:.4"><span>Aktualisieren</span></button>
      </div>

      <div class="report-export-title">Export</div>
      <div class="export-row">
        <button class="export-btn" id="reportCopyBtn"><span>Kopieren</span></button>
        <button class="export-btn" id="reportPrintBtn"><span>PDF</span></button>
        <button class="export-btn primary" id="reportDownloadFullBtn"><span>Herunterladen</span></button>
      </div>

      <div class="report-export-title">Layout</div>
      <div class="export-row">
        <button class="export-btn" id="reportTemplateBtn"><span>Als Vorlage</span></button>
      </div>
    </div>
  </div>
</div>

<!-- Meeting History (list of past meetings) -->
<div id="historyScreen" class="hidden" style="padding:20px;max-width:680px;margin:0 auto;width:100%">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
    <a href="/" style="color:#7a6a5a;text-decoration:none;font-size:14px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.04);border:1px solid #ede8e2;white-space:nowrap">&larr;</a>
    <h2 style="font-size:18px;font-weight:600;margin:0;flex:1;color:#2a2420" id="historyTitle">Meetings</h2>
    <button id="newMeetingBtn" style="padding:8px 16px;font-size:13px;font-weight:600;background:#2a2420;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit">+ New</button>
  </div>
  <div id="historyList"></div>
</div>

<script type="module">

// ---------------------------------------------------------------------------
// API helpers
// ---------------------------------------------------------------------------
async function api(action, body = null, method = "POST") {
  const opts = {
    method,
    headers: { "Content-Type": "application/json" },
  };
  if (accessToken) opts.headers.Authorization = `Bearer ${accessToken}`;

  let url = `/api/meeting?action=${action}`;
  if (body && method === "GET") {
    // For GET requests, append id to query
    if (body.id) url += `&id=${body.id}`;
    opts.method = "GET";
    opts.body = undefined;
  } else if (body) {
    opts.body = JSON.stringify(body);
  }

  const res = await fetch(url, opts);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error(`Server error (${res.status})`); }
  if (!res.ok) {
    const err = new Error(data.error || `HTTP ${res.status}`);
    err.status = res.status;
    err.redirect = data.redirect;
    throw err;
  }
  return data;
}

// ---------------------------------------------------------------------------
// Auth

async function initAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = "/login/";
    return;
  }
  currentUser = session.user;
  accessToken = session.access_token;

  // Check URL for meeting_id and test mode
  const params = new URLSearchParams(window.location.search);
  const urlMeetingId = params.get("id");
  if (params.has("test")) window.__testMode = true;

  authLoading.classList.add("hidden");

  if (urlMeetingId) {
    await loadMeeting(urlMeetingId);
  } else {
    // Go directly to setup (new meeting) — history accessible via back button
    await showSetup();
  }
}

async function showHistory() {
  setupScreen.classList.add("hidden");
  meetingArea.classList.remove("active");
  historyScreen.classList.remove("hidden");

  const list = $("historyList");
  list.innerHTML = '<p style="color:#a09080;font-size:14px">' + t("loading") + '</p>';

  try {
    const data = await api("list", null, "GET");
    // Only show meetings with content (summary or notes)
    const meetings = (data.meetings || []).filter(m => m.has_summary || m.phase === "live");

    if (meetings.length === 0) {
      list.innerHTML = '<p style="color:#a09080;font-size:14px;text-align:center;padding:40px 0">No meetings yet.</p>';
      return;
    }

    // Clean up titles: remove _XX suffixes and add date for disambiguation
    function cleanMeetingTitle(m) {
      let title = m.title || m.meeting_type;
      // Remove _XX numeric suffix (e.g. "Markteinführung_10" → "Markteinführung")
      title = title.replace(/_\d+$/, '');
      // Add date suffix for clarity
      const d = new Date(m.created_at);
      const dateStr = `${d.getDate().toString().padStart(2,'0')}.${(d.getMonth()+1).toString().padStart(2,'0')}.`;
      return `${title} (${dateStr})`;
    }

    list.innerHTML = meetings.map(m => {
      const date = new Date(m.created_at).toLocaleDateString(lang === "de" ? "de-DE" : lang === "fr" ? "fr-FR" : "en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      const phaseColors = { prep: "#3b82f6", live: "#ef4444", post: "#8b5cf6", closed: "#999" };
      const displayTitle = cleanMeetingTitle(m);
      return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <a href="/meeting/?id=${m.id}" style="flex:1;display:block;padding:12px 14px;background:#fff;border:1px solid #ede8e2;border-radius:10px;text-decoration:none;color:#2a2420;box-shadow:0 1px 4px rgba(0,0,0,.04)">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:14px;font-weight:500">${escapeHtml(displayTitle)}</span>
            <span style="font-size:11px;font-weight:600;color:${phaseColors[m.phase] || '#999'};text-transform:uppercase">${escapeHtml(m.phase)}</span>
          </div>
          <div style="font-size:12px;color:#a09080;margin-top:4px">${escapeHtml(date)} &middot; ${escapeHtml(m.meeting_type)}</div>
        </a>
        <button onclick="deleteMeeting('${m.id}',this)" style="padding:8px;font-size:16px;background:none;border:1px solid #ede8e2;border-radius:8px;cursor:pointer;color:#b0a090;flex-shrink:0" title="${lang === "de" ? "Löschen" : "Delete"}">🗑</button>
      </div>`;
    }).join("");
  } catch (e) {
    list.innerHTML = `<p style="color:#ff5a5a;font-size:13px">Error: ${e.message}</p>`;
  }
}

let selectedMeetingType = "team";
let selectedParentId = null;

async function showSetup() {
  historyScreen.classList.add("hidden");
  meetingArea.classList.remove("active");
  setupScreen.classList.remove("hidden");

  // Type pills click handler
  $("meetingTypePills").onclick = (e) => {
    const pill = e.target.closest(".type-pill");
    if (!pill) return;
    $("meetingTypePills").querySelectorAll(".type-pill").forEach(p => p.classList.remove("active"));
    pill.classList.add("active");
    selectedMeetingType = pill.dataset.value;
  };

  // Load past meetings for parent selector as dropdown
  const parentSelect = $("parentMeetingSelect");
  try {
    const data = await api("list", null, "GET");
    const meetings = (data.meetings || []).filter(m => (m.phase === "closed" || m.phase === "post") && m.has_summary);
    if (meetings.length) {
      for (const m of meetings.slice(0, 15)) {
        const d = new Date(m.created_at);
        const date = d.toLocaleDateString(lang === "de" ? "de-DE" : lang === "fr" ? "fr-FR" : "en-US", { month: "short", day: "numeric" });
        const time = d.toLocaleTimeString(lang === "de" ? "de-DE" : "en-US", { hour: "2-digit", minute: "2-digit" });
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = `${m.title || m.meeting_type} — ${date}, ${time}`;
        opt.dataset.title = m.title || m.meeting_type;
        parentSelect.appendChild(opt);
      }
    }
  } catch {}

  // Parent select change → prefill title + load context from parent
  parentSelect.onchange = async () => {
    const opt = parentSelect.selectedOptions[0];
    if (opt?.value) {
      selectedParentId = opt.value;
      $("meetingTitle").value = opt.dataset.title || "";
      // Pre-load parent data — store for after createMeeting
      try {
        const parentData = await api("get", { id: opt.value }, "GET");
        const contexts = parentData.context || [];
        const parentParticipants = contexts.find(c => c.context_type === "participants");
        const summary = parentData.summary;

        window.__parentPrefill = {};

        if (parentParticipants?.content) {
          window.__parentPrefill.participants = parentParticipants.content;
        }

        // Build agenda from structured summary (action_items, open_points)
        if (summary) {
          const items = [];
          const extract = (arr) => (arr || []).forEach(a => {
            let text = typeof a === "string" ? a : (a.text || "");
            text = text.trim().split(/[.!?]/)[0].trim();
            if (text.length > 60) text = text.slice(0, 57) + "…";
            if (text) items.push("• " + text);
          });
          extract(summary.action_items);
          extract(summary.open_points);
          if (items.length) window.__parentPrefill.agenda = items.join("\n");
        }
      } catch (e) {
        console.log("Could not load parent meeting data:", e);
      }
    } else {
      selectedParentId = null;
      $("meetingTitle").value = "";
      window.__parentPrefill = null;
    }
  };
}

async function createMeeting() {
  const btn = $("createBtn");
  btn.disabled = true;

  try {
    const data = await api("create", {
      meeting_type: selectedMeetingType,
      sophie_role: "co-think",
      title: $("meetingTitle").value.trim() || null,
      parent_meeting_id: selectedParentId,
    });

    meetingId = data.meeting.id;
    window.history.replaceState({}, "", `/meeting/?id=${meetingId}`);
    await loadMeeting(meetingId);
  } catch (e) {
    if (e.status === 402) {
      window.location.href = e.redirect || "/pricing";
      return;
    }
    alert("Error: " + e.message);
  } finally {
    btn.disabled = false;
  }
}

// ---------------------------------------------------------------------------
// Load meeting
// ---------------------------------------------------------------------------
async function loadMeeting(id) {
  // Reset all transcript state from previous meetings
  speechTranscript.length = 0;
  voiceTranscript.length = 0;
  chatMessages.length = 0;
  userTranscriptBuffer.clear();
  partialAssistant = "";
  lastAssistantFinal = "";
  audioChunks = [];

  setupScreen.classList.add("hidden");
  historyScreen.classList.add("hidden");
  meetingArea.classList.add("active");

  try {
    const data = await api("get", { id }, "GET");
    meetingId = id;
    meetingData = data.meeting;
    chatMessages = [];

    // Update UI
    titleDisplay.textContent = meetingData.title || meetingData.meeting_type;
    updatePhaseUI(meetingData.phase);

    // Load context into fields
    const contexts = data.context || [];
    const agendaCtx = contexts.find(c => c.context_type === "agenda");
    const partCtx = contexts.find(c => c.context_type === "participants");
    const goalCtx = contexts.find(c => c.context_type === "goal");
    if (agendaCtx) $("ctxAgenda").value = agendaCtx.content;
    if (partCtx) $("ctxParticipants").value = partCtx.content;
    if (goalCtx) $("ctxGoal").value = goalCtx.content;

    // Apply parent meeting prefill (stored during setup)
    if (window.__parentPrefill) {
      if (window.__parentPrefill.agenda && !agendaCtx) {
        $("ctxAgenda").value = window.__parentPrefill.agenda;
        autoResizeTextarea($("ctxAgenda"));
      }
      if (window.__parentPrefill.participants && !partCtx) {
        $("ctxParticipants").value = window.__parentPrefill.participants;
        autoResizeTextarea($("ctxParticipants"));
      }
      window.__parentPrefill = null;
    }

    // Load existing uploaded files
    const fileContexts = contexts.filter(c => c.context_type === "file");
    const fileListEl = $("fileList");
    fileListEl.innerHTML = "";
    fileContexts.forEach(fc => {
      const fileName = fc.file_path ? fc.file_path.split("/").pop().replace(/^\d+_/, "") : "File";
      const div = document.createElement("div");
      div.className = "file-item";
      div.innerHTML = `<span class="file-icon">📎</span><span class="file-name">${fileName}</span><span class="file-status">✓</span>`;
      fileListEl.appendChild(div);
    });

    // Load existing notes as system messages
    const notes = data.notes || [];
    notes.forEach(n => {
      if (n.note_type === "silent_hint") return; // Don't show hint internals
      appendSystemMsg(`[${n.note_type.toUpperCase()}] ${n.content}`);
    });

    // Show report card if meeting has a report session
    if (meetingData.session_id && (meetingData.phase === "post" || meetingData.phase === "closed")) {
      meetingReportSessionId = meetingData.session_id;
      $("summaryCard").classList.remove("hidden");
      pollMeetingReport(meetingReportSessionId);
    }

    // Auto-send opener in prep phase — short, no AI call needed
    if (meetingData.phase === "prep" && notes.length === 0) {
      const openerText = lang === "de"
        ? "Wenn du Hilfe brauchst, sag Bescheid. Ich bin da!"
        : lang === "fr"
        ? "Si tu as besoin d'aide, dis-le moi. Je suis là !"
        : "If you need help, just ask. I'm here!";
      appendMsg("assistant", openerText);
    }
  } catch (e) {
    chatArea.innerHTML = `<div class="msg system">Error loading meeting: ${e.message}</div>`;
  }
}

// ---------------------------------------------------------------------------
// Phase UI management
// ---------------------------------------------------------------------------
function updatePhaseUI(phase) {
  phaseBadge.textContent = phase.toUpperCase();
  phaseBadge.dataset.phase = phase;

  // Context panel: only in prep
  contextPanel.classList.toggle("hidden", phase !== "prep");

  // CTA buttons
  ctaLive.classList.toggle("hidden", phase !== "prep");
  ctaPost.classList.toggle("hidden", phase !== "live");
  ctaClose.classList.toggle("hidden", phase !== "post");
  phaseCta.classList.toggle("hidden", phase === "closed");

  // Input bar: disabled in closed, placeholder changes per phase
  $("inputBar").classList.toggle("hidden", phase === "closed");
  const PHASE_PLACEHOLDERS = {
    de: { prep: "Frage Sophie zur Vorbereitung...", live: "Was passiert gerade im Meeting?", post: "Fragen zur Zusammenfassung..." },
    en: { prep: "Ask Sophie about preparation...", live: "What's happening in the meeting?", post: "Questions about the summary..." },
    fr: { prep: "Demande \u00e0 Sophie pour la pr\u00e9paration...", live: "Que se passe-t-il en r\u00e9union ?", post: "Questions sur le r\u00e9sum\u00e9 ?" },
  };
  chatInput.placeholder = (PHASE_PLACEHOLDERS[lang] || PHASE_PLACEHOLDERS.en)[phase] || t("typeHere");

  // Summary card visibility
  if (phase !== "post" && phase !== "closed") {
    summaryCard.classList.add("hidden");
  }

  // Live timer
  if (phase === "live") {
    startLiveTimer();
  } else {
    stopLiveTimer();
  }

  // Mute toggle: visible in live + post phases
  muteToggle.style.display = (phase === "live" || phase === "post") ? "inline-flex" : "none";

  // Participants bar: visible when meeting is loaded
  updateParticipantsBar();

  // Focus: agenda field in prep, chat input in live
  if (phase === "prep") {
    setTimeout(() => $("ctxAgenda")?.focus(), 100);
  } else if (phase === "live") {
    setTimeout(() => chatInput?.focus(), 100);
  }
}

function startLiveTimer() {
  liveStartTime = meetingData?.started_at ? new Date(meetingData.started_at).getTime() : Date.now();
  liveTimerEl.classList.remove("hidden");
  liveTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - liveStartTime) / 1000);
    const m = Math.floor(elapsed / 60).toString().padStart(2, "0");
    const s = (elapsed % 60).toString().padStart(2, "0");
    liveTimerEl.textContent = `LIVE ${m}:${s}`;
  }, 1000);
}

function stopLiveTimer() {
  clearInterval(liveTimerInterval);
  liveTimerEl.classList.add("hidden");
}

// ---------------------------------------------------------------------------
async function transitionPhase(newPhase) {
  // Guard: skip if already in this phase
  if (meetingData?.phase === newPhase) {
    console.log(`[meeting] skipping transition — already in phase "${newPhase}"`);
    return;
  }
  try {
    const data = await api("phase", { meeting_id: meetingId, phase: newPhase });
    meetingData = { ...meetingData, ...data.meeting };
    updatePhaseUI(newPhase);
    // Phase info messages
    const PHASE_INFO = {
      de: {
        live: "🟢 LIVE — Schreib mir was im Meeting passiert. Ich höre mit, strukturiere mit und gebe dir Hinweise wenn nötig.",
        post: "📝 NACHBEREITUNG — Ich erstelle jetzt die Zusammenfassung...",
        closed: "✅ Meeting abgeschlossen.",
      },
      en: {
        live: "🟢 LIVE — Tell me what's happening in the meeting. I'll listen, structure, and give you hints when needed.",
        post: "📝 POST — Generating your meeting summary...",
        closed: "✅ Meeting closed.",
      },
      fr: {
        live: "🟢 LIVE — Dis-moi ce qui se passe en réunion. J'écoute, structure et te donne des indices si nécessaire.",
        post: "📝 POST — Je génère le résumé...",
        closed: "✅ Réunion terminée.",
      },
    };
    const phaseInfo = (PHASE_INFO[lang] || PHASE_INFO.en)[newPhase];
    if (phaseInfo) appendSystemMsg(phaseInfo);

    // When going LIVE: show agenda points or parent summary as Sophie message
    if (newPhase === "live") {
      const agenda = $("ctxAgenda")?.value?.trim();
      const goal = $("ctxGoal")?.value?.trim();
      let liveOpener = "";
      if (agenda) {
        liveOpener = agenda;
        if (goal) liveOpener += "\n\n" + (lang === "de" ? "Ziel: " : "Goal: ") + goal;
      } else if (goal) {
        liveOpener = (lang === "de" ? "Ziel: " : "Goal: ") + goal;
      }
      if (liveOpener) appendMsg("assistant", liveOpener);
    }

    // Disconnect Sophie voice + stop audio recording when leaving live phase
    if (newPhase === "post" || newPhase === "closed") {
      stopRecStatusUpdates();
      if (!sophieMuted) {
        sophieMuted = true;
        muteToggle.classList.remove("active");
        disconnectSophieVoice(true);
      }
    }

    // Auto-summarize when entering post phase
    if (newPhase === "post") {
      // 1. Stop recording and get audio blob
      setSophieStatus(lang === "de" ? "Sophie hört sich das Gespräch an …" : "Sophie is reviewing the conversation …");
      const audioBlob = await stopAudioRecording();
      cleanupMicStream();

      // 2. Transcribe via Whisper (if we have audio)
      if (audioBlob && audioBlob.size > 1000) {
        const whisperText = await transcribeAudioBlob(audioBlob);
        if (whisperText) {
          speechTranscript.push(whisperText);
        }
      }

      // TEST MODE: inject fake data
      if (window.__testMode) {
        appendSystemMsg("🧪 TEST-MODUS: Fake Voice-Daten injiziert");
        if (speechTranscript.length === 0) {
          speechTranscript.push(
            "Wir müssen die Markteinführung von MeetSophie besprechen.",
            "Der Launch soll nächste Woche Dienstag stattfinden.",
            "LinkedIn ist der wichtigste Kanal für uns.",
          );
        }
        voiceTranscript.push(
          { role: "user", text: "Sophie, welcher Social Media Kanal passt am besten für B2B SaaS?" },
          { role: "assistant", text: "Für MeetSophie empfehle ich LinkedIn als primären Kanal. Twitter/X als Zweitkanal." },
          { role: "user", text: "Gut, dann nehmen wir LinkedIn." },
          { role: "assistant", text: "Beschluss festgehalten: LinkedIn als primärer Kanal für die Markteinführung." },
        );
      }

      // 3. Generate summary + report
      setSophieStatus(lang === "de" ? "Sophie erstellt den Report …" : "Sophie is creating the report …");
      await generateSummary();
      setSophieStatus("");
    }
  } catch (e) {
    setSophieStatus("");
    alert("Error: " + e.message);
  }
}

function appendMsg(role, content) {
  const div = document.createElement("div");
  const isHint = role === "assistant" && content.trim().startsWith("💡");
  div.className = `msg ${role}${isHint ? " hint" : ""}`;
  // Render bullet points as list, preserve line breaks
  const escaped = content.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines = escaped.split("\n");
  const hasBullets = lines.some(l => l.trim().startsWith("•") || l.trim().startsWith("-"));
  if (hasBullets) {
    let html = "";
    let inList = false;
    for (const line of lines) {
      const trimmed = line.trim();
      if (trimmed.startsWith("•") || trimmed.startsWith("- ")) {
        if (!inList) { html += "<ul style='margin:4px 0;padding-left:18px'>"; inList = true; }
        html += `<li style="margin:2px 0">${trimmed.replace(/^[•\-]\s*/, "")}</li>`;
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        if (trimmed) html += `<div>${trimmed}</div>`;
      }
    }
    if (inList) html += "</ul>";
    div.innerHTML = html;
  } else {
    div.innerHTML = escaped.replace(/\n/g, "<br>");
  }
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// Hint throttle state
const HINT_MIN_INTERVAL = 3 * 60 * 1000; // 3 min
const HINT_MAX_PER_MEETING = 8;
let lastHintAt = null;
let hintCount = 0;

function shouldShowHint() {
  if (hintCount >= HINT_MAX_PER_MEETING) return false;
  if (lastHintAt && Date.now() - lastHintAt < HINT_MIN_INTERVAL) return false;
  return true;
}

// Check if user is directly addressing Sophie
function isAddressingSophie(text) {
  const lower = text.toLowerCase();
  return /\bsophie\b/.test(lower) || /^@sophie/i.test(lower) || lower.startsWith("hey sophie") || lower.startsWith("sophie,");
}

async function sendMessage(text, isAutoOpener = false) {
  if (isLoading || !text.trim()) return;
  isLoading = true;
  sendBtn.disabled = true;

  if (!isAutoOpener) {
    appendMsg("user", text);
  }
  chatMessages.push({ role: "user", content: text });

  // Chat is always active — Sophie responds to every chat message.
  // Mute only affects voice (future feature), not the chat channel.

  showTyping();
  setSophieStatus(lang === "de" ? "Sophie denkt nach …" : "Sophie is thinking …");

  try {
    const data = await api("message", {
      meeting_id: meetingId,
      messages: chatMessages,
    });

    removeTyping();
    setSophieStatus("");

    let reply = data.reply;

    // Handle hint throttle: if reply contains a hint but throttle says no, strip it
    if (data.hint && reply.includes("\ud83d\udca1")) {
      if (!shouldShowHint()) {
        reply = reply.replace(/\ud83d\udca1[^\n]*/g, "").trim();
      } else {
        lastHintAt = Date.now();
        hintCount++;
      }
    }

    if (reply) {
      appendMsg("assistant", reply);
      chatMessages.push({ role: "assistant", content: reply });
    }

  } catch (e) {
    removeTyping();
    setSophieStatus("");
    console.error("Chat error:", e);
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    // Only auto-focus chat input during live phase; in prep, agenda field is more relevant
    if (meetingData?.phase === "live") chatInput.focus();
  }
}

async function generateSummary() {
  appendSystemMsg(lang === "de" ? "Erstelle Zusammenfassung..." : "Generating summary...");

  try {
    // Step 1: Speech recognition transcript (already text, no upload needed)
    const localText = speechTranscript.join(" ");

    // Step 2: Sophie voice transcript (from DataChannel during unmute)
    const voiceText = voiceTranscript
      .filter(m => m.text && m.text.trim())
      .map(m => `[${m.role === "user" ? "User" : "Sophie"}] ${m.text}`)
      .join("\n");

    // Step 3: Combine all sources — local audio + Sophie voice + chat fallback
    const allParts = [];
    if (localText.trim()) allParts.push(`[Aufnahme — Gesprächsinhalt]\n${localText}`);
    if (voiceText.trim()) allParts.push(`[Sophie Voice Session]\n${voiceText}`);

    let transcriptToSend = allParts.join("\n\n---\n\n");
    console.log(`[meeting] TRANSCRIPT TO SEND:\n${transcriptToSend}`);
    appendSystemMsg(`📊 ${speechTranscript.length} Audio-Segmente, ${voiceTranscript.length} Voice-Nachrichten`);

    if (!transcriptToSend.trim()) {
      appendSystemMsg("⚠️ Kein Transcript vorhanden — Report kann nicht erstellt werden.");
      return;
    }

    // Show report card with progress bar immediately
    $("summaryCard").classList.remove("hidden");

    const data = await api("summarize", { meeting_id: meetingId, chat_transcript: transcriptToSend });
    // No renderSummary — report card IS the primary output now

    if (data.report_session_id) {
      triggerAndPollMeetingReport(data.report_session_id, data.report_transcript || "");
    } else {
      appendSystemMsg("⚠️ Report-Session konnte nicht erstellt werden.");
    }
  } catch (e) {
    appendSystemMsg("Report error: " + e.message);
  }
}

// Poll for HTML report (same pipeline as Talk mode)
let meetingReportSessionId = null;
let meetingReportHtml = null;

async function triggerAndPollMeetingReport(sessionId, backendTranscript) {
  // Voice transcript only — NO chat fallback
  const fullTranscript = backendTranscript || "";

  // Fire generate-report (don't await — poll instead)
  const headers = { "Content-Type": "application/json" };
  try {
    const { data: { session: authSession } } = await supabase.auth.getSession();
    if (authSession?.access_token) headers["Authorization"] = "Bearer " + authSession.access_token;
  } catch (_) {}

  fetch("/api/ai/generate-report", {
    method: "POST",
    headers,
    body: JSON.stringify({
      session_id: sessionId,
      transcript_text: fullTranscript,
      session_mode: "meeting",
    }),
  }).catch(e => console.error("[meeting-report] generate fetch failed:", e?.message));

  // Now poll for progress
  pollMeetingReport(sessionId);
}

async function pollMeetingReport(sessionId) {
  meetingReportSessionId = sessionId;
  const reportProgress = $("reportProgress");
  const reportProgressBar = $("reportProgressBar");
  const reportProgressLabel = $("reportProgressLabel");
  const reportTitle = $("reportTitle");
  const isDE = lang === "de";

  reportProgressBar.style.width = "5%";

  const maxAttempts = 90;
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    await new Promise(r => setTimeout(r, 2000));

    try {
      const headers = {};
      try {
        const { data: { session: authSession } } = await supabase.auth.getSession();
        if (authSession?.access_token) headers["Authorization"] = "Bearer " + authSession.access_token;
      } catch (_) {}

      const res = await fetch(`/api/ai/report-status?session_id=${sessionId}`, { headers });
      if (!res.ok) continue;
      const data = await res.json();

      const progress = Math.max(5, Math.min(98, data.progress || 0));
      reportProgressBar.style.width = progress + "%";

      // Descriptive progress labels
      if (data.detail) {
        reportProgressLabel.textContent = data.detail;
      } else if (progress < 20) {
        reportProgressLabel.textContent = isDE ? "Transcript wird analysiert..." : "Analyzing transcript...";
      } else if (progress < 50) {
        reportProgressLabel.textContent = isDE ? "Protokoll wird erstellt..." : "Generating report...";
      } else if (progress < 85) {
        reportProgressLabel.textContent = isDE ? "Formatierung & Qualitätsprüfung..." : "Formatting & quality check...";
      } else {
        reportProgressLabel.textContent = isDE ? "Fast fertig..." : "Almost done...";
      }

      if (data.status === "done" && data.report_html) {
        reportProgressBar.style.width = "100%";
        reportProgressLabel.textContent = isDE ? "Fertig!" : "Done!";
        setTimeout(() => { reportProgress.style.display = "none"; }, 800);

        meetingReportHtml = data.report_html;
        showMeetingReport(data.report_html);
        return;
      }

      if (data.status === "failed") {
        reportTitle.textContent = isDE ? "Protokoll fehlgeschlagen" : "Report failed";
        reportProgressLabel.textContent = data.detail || (isDE ? "Bitte erneut versuchen." : "Please try again.");
        reportProgressBar.style.background = "#ef4444";
        reportProgressBar.style.width = "100%";
        return;
      }
    } catch (e) {
      console.error("[meeting-report-poll] error:", e?.message);
    }
  }

  reportTitle.textContent = isDE ? "Zeitüberschreitung" : "Timeout";
  reportProgressLabel.textContent = isDE ? "Protokoll konnte nicht erstellt werden." : "Report generation timed out.";
}

function showMeetingReport(html) {
  const reportPreview = $("reportPreview");
  const reportActions = $("reportActions");
  const reportFrame = $("reportFrame");

  reportPreview.classList.remove("hidden");
  reportActions.classList.remove("hidden");
  reportActions.style.display = "block";

  // Write HTML into iframe
  const doc = reportFrame.contentDocument || reportFrame.contentWindow.document;
  doc.open();
  doc.write(html);
  doc.close();

  // Auto-resize iframe to content
  setTimeout(() => {
    try {
      reportFrame.style.height = doc.documentElement.scrollHeight + "px";
    } catch (_) {}
  }, 500);

  // Helper: filter report sections based on toggle options (DOM-based, reliable)
  function getExportHtml() {
    const tmp = document.createElement("div");
    tmp.innerHTML = html;

    // Transcript: remove if off, show if on
    const transcriptEl = tmp.querySelector('[data-section="full-transcript"]');
    if (transcriptEl) {
      if (!$("optTranscript")?.checked) {
        transcriptEl.remove();
      } else {
        transcriptEl.style.display = "";
      }
    }

    // Lean Check: remove if off
    const leanEl = tmp.querySelector('[data-section="lean-check"]');
    if (leanEl && !$("optLeanCheck")?.checked) {
      leanEl.remove();
    }

    // Re-assemble: extract style block + body content
    const styleMatch = html.match(/<style[^>]*>[\s\S]*?<\/style>/i);
    const styleBlock = styleMatch ? styleMatch[0] : "";
    return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">${styleBlock}</head><body>${tmp.innerHTML}</body></html>`;
  }

  function downloadHtmlFile(content, suffix) {
    const blob = new Blob([content], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `meeting-${suffix}-${new Date().toISOString().slice(0,10)}.html`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // Wire up report action buttons
  // PDF Export — opens print dialog (official protocol without transcript)
  $("reportPrintBtn").onclick = () => {
    // Open clean HTML (no transcript) in new window for printing
    // Cannot use iframe.print() due to sandbox restrictions
    const cleanHtml = getExportHtml();
    const printWin = window.open("", "_blank");
    if (!printWin) { alert(lang === "de" ? "Popup-Blocker aktiv — bitte erlauben." : "Popup blocked — please allow popups."); return; }
    printWin.document.write(cleanHtml);
    printWin.document.close();
    printWin.onload = () => { printWin.focus(); printWin.print(); };
    // Fallback if onload doesn't fire (already loaded)
    setTimeout(() => { try { printWin.focus(); printWin.print(); } catch(_) {} }, 500);
  };

  // Download — respects toggle options
  $("reportDownloadFullBtn").onclick = () => {
    downloadHtmlFile(getExportHtml(), "protokoll");
  };

  $("reportCopyBtn").onclick = async () => {
    const cleanHtml = getExportHtml();
    // Parse clean HTML to get plain text without transcript
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = cleanHtml;
    const plainText = tempDiv.innerText || tempDiv.textContent || "";
    try {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([cleanHtml], { type: "text/html" }),
        "text/plain": new Blob([plainText], { type: "text/plain" }),
      })]);
      $("reportCopyBtn").textContent = "✓ Kopiert";
      setTimeout(() => { $("reportCopyBtn").textContent = "📋 Kopieren"; }, 2000);
    } catch {
      await navigator.clipboard.writeText(plainText);
      $("reportCopyBtn").textContent = "✓ Text kopiert";
      setTimeout(() => { $("reportCopyBtn").textContent = "📋 Kopieren"; }, 2000);
    }
  };

  $("reportTemplateBtn").onclick = async () => {
    try {
      const { data: { session: authSession } } = await supabase.auth.getSession();
      const headers = { "Content-Type": "application/json" };
      if (authSession?.access_token) headers["Authorization"] = "Bearer " + authSession.access_token;

      const res = await fetch("/api/ai/save-template", {
        method: "POST",
        headers,
        body: JSON.stringify({ session_id: meetingReportSessionId, mode: "meeting" }),
      });
      if (res.ok) {
        $("reportTemplateBtn").textContent = "✓ Vorlage gespeichert";
        setTimeout(() => { $("reportTemplateBtn").textContent = "💾 Als Vorlage"; }, 3000);
      }
    } catch (e) {
      console.error("Save template error:", e);
    }
  };

  // "Aktualisieren" — re-render report with current toggle options (no AI call)
  $("reportRegenerateBtn").onclick = () => {
    const exportHtml = getExportHtml();
    const doc = reportFrame.contentDocument || reportFrame.contentWindow.document;
    doc.open();
    doc.write(exportHtml);
    doc.close();
    setTimeout(() => {
      try { reportFrame.style.height = doc.documentElement.scrollHeight + "px"; } catch(_) {}
    }, 300);
    // Reset button to inactive
    $("reportRegenerateBtn").disabled = true;
    $("reportRegenerateBtn").style.opacity = ".4";
  };
}

const FILE_ICONS = {
  "application/pdf": "📄",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document": "📝",
  "application/vnd.openxmlformats-officedocument.presentationml.presentation": "📊",
  "text/plain": "📃",
  "image/png": "🖼️", "image/jpeg": "🖼️", "image/webp": "🖼️",
};

async function uploadFile(file) {
  if (!meetingId) return;

  // Reject Pages files with helpful message
  if (file.name.endsWith(".pages")) {
    const pagesMsg = lang === "de"
      ? "Pages-Dateien werden nicht unterstützt. Bitte als DOCX oder PDF exportieren."
      : "Pages files are not supported. Please export as DOCX or PDF.";
    appendSystemMsg("⚠️ " + pagesMsg);
    return;
  }

  const fileList = $("fileList");
  const itemDiv = document.createElement("div");
  itemDiv.className = "file-item uploading";
  itemDiv.innerHTML = `<span class="file-icon">${FILE_ICONS[file.type] || "📎"}</span><span class="file-name">${file.name}</span><span class="file-status">...</span>`;
  fileList.appendChild(itemDiv);

  try {
    // 1. Upload to Supabase Storage
    const path = `${meetingId}/${Date.now()}_${file.name}`;
    const { error: uploadErr } = await supabase.storage
      .from("meeting-files")
      .upload(path, file, { contentType: file.type });
    if (uploadErr) throw uploadErr;

    // 2. Extract text content for TXT files
    let content = `[File: ${file.name}]`;
    if (file.type === "text/plain") {
      content = await file.text();
      if (content.length > 8000) content = content.slice(0, 8000) + "\n... (truncated)";
    }

    // 3. Save as meeting_context
    await api("context", {
      meeting_id: meetingId,
      context_type: "file",
      content,
      file_path: path,
    });

    itemDiv.classList.remove("uploading");
    itemDiv.querySelector(".file-status").textContent = "✓";
    appendSystemMsg(`${file.name} ${t("uploadDone").toLowerCase()}`);
  } catch (e) {
    itemDiv.classList.remove("uploading");
    itemDiv.querySelector(".file-status").textContent = "✗";
    itemDiv.querySelector(".file-status").style.color = "#ff5a5a";
    console.error("Upload error:", e);
  }
}

// ---------------------------------------------------------------------------
// Audio Recording (MediaRecorder) + Whisper Transcription at end
// Works on ALL browsers (no Google dependency like SpeechRecognition)
// ---------------------------------------------------------------------------
let mediaRecorder = null;
let audioChunks = [];

async function startAudioRecording() {
  try {
    sharedMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    appendSystemMsg("✅ Mikrofon aktiv — Aufnahme läuft");

    mediaRecorder = new MediaRecorder(sharedMicStream, {
      mimeType: MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
              : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm"
              : "audio/mp4",
    });
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onerror = (e) => {
      appendSystemMsg(`⚠️ Aufnahme-Fehler: ${e.error?.message || "unbekannt"}`);
    };

    // Record in 10-second chunks (so we don't lose everything on crash)
    mediaRecorder.start(10000);
    console.log("[meeting-audio] Recording started, mimeType:", mediaRecorder.mimeType);
  } catch (e) {
    appendSystemMsg(`❌ Mikrofon nicht verfügbar: ${e.message}`);
    console.error("[meeting-audio] getUserMedia failed:", e.message);
  }
}

function pauseAudioRecording() {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.pause();
    console.log("[meeting-audio] Paused (Sophie voice active)");
  }
}

function resumeAudioRecording() {
  if (mediaRecorder && mediaRecorder.state === "paused") {
    mediaRecorder.resume();
    console.log("[meeting-audio] Resumed");
  }
}

function stopAudioRecording() {
  return new Promise((resolve) => {
    if (!mediaRecorder || mediaRecorder.state === "inactive") {
      resolve(null);
      return;
    }
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      console.log(`[meeting-audio] Stopped. ${audioChunks.length} chunks, ${(blob.size / 1024).toFixed(0)}KB`);
      audioChunks = [];
      resolve(blob);
    };
    mediaRecorder.stop();
  });
}

async function transcribeAudioBlob(blob) {
  if (!blob || blob.size < 1000) {
    appendSystemMsg("⚠️ Audioaufnahme zu kurz für Transkription");
    return "";
  }

  appendSystemMsg(`🔄 Transkribiere ${(blob.size / 1024).toFixed(0)}KB Audio via Whisper...`);

  // Convert blob to base64 using FileReader (no stack overflow)
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      resolve(dataUrl.split(",")[1]); // Remove "data:audio/webm;base64," prefix
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });

  const ext = blob.type.includes("mp4") ? "audio.mp4" : "audio.webm";

  let authToken = accessToken;
  try {
    const { data: { session: s } } = await supabase.auth.getSession();
    if (s?.access_token) authToken = s.access_token;
  } catch (_) {}

  const resp = await fetch("/api/ai/transcribe", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${authToken}`,
    },
    body: JSON.stringify({
      audio_base64: base64,
      filename: ext,
      language: lang === "de" ? "de" : lang === "fr" ? "fr" : "en",
    }),
  });

  if (!resp.ok) {
    const err = await resp.text();
    appendSystemMsg(`⚠️ Whisper-Fehler: ${resp.status}`);
    console.error("[meeting-audio] Whisper error:", err);
    return "";
  }

  const data = await resp.json();
  const text = (data.text || "").trim();
  if (text) {
    appendSystemMsg(`✅ Transkription: ${text.length} Zeichen`);
    console.log(`[meeting-audio] Whisper result: "${text.slice(0, 100)}..."`);
  } else {
    appendSystemMsg("⚠️ Whisper hat keinen Text erkannt");
  }
  return text;
}

function cleanupMicStream() {
  if (sharedMicStream) {
    sharedMicStream.getTracks().forEach(t => t.stop());
    sharedMicStream = null;
  }
}

// Sophie Voice — Uses the SAME Talk-Sophie (WebRTC Realtime API)
// Unmute = Connect Sophie voice session, Mute = Disconnect
// ---------------------------------------------------------------------------

async function fetchRealtimeAnswerSdp(offerSdp, clientSecret) {
  const baseUrl = "https://api.openai.com/v1/realtime";
  const model = "gpt-realtime";
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const res = await fetch(`${baseUrl}?model=${model}`, {
        method: "POST",
        body: offerSdp,
        headers: {
          Authorization: `Bearer ${clientSecret}`,
          "Content-Type": "application/sdp",
        },
      });
      if (!res.ok) throw new Error(`Realtime handshake failed (${res.status})`);
      const sdp = await res.text();
      if (!sdp || sdp.trim().startsWith("<")) throw new Error("Invalid SDP");
      return sdp;
    } catch (e) {
      if (attempt === 3) throw e;
      await new Promise(r => setTimeout(r, 600 * attempt));
    }
  }
}

async function connectSophieVoice() {
  if (isConnecting || sophieVoicePc) return;
  isConnecting = true;
  isSpeaking = true;
  updateParticipantsBar();

  const connectMsg = lang === "de" ? "Sophie wird verbunden..." : lang === "fr" ? "Connexion de Sophie..." : "Connecting Sophie...";
  appendSystemMsg(connectMsg);

  try {
    // 1. Get fresh auth token
    let authToken = accessToken;
    try {
      const { data: { session: authSession } } = await supabase.auth.getSession();
      if (authSession?.access_token) authToken = authSession.access_token;
    } catch (_) {}

    if (!authToken) throw new Error("Not authenticated — please reload and login");

    // 2. Get session token from /api/session (same as Talk)
    console.log("[meeting-voice] Calling /api/session...");
    const tokenRes = await fetch("/api/session", {
      headers: {
        Authorization: `Bearer ${authToken}`,
        "X-Sophie-Session-Mode": "meeting",
        "X-Sophie-Meeting-Id": meetingId || "",
      },
    });
    const data = await tokenRes.json();
    console.log("[meeting-voice] Session response:", tokenRes.status, data?.error || "OK");

    if (tokenRes.status === 429) {
      // Session lock — wait and retry once
      appendSystemMsg(lang === "de" ? "Sophie ist noch beschäftigt, versuche erneut..." : "Sophie is busy, retrying...");
      await new Promise(r => setTimeout(r, 3000));
      const retry = await fetch("/api/session", {
        headers: { Authorization: `Bearer ${authToken}`, "X-Sophie-Session-Mode": "meeting", "X-Sophie-Meeting-Id": meetingId || "" },
      });
      const retryData = await retry.json();
      if (!retry.ok) throw new Error(retryData?.error || retryData?.message || `HTTP ${retry.status}`);
      Object.assign(data, retryData);
    } else if (!tokenRes.ok) {
      throw new Error(data?.error || data?.message || `HTTP ${tokenRes.status}`);
    }

    // 2. Set up WebRTC (same as Talk)
    sophieVoicePc = new RTCPeerConnection();

    // DataChannel for transcript (MUST be created before offer)
    sophieVoiceDc = sophieVoicePc.createDataChannel("oai-events");
    sophieVoiceDc.onerror = (e) => {
      console.error("[meeting-voice] DataChannel error:", e);
      appendSystemMsg("⚠️ Voice DataChannel Error");
    };
    sophieVoiceDc.onclose = () => {
      console.log("[meeting-voice] DataChannel closed");
    };
    sophieVoiceDc.onopen = () => {
      console.log("[meeting-voice] DataChannel open — enabling auto-response + transcript");
      appendSystemMsg("✅ Voice Transcript aktiv");
      // Enable auto-response after user speech + keep transcription
      sophieVoiceDc.send(JSON.stringify({
        type: "session.update",
        session: {
          turn_detection: {
            type: "server_vad",
            threshold: 0.6,
            prefix_padding_ms: 300,
            silence_duration_ms: 800,
            create_response: true,
            interrupt_response: true,
          },
        },
      }));
    };
    sophieVoiceDc.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        handleVoiceTranscriptEvent(msg);
      } catch (_) {}
    };

    // Reuse the shared mic stream (created at meeting start — single permission dialog)
    // Only re-request if stream died (e.g. hardware disconnect)
    if (!sharedMicStream || sharedMicStream.getTracks().some(t => t.readyState === "ended")) {
      console.log("[meeting-voice] sharedMicStream unavailable, requesting new one...");
      sharedMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }
    const sophieStream = sharedMicStream.clone();
    sophieVoiceStream = sophieStream;
    sophieStream.getTracks().forEach(track => sophieVoicePc.addTrack(track, sophieStream));

    // Sophie's audio output
    sophieVoiceAudio = document.createElement("audio");
    sophieVoiceAudio.autoplay = true;
    sophieVoiceAudio.playsInline = true;
    sophieVoicePc.ontrack = e => {
      sophieVoiceAudio.srcObject = e.streams[0];
      isSpeaking = true;
      updateParticipantsBar();
    };

    // Create offer
    const offer = await sophieVoicePc.createOffer();
    await sophieVoicePc.setLocalDescription(offer);

    // 3. Handshake with OpenAI Realtime (same as Talk)
    if (!data?.client_secret?.value) throw new Error("No client_secret received from session API");
    const answerSdp = await fetchRealtimeAnswerSdp(offer.sdp, data.client_secret.value);
    await sophieVoicePc.setRemoteDescription({ type: "answer", sdp: answerSdp });

    // Connection state monitoring
    sophieVoicePc.onconnectionstatechange = () => {
      const state = sophieVoicePc?.connectionState;
      if (state === "disconnected" || state === "failed" || state === "closed") {
        disconnectSophieVoice(true);
      }
    };

    isConnecting = false;
    isSpeaking = true;
    updateParticipantsBar();

    sophieVoiceStartTime = Date.now();
    const joinedMsg = lang === "de" ? "Sophie ist jetzt im Meeting." : lang === "fr" ? "Sophie est dans le meeting." : "Sophie joined the meeting.";
    appendSystemMsg(joinedMsg);

  } catch (e) {
    console.error("Sophie voice connect error:", e);
    isConnecting = false;
    isSpeaking = false;
    updateParticipantsBar();
    disconnectSophieVoice(true);
    const errMsg = lang === "de" ? "Sophie konnte nicht verbunden werden." : "Could not connect Sophie.";
    appendSystemMsg(errMsg + " " + e.message);
  }
}

// Handle voice transcript events from DataChannel (same logic as Talk)
function handleVoiceTranscriptEvent(msg) {
  // User speech transcript (incremental)
  if (msg?.type === "conversation.item.input_audio_transcription.delta") {
    const itemId = msg?.item_id;
    const delta = String(msg?.delta || "");
    if (itemId && delta) {
      const prev = userTranscriptBuffer.get(itemId) || "";
      userTranscriptBuffer.set(itemId, prev + delta);
    }
    return;
  }

  // User speech transcript (final)
  if (msg?.type === "conversation.item.input_audio_transcription.completed") {
    const itemId = msg?.item_id;
    const t1 = String(msg?.transcript || "").trim();
    const tBuf = itemId ? String(userTranscriptBuffer.get(itemId) || "").trim() : "";
    const text = (t1 || tBuf).trim();
    if (itemId) userTranscriptBuffer.delete(itemId);
    if (text) {
      voiceTranscript.push({ role: "user", text });
      console.log("[meeting-voice] User:", text.slice(0, 80));
    }
    return;
  }

  // Sophie speech transcript (final)
  if (msg?.type === "response.audio_transcript.done") {
    const full = String(msg?.transcript || msg?.text || "").trim();
    if (full) partialAssistant = full;
    return;
  }

  // Response complete — save Sophie's text
  if (msg?.type === "response.done") {
    // Strip Sophie's internal JSON tags (structured meeting data) from transcript
    let final = String(partialAssistant || "").replace(/\s+/g, " ").trim();
    final = final.replace(/\s*\{["']?(?:decisions|actions|risks|open_points)["']?\s*:[\s\S]*$/i, "").trim();
    const last = String(lastAssistantFinal || "").replace(/\s+/g, " ").trim();
    if (final && final !== last) {
      voiceTranscript.push({ role: "assistant", text: final });
      lastAssistantFinal = final;
      console.log("[meeting-voice] Sophie:", final.slice(0, 80));
    }
    partialAssistant = "";
    return;
  }
}

function disconnectSophieVoice(silent = false) {
  // Report usage for Sophie voice session
  if (sophieVoiceStartTime) {
    const secondsUsed = Math.ceil((Date.now() - sophieVoiceStartTime) / 1000);
    sophieVoiceStartTime = null;
    if (secondsUsed > 0) {
      console.log(`[meeting-voice] Session ended: ${secondsUsed}s used`);
      reportMeetingVoiceUsage(secondsUsed);
    }
  }

  // Kill Sophie's cloned stream only — keep sharedMicStream alive for SpeechRecognition reuse
  if (sophieVoiceStream) {
    try { sophieVoiceStream.getTracks().forEach(t => t.stop()); } catch {}
  }
  sophieVoiceStream = null;
  // Stop audio
  if (sophieVoiceAudio) {
    try { sophieVoiceAudio.srcObject = null; } catch {}
    sophieVoiceAudio = null;
  }
  // Close DataChannel + WebRTC
  if (sophieVoiceDc) {
    try { sophieVoiceDc.close(); } catch {}
    sophieVoiceDc = null;
  }
  if (sophieVoicePc) {
    sophieVoicePc.close();
    sophieVoicePc = null;
  }
  isSpeaking = false;
  isConnecting = false;
  updateParticipantsBar();

  if (!silent) {
    const leftMsg = lang === "de" ? "Sophie hat das Meeting verlassen." : lang === "fr" ? "Sophie a quitté le meeting." : "Sophie left the meeting.";
    appendSystemMsg(leftMsg);
  }
}

async function reportMeetingVoiceUsage(seconds) {
  try {
    const { data: { session: authSession } } = await supabase.auth.getSession();
    if (!authSession?.access_token) return;

    const tokens = Math.ceil(seconds / 6);
    const res = await fetch("/api/user?action=usage", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${authSession.access_token}`,
      },
      body: JSON.stringify({ tokens_used: tokens }),
      keepalive: true,
    });
    const data = await res.json().catch(() => null);
    console.log(`[meeting-voice] Usage reported: ${seconds}s (${tokens} tokens)`, res.status, data);
  } catch (e) {
    console.error("[meeting-voice] Usage report failed:", e.message);
  }
}

async function toggleSophieMute() {
  if (isConnecting) return; // Prevent double-click

  sophieMuted = !sophieMuted;
  muteToggle.classList.toggle("active", !sophieMuted);
  updateParticipantsBar();

  if (!sophieMuted) {
    // UNMUTE → Pause audio recording, connect Sophie voice
    pauseAudioRecording();
    setSophieStatus(lang === "de" ? "Sophie kommt dazu …" : "Sophie is joining …");
    await connectSophieVoice();
    setSophieStatus(lang === "de" ? "Sophie hört zu" : "Sophie is listening");
  } else {
    // MUTE → Disconnect Sophie voice, resume audio recording
    disconnectSophieVoice();
    resumeAudioRecording();
    setSophieStatus("");
  }
}

function buildSummaryText() {
  if (!meetingData) return "";
  const lines = [];
  lines.push(`# ${meetingData.title || meetingData.meeting_type}`);
  lines.push(`${new Date(meetingData.created_at).toLocaleDateString()} | ${meetingData.meeting_type}\n`);

  const summaryText = $("summaryText")?.textContent;
  if (summaryText) lines.push(summaryText + "\n");

  const details = $("summaryDetails");
  if (details) {
    details.querySelectorAll(".summary-section").forEach(sec => {
      const h4 = sec.querySelector("h4");
      if (h4) lines.push(`## ${h4.textContent}`);
      sec.querySelectorAll("li").forEach(li => {
        lines.push(`- ${li.textContent}`);
      });
      lines.push("");
    });
    details.querySelectorAll(".diff-section .diff-item").forEach(d => {
      lines.push(`- ${d.textContent.trim()}`);
    });
  }
  return lines.join("\n").trim();
}

function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function getDatePrefix() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function slugify(str) {
  return str.toLowerCase().replace(/[äÄ]/g,"ae").replace(/[öÖ]/g,"oe").replace(/[üÜ]/g,"ue").replace(/[ß]/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
}

function stripTranscriptGlobal(rawHtml) {
  const tmp = document.createElement("div");
  tmp.innerHTML = rawHtml;
  const el = tmp.querySelector('[data-section="full-transcript"]');
  if (el) el.remove();
  return tmp.innerHTML;
}

  const text = buildSummaryText();
  try {
    await navigator.clipboard.writeText(text);
    const btn = $("copySummaryBtn");
    const orig = btn.textContent;
    btn.textContent = `\u2714 ${t("copied")}`;
    setTimeout(() => btn.textContent = orig, 2000);
  } catch {
    // Fallback for older browsers
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
}

async function shareSummary() {
  const text = buildSummaryText();
  if (navigator.share) {
    try {
      await navigator.share({ title: t("shareTitle"), text });
    } catch { /* user cancelled */ }
  } else {
    await copySummary(); // Fallback to copy
  }
}

// ---------------------------------------------------------------------------
// Event Listeners
// ---------------------------------------------------------------------------
$("createBtn").addEventListener("click", createMeeting);
$("newMeetingBtn").addEventListener("click", showSetup);
sendBtn.addEventListener("click", () => { sendMessage(chatInput.value); chatInput.value = ""; autoResize(); });

chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage(chatInput.value);
    chatInput.value = "";
    autoResize();
  }
});

chatInput.addEventListener("input", () => {
  sendBtn.disabled = !chatInput.value.trim() || isLoading;
  autoResize();
});

function autoResize() {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + "px";
}

// Geolocation: fire-and-forget when meeting goes live
function captureLocation() {
  if (!navigator.geolocation || !meetingId) return;
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      const { latitude, longitude } = pos.coords;
      const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&accept-language=${lang}`);
      const geo = await resp.json();
      const city = geo.address?.city || geo.address?.town || geo.address?.village || '';
      const country = geo.address?.country || '';
      const locationStr = [city, country].filter(Boolean).join(', ') || `${latitude.toFixed(2)}, ${longitude.toFixed(2)}`;
      await api("context", { meeting_id: meetingId, context_type: "location", content: locationStr });
      console.log("[meeting] Location captured:", locationStr);
    } catch (e) {
      console.warn("[meeting] Reverse geocoding failed:", e.message);
    }
  }, (err) => {
    console.log("[meeting] Geolocation not available:", err.message);
  }, { timeout: 10000, maximumAge: 300000 });
}

ctaLive.addEventListener("click", async () => {
  // Auto-save context before going live (so Sophie sees the agenda)
  await saveContext();

  // Start audio recording (getUserMedia + MediaRecorder) — one permission dialog
  await startAudioRecording();

  startRecStatusUpdates();
  // No captureLocation() — avoid second permission dialog.
  // Meeting location only appears in report if explicitly said in transcript.
  await transitionPhase("live");
});
ctaPost.addEventListener("click", async () => { await transitionPhase("post"); });
ctaClose.addEventListener("click", async () => {
  await transitionPhase("closed");
  // Navigate back to home after closing
  window.location.href = "/";
});

$("saveContextBtn").addEventListener("click", saveContext);
muteToggle.addEventListener("click", toggleSophieMute);
// Old summary export buttons removed — report card handles all exports now

$("contextToggle").addEventListener("click", () => {
  contextPanel.classList.toggle("collapsed");
});

// Delete meeting
window.deleteMeeting = async function(id, btn) {
  const confirmMsg = lang === "de" ? "Meeting wirklich löschen?" : lang === "fr" ? "Supprimer ce meeting ?" : "Delete this meeting?";
  if (!confirm(confirmMsg)) return;
  btn.disabled = true;
  try {
    await api("delete", { meeting_id: id });
    btn.closest("div").remove();
  } catch (e) {
    alert("Error: " + e.message);
    btn.disabled = false;
  }
};

// File upload handlers
$("uploadArea").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => {
  for (const file of e.target.files) uploadFile(file);
  e.target.value = "";
});
$("uploadArea").addEventListener("dragover", (e) => {
  e.preventDefault();
  $("uploadArea").style.borderColor = "#c4a882";
});
$("uploadArea").addEventListener("dragleave", () => {
  $("uploadArea").style.borderColor = "";
});
$("uploadArea").addEventListener("drop", (e) => {
  e.preventDefault();
  $("uploadArea").style.borderColor = "";
  for (const file of e.dataTransfer.files) uploadFile(file);
});

$("backBtn").addEventListener("click", (e) => {
  if (meetingId) {
    e.preventDefault();
    meetingId = null;
    meetingData = null;
    chatMessages = [];
    chatArea.innerHTML = "";
    summaryCard.classList.add("hidden");
    window.history.replaceState({}, "", "/meeting/");
    showHistory();
  }
});

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
applyI18n();
initAuth();
</script>

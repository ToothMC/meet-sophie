// ---------------------------------------------------------------------------
// Mute/Unmute Sophie (Connect/Disconnect Talk-Sophie)
// ---------------------------------------------------------------------------
async function toggleSophieMute() {
  if (isConnecting) return; // Prevent double-click

  sophieMuted = !sophieMuted;
  muteToggle.classList.toggle("active", !sophieMuted);
  updateParticipantsBar();

  if (!sophieMuted) {
    // Unlock audio playback on iOS — must happen in user gesture handler
    try {
      const silentCtx = new (window.AudioContext || window.webkitAudioContext)();
      const buf = silentCtx.createBuffer(1, 1, 22050);
      const src = silentCtx.createBufferSource();
      src.buffer = buf;
      src.connect(silentCtx.destination);
      src.start(0);
      silentCtx.close();
    } catch (_) {}

    // BURST MODE: Recording keeps running! No pauseAudioRecording()
    isMeetingBurstActive = true;
    setSophieStatus(lang === "de" ? "Sophie kommt dazu …" : "Sophie is joining …");
    await connectSophieVoice();
    // Explicitly play audio element — autoplay alone fails on mobile Safari
    if (sophieVoiceAudio) {
      try { await sophieVoiceAudio.play(); } catch (_) {}
    }
    setSophieStatus(lang === "de" ? "Sophie hört zu" : "Sophie is listening");
  } else {
    // DISCONNECT BURST → flush messages, report usage
    clearTimeout(window._burstSilenceTimer);
    // Pass wasBurst explicitly — flag gets cleared AFTER disconnect
    disconnectSophieVoice(false, { wasBurst: true });
    isMeetingBurstActive = false;
    // No resumeAudioRecording() needed — recording never paused
    setSophieStatus("");

    // Persist burst messages to server (async, with retry)
    if (pendingBurstMessages.length > 0) {
      flushPendingBurstMessages();
    }
  }
}

// ---------------------------------------------------------------------------
// Summary Export (Copy + Share)
// ---------------------------------------------------------------------------
function buildSummaryText() {
  if (!meetingData) return "";
  const lines = [];
  lines.push(`# ${meetingData.title || meetingData.meeting_type}`);
  lines.push(`${new Date(meetingData.created_at).toLocaleDateString()} | ${meetingData.meeting_type}\n`);

  const summaryText = $("summaryText")?.textContent;
  if (summaryText) lines.push(summaryText + "\n");

  const details = $("summaryDetails");
  if (details) {
    details.querySelectorAll(".summary-section").forEach(sec => {
      const h4 = sec.querySelector("h4");
      if (h4) lines.push(`## ${h4.textContent}`);
      sec.querySelectorAll("li").forEach(li => {
        lines.push(`- ${li.textContent}`);
      });
      lines.push("");
    });
    details.querySelectorAll(".diff-section .diff-item").forEach(d => {
      lines.push(`- ${d.textContent.trim()}`);
    });
  }
  return lines.join("\n").trim();
}

function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function getDatePrefix() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function slugify(str) {
  return str.toLowerCase().replace(/[äÄ]/g,"ae").replace(/[öÖ]/g,"oe").replace(/[üÜ]/g,"ue").replace(/[ß]/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
}

function stripTranscriptGlobal(rawHtml) {
  const tmp = document.createElement("div");
  tmp.innerHTML = rawHtml;
  const el = tmp.querySelector('[data-section="full-transcript"]');
  if (el) el.remove();
  return tmp.innerHTML;
}

function downloadProtocol() {
  if (!meetingData) return;

  // If we have an AI-generated HTML report, download official version (no transcript)
  if (meetingReportHtml) {
    const title = meetingData.title || meetingData.meeting_type || "meeting";
    const filename = `${getDatePrefix()}_sophie-protokoll_${slugify(title)}.html`;
    const blob = new Blob([stripTranscriptGlobal(meetingReportHtml)], { type: "text/html;charset=utf-8" });
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (isIOS && navigator.share && navigator.canShare) {
      const file = new File([blob], filename, { type: "text/html" });
      if (navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title }).catch(() => {});
        return;
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    return;
  }
  const isDE = lang === "de";
  const isFR = lang === "fr";

  const title = meetingData.title || meetingData.meeting_type;
  const dateStr = new Date(meetingData.created_at).toLocaleDateString(
    isDE ? "de-DE" : isFR ? "fr-FR" : "en-US",
    { day: "numeric", month: "long", year: "numeric" }
  );
  const timeStart = meetingData.started_at ? new Date(meetingData.started_at).toLocaleTimeString(
    isDE ? "de-DE" : isFR ? "fr-FR" : "en-US", { hour: "2-digit", minute: "2-digit" }
  ) : "—";
  const timeEnd = meetingData.ended_at ? new Date(meetingData.ended_at).toLocaleTimeString(
    isDE ? "de-DE" : isFR ? "fr-FR" : "en-US", { hour: "2-digit", minute: "2-digit" }
  ) : "—";

  // Gather participants
  const partText = ($("ctxParticipants")?.value || "").trim();
  const participants = partText ? partText.split(/[,;\n]+/).map(n => n.trim()).filter(Boolean) : [];

  // Gather summary data from DOM
  const summaryText = ($("summaryText")?.textContent || "").trim();
  const details = $("summaryDetails");

  const sections = [];
  if (details) {
    details.querySelectorAll(".summary-section").forEach(sec => {
      const h4 = sec.querySelector("h4")?.textContent || "";
      const items = Array.from(sec.querySelectorAll("li")).map(li => li.textContent.trim());
      if (items.length > 0) sections.push({ title: h4, items });
    });
  }

  // Gather diff items
  const diffItems = [];
  if (details) {
    details.querySelectorAll(".diff-item").forEach(d => {
      diffItems.push(d.textContent.trim());
    });
  }

  // Build protocol HTML — classic meeting protocol layout
  const protocolLabel = isDE ? "Meeting Protokoll" : isFR ? "Proc\u00e8s-verbal" : "Meeting Protocol";
  const dateLabel = isDE ? "Datum" : isFR ? "Date" : "Date";
  const timeLabel = isDE ? "Zeit" : isFR ? "Heure" : "Time";
  const partLabel = isDE ? "Teilnehmer" : isFR ? "Participants" : "Participants";
  const typeLabel = isDE ? "Typ" : isFR ? "Type" : "Type";
  const summaryLabel = isDE ? "Zusammenfassung" : isFR ? "R\u00e9sum\u00e9" : "Summary";
  const diffLabel = isDE ? "Vergleich mit Vorg\u00e4nger-Meeting" : isFR ? "Comparaison" : "Comparison with previous meeting";

  const htmlContent = `<!DOCTYPE html>
<html lang="${lang}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sophie \u2013 ${escapeHtml(protocolLabel)}</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#ffffff;color:#2c2420;margin:0;padding:40px 24px;}
  .wrap{max-width:640px;margin:0 auto;}
  .label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c4a882;margin:0 0 10px;}
  h1{font-size:26px;font-weight:700;color:#1a1210;margin:0 0 8px;}
  .subtitle{font-size:14px;color:#a09080;margin:0 0 32px;}
  .meta-table{width:100%;border-collapse:collapse;margin:0 0 36px;}
  .meta-table td{padding:8px 12px;font-size:14px;border-bottom:1px solid #ede8e2;vertical-align:top;}
  .meta-table td:first-child{font-weight:600;color:#1a1210;width:120px;white-space:nowrap;}
  .meta-table td:last-child{color:#5a4a40;}
  .section{margin:0 0 36px;padding-bottom:36px;border-bottom:1px solid #ede8e2;}
  .section:last-child{border-bottom:none;}
  .section-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c4a882;margin:0 0 12px;}
  p{margin:0 0 12px;font-size:16px;line-height:1.8;color:#3a3028;}
  ul{margin:0;padding-left:20px;}
  li{margin:0 0 10px;font-size:15px;line-height:1.7;color:#3a3028;}
  li::marker{color:#c4a882;}
  .owner{color:#6a8a5a;font-weight:600;}
  .severity-high{color:#c44;}
  .severity-medium{color:#c90;}
  .severity-low{color:#5a8a5a;}
  .diff-item{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px;color:#5a4a40;}
  .diff-icon{font-size:16px;}
  .footer{margin-top:48px;font-size:12px;color:#b0a090;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <p class="label">${escapeHtml(protocolLabel)}</p>
  <h1>${escapeHtml(title)}</h1>
  <p class="subtitle">Sophie \u2013 ${escapeHtml(protocolLabel)}</p>

  <table class="meta-table">
    <tr><td>${dateLabel}</td><td>${escapeHtml(dateStr)}</td></tr>
    <tr><td>${timeLabel}</td><td>${escapeHtml(timeStart)} \u2013 ${escapeHtml(timeEnd)}</td></tr>
    <tr><td>${typeLabel}</td><td>${escapeHtml(meetingData.meeting_type)}</td></tr>
    ${participants.length > 0 ? `<tr><td>${partLabel}</td><td>${participants.map(p => escapeHtml(p)).join(", ")}</td></tr>` : ""}
  </table>

  ${summaryText ? `<div class="section">
    <p class="section-title">${summaryLabel}</p>
    <p>${escapeHtml(summaryText)}</p>
  </div>` : ""}

  ${sections.map(sec => `<div class="section">
    <p class="section-title">${escapeHtml(sec.title)}</p>
    <ul>${sec.items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
  </div>`).join("")}

  ${(speechTranscript.length > 0 || voiceTranscript.length > 0) ? `<div class="section">
    <p class="section-title">${isDE ? "Vollständiges Gesprächsprotokoll" : isFR ? "Transcription complète" : "Full Transcript"}</p>
    ${speechTranscript.length > 0 ? `<div style="margin:0 0 16px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.8;background:#f0ede8;color:#2c2420;">
      <strong style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#888;display:block;margin-bottom:6px">${isDE ? "Meeting-Gespräch" : "Meeting Conversation"}</strong>
      ${escapeHtml(speechTranscript.join(" "))}
    </div>` : ""}
    ${voiceTranscript.map(m => `<div style="margin:0 0 12px;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.7;${m.role === "user" ? "background:#f0ede8;color:#2c2420;" : "background:#fff;border:1px solid #ede8e2;color:#5a4a40;"}">
      <strong style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:${m.role === "user" ? "#1a1210" : "#c4a882"}">${m.role === "user" ? "User" : "Sophie"}</strong><br>
      ${escapeHtml(m.text)}
    </div>`).join("")}
  </div>` : ""}

  ${diffItems.length > 0 ? `<div class="section">
    <p class="section-title">${diffLabel}</p>
    ${diffItems.map(d => `<div class="diff-item">${escapeHtml(d)}</div>`).join("")}
  </div>` : ""}

  <div class="footer">${isDE ? "Erstellt mit Sophie" : isFR ? "Cr\u00e9\u00e9 avec Sophie" : "Created with Sophie"} \u00b7 meet-sophie.com</div>
</div>
</body>
</html>`;

  const filename = `${getDatePrefix()}_sophie-meeting-protokoll_${slugify(title)}.html`;
  const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });

  // iOS fallback
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  if (isIOS && navigator.share && navigator.canShare) {
    const file = new File([blob], filename, { type: "text/html" });
    if (navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: protocolLabel }).catch(() => {});
      return;
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function copySummary() {
  const text = buildSummaryText();
  try {
    await navigator.clipboard.writeText(text);
    const btn = $("copySummaryBtn");
    const orig = btn.textContent;
    btn.textContent = `\u2714 ${t("copied")}`;
    setTimeout(() => btn.textContent = orig, 2000);
  } catch {
    // Fallback for older browsers
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
}

async function shareSummary() {
  const text = buildSummaryText();
  if (navigator.share) {
    try {
      await navigator.share({ title: t("shareTitle"), text });
    } catch { /* user cancelled */ }
  } else {
    await copySummary(); // Fallback to copy
  }
}

// Event Listeners
// ---------------------------------------------------------------------------
$("createBtn").addEventListener("click", createMeeting);
$("newMeetingBtn").addEventListener("click", showSetup);
sendBtn.addEventListener("click", () => { sendMessage(chatInput.value); chatInput.value = ""; autoResize(); });

chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage(chatInput.value);
    chatInput.value = "";
    autoResize();
  }
});

chatInput.addEventListener("input", () => {
  sendBtn.disabled = !chatInput.value.trim() || isLoading;
  autoResize();
});

function autoResize() {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + "px";
}

// Geolocation: fire-and-forget when meeting goes live
function captureLocation() {
  if (!navigator.geolocation || !meetingId) return;
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      const { latitude, longitude } = pos.coords;
      const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&accept-language=${lang}`);
      const geo = await resp.json();
      const city = geo.address?.city || geo.address?.town || geo.address?.village || '';
      const country = geo.address?.country || '';
      const locationStr = [city, country].filter(Boolean).join(', ') || `${latitude.toFixed(2)}, ${longitude.toFixed(2)}`;
      await api("context", { meeting_id: meetingId, context_type: "location", content: locationStr });
      console.log("[meeting] Location captured:", locationStr);
    } catch (e) {
      console.warn("[meeting] Reverse geocoding failed:", e.message);
    }
  }, (err) => {
    console.log("[meeting] Geolocation not available:", err.message);
  }, { timeout: 10000, maximumAge: 300000 });
}

ctaLive.addEventListener("click", async () => {
  // Auto-save context before going live (so Sophie sees the agenda)
  await saveContext();

  // Start audio recording (getUserMedia + MediaRecorder) — one permission dialog
  await startAudioRecording();

  startRecStatusUpdates();
  // No captureLocation() — avoid second permission dialog.
  // Meeting location only appears in report if explicitly said in transcript.
  await transitionPhase("live", "user_click");
});
ctaPost.addEventListener("click", async () => {
  // Guard: prevent accidental end within 15 seconds of going live
  const MIN_LIVE_SECONDS = 15;
  if (liveStartTime) {
    const elapsed = (Date.now() - liveStartTime) / 1000;
    if (elapsed < MIN_LIVE_SECONDS) {
      const remaining = Math.ceil(MIN_LIVE_SECONDS - elapsed);
      const msg = lang === "de"
        ? `Meeting läuft erst seit ${Math.floor(elapsed)}s — bitte warte noch ${remaining}s.`
        : `Meeting has only been live for ${Math.floor(elapsed)}s — please wait ${remaining}s.`;
      appendSystemMsg(msg);
      return;
    }
  }
  await transitionPhase("post", "user_click");
});
ctaClose.addEventListener("click", async () => {
  await transitionPhase("closed", "user_click");
  // Navigate back to home after closing
  window.location.href = "/app";
});

$("saveContextBtn").addEventListener("click", saveContext);
muteToggle.addEventListener("click", toggleSophieMute);
// Old summary export buttons removed — report card handles all exports now

$("contextToggle").addEventListener("click", () => {
  contextPanel.classList.toggle("collapsed");
});

// Delete meeting
window.deleteMeeting = async function(id, btn) {
  const confirmMsg = lang === "de" ? "Meeting wirklich löschen?" : lang === "fr" ? "Supprimer ce meeting ?" : "Delete this meeting?";
  if (!confirm(confirmMsg)) return;
  btn.disabled = true;
  try {
    await api("delete", { meeting_id: id });
    btn.closest("div").remove();
  } catch (e) {
    alert("Error: " + e.message);
    btn.disabled = false;
  }
};

// File upload handlers
$("uploadArea").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => {
  for (const file of e.target.files) uploadFile(file);
  e.target.value = "";
});
$("uploadArea").addEventListener("dragover", (e) => {
  e.preventDefault();
  $("uploadArea").style.borderColor = "#c4a882";
});
$("uploadArea").addEventListener("dragleave", () => {
  $("uploadArea").style.borderColor = "";
});
$("uploadArea").addEventListener("drop", (e) => {
  e.preventDefault();
  $("uploadArea").style.borderColor = "";
  for (const file of e.dataTransfer.files) uploadFile(file);
});

$("backBtn").addEventListener("click", (e) => {
  if (meetingId) {
    e.preventDefault();
    meetingId = null;
    meetingData = null;
    chatMessages = [];
    chatArea.innerHTML = "";
    summaryCard.classList.add("hidden");
    window.history.replaceState({}, "", "/meeting/");
    showHistory();
  }
});

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
applyI18n();
initAuth();
</script>

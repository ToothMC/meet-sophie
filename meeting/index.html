// Request summary generation — API call, returns session ID
async function requestSummaryGeneration(mid, transcriptText) {
  const data = await api("summarize", { meeting_id: mid, chat_transcript: transcriptText });
  if (data.no_content) throw new Error("no_content");
  if (!data.report_session_id) throw new Error("no_session");
  return data.report_session_id;
}

async function generateSummary() {
  appendSystemMsg(lang === "de" ? "Erstelle Zusammenfassung..." : "Generating summary...");

  try {
    await MeetingStore.saveState(meetingId, { meetingStatus: "generating_report", reportStatus: "running" });
    currentMeetingStatus = "generating_report";

    // Build canonical transcript (Server > IDB > Memory merge)
    const input = await prepareSummaryInput(meetingId);
    console.log(`[meeting] Canonical transcript built: ${input.transcriptText.length} chars`);

    if (!input.hasContent) {
      console.log("[meeting] No transcript — will try report from notes/context");
      appendMsg("assistant", lang === "de"
        ? "Kein Audio-Transcript verfügbar — ich versuche den Report aus Notizen und Kontext zu erstellen."
        : "No audio transcript available — trying to create report from notes and context.");
    }

    // Show report card with progress bar immediately
    $("summaryCard").classList.remove("hidden");

    let sessionId;
    try {
      sessionId = await requestSummaryGeneration(meetingId, input.transcriptText);
    } catch (e) {
      if (e.message === "no_content") {
        $("summaryCard").classList.add("hidden");
        appendMsg("assistant", lang === "de"
          ? "Es wurden keine Inhalte erfasst — kein Report möglich. Starte ein neues Meeting mit Mikrofon oder Notizen."
          : "No content was captured — report not possible. Start a new meeting with microphone or notes.");
        await MeetingStore.saveState(meetingId, { meetingStatus: "report_completed", reportStatus: "done" });
        currentMeetingStatus = "report_completed";
        return;
      }
      throw e;
    }

    // Save session ID for potential retry
    await MeetingStore.saveState(meetingId, { reportSessionId: sessionId });
    triggerAndPollMeetingReport(sessionId, input.transcriptText);

  } catch (e) {
    console.error("[meeting] generateSummary error:", e);
    await MeetingStore.saveState(meetingId, {
      meetingStatus: "report_failed_recoverable", reportStatus: "failed",
      lastErrorMessage: e.message
    });
    currentMeetingStatus = "report_failed_recoverable";
    appendMsg("assistant", lang === "de"
      ? `⚠️ Fehler beim Erstellen des Reports: ${e.message}`
      : `⚠️ Error creating report: ${e.message}`);
    // Show retry button
    showRetryButton();
  }
}

// Poll for HTML report (same pipeline as Talk mode)
let meetingReportSessionId = null;
let meetingReportHtml = null;

async function triggerAndPollMeetingReport(sessionId, backendTranscript) {
  // Voice transcript only — NO chat fallback
  const fullTranscript = backendTranscript || "";

  // Fire generate-report (don't await — poll instead)
  await refreshAccessToken();
  const headers = { "Content-Type": "application/json" };
  if (accessToken) headers["Authorization"] = "Bearer " + accessToken;

  fetch("/api/ai/generate-report", {
    method: "POST",
    headers,
    body: JSON.stringify({
      session_id: sessionId,
      transcript_text: fullTranscript,
      session_mode: "meeting",
      language: lang || "de",
    }),
  }).catch(e => console.error("[meeting-report] generate fetch failed:", e?.message));

  // Now poll for progress
  pollMeetingReport(sessionId);
}

async function pollMeetingReport(sessionId) {
  meetingReportSessionId = sessionId;
  const reportProgress = $("reportProgress");
  const reportProgressBar = $("reportProgressBar");
  const reportProgressLabel = $("reportProgressLabel");
  const reportTitle = $("reportTitle");
  const isDE = lang === "de";

  reportProgressBar.style.width = "5%";

  const maxAttempts = 90;
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    await new Promise(r => setTimeout(r, 2000));

    try {
      const headers = {};
      try {
        const { data: { session: authSession } } = await supabase.auth.getSession();
        if (authSession?.access_token) headers["Authorization"] = "Bearer " + authSession.access_token;
      } catch (_) {}

      const res = await fetch(`/api/ai/report-status?session_id=${sessionId}`, { headers });
      if (!res.ok) continue;
      const data = await res.json();

      const progress = Math.max(5, Math.min(98, data.progress || 0));
      reportProgressBar.style.width = progress + "%";

      // Descriptive progress labels
      if (data.detail) {
        reportProgressLabel.textContent = data.detail;
      } else if (progress < 20) {
        reportProgressLabel.textContent = isDE ? "Transcript wird analysiert..." : "Analyzing transcript...";
      } else if (progress < 50) {
        reportProgressLabel.textContent = isDE ? "Protokoll wird erstellt..." : "Generating report...";
      } else if (progress < 85) {
        reportProgressLabel.textContent = isDE ? "Formatierung & Qualitätsprüfung..." : "Formatting & quality check...";
      } else {
        reportProgressLabel.textContent = isDE ? "Fast fertig..." : "Almost done...";
      }

      if (data.status === "done" && data.report_html) {
        reportProgressBar.style.width = "100%";
        reportProgressLabel.textContent = isDE ? "Fertig!" : "Done!";
        setTimeout(() => { reportProgress.style.display = "none"; }, 800);

        meetingReportHtml = data.report_html;
        showMeetingReport(data.report_html);

        // Mark completed + cleanup IDB (in own error-tolerant function)
        MeetingStore.saveState(meetingId, { meetingStatus: "report_completed", reportStatus: "done" })
          .then(() => { currentMeetingStatus = "report_completed"; })
          .catch(() => {});
        tryCleanup(meetingId);
        return;
      }

      if (data.status === "failed") {
        reportTitle.textContent = isDE ? "Protokoll fehlgeschlagen" : "Report failed";
        reportProgressLabel.textContent = data.detail || (isDE ? "Bitte erneut versuchen." : "Please try again.");
        reportProgressBar.style.background = "#ef4444";
        reportProgressBar.style.width = "100%";
        MeetingStore.saveState(meetingId, { meetingStatus: "report_failed_recoverable", reportStatus: "failed" }).catch(() => {});
        currentMeetingStatus = "report_failed_recoverable";
        showRetryButton();
        return;
      }
    } catch (e) {
      console.error("[meeting-report-poll] error:", e?.message);
    }
  }

  reportTitle.textContent = isDE ? "Zeitüberschreitung" : "Timeout";
  reportProgressLabel.textContent = isDE ? "Protokoll konnte nicht erstellt werden." : "Report generation timed out.";
  MeetingStore.saveState(meetingId, { meetingStatus: "report_failed_recoverable", reportStatus: "failed" }).catch(() => {});
  currentMeetingStatus = "report_failed_recoverable";
  showRetryButton();
}

function showMeetingReport(html) {
  const reportPreview = $("reportPreview");
  const reportActions = $("reportActions");
  const reportFrame = $("reportFrame");
  const reportDirect = $("reportDirect");
  const isMobile = window.innerWidth <= 600 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.matchMedia("(max-width:600px)").matches;

  reportPreview.classList.remove("hidden");
  reportActions.classList.remove("hidden");
  reportActions.style.display = "block";

  console.log("[meeting-report] isMobile:", isMobile, "innerWidth:", window.innerWidth, "UA:", navigator.userAgent.slice(0,60));
  if (isMobile) {
    // Mobile: render directly in DOM with mobile-optimised CSS overlay
    // The original HTML stays untouched for PDF/export (getExportHtml)
    reportFrame.style.display = "none";
    reportDirect.style.display = "block";

    // Transform A4 HTML into mobile-native layout
    // AI generates all-div HTML with inline styles. We rewrite styles for mobile
    // while preserving the visual hierarchy (labels small/grey, values large, sections separated).
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    // Remove <style> blocks (A4 print styles)
    tmp.querySelectorAll("style").forEach(s => s.remove());
    // Transcript: respect toggle state (default hidden, shown if user checked "Gesprächsverlauf")
    const transcript = tmp.querySelector('[data-section="full-transcript"]');
    const transcriptOn = $("optTranscript")?.checked;
    if (transcript) {
      transcript.setAttribute("style", transcriptOn ? "" : "display:none");
    }
    // Remove pure spacer divs (1px height lines used as A4 separators)
    tmp.querySelectorAll('div').forEach(el => {
      const s = el.getAttribute("style") || "";
      if (/height:\s*1px/.test(s) && el.children.length === 0 && !el.textContent.trim()) el.remove();
    });
    // Rewrite inline styles for mobile: detect element role by original style hints
    tmp.querySelectorAll("[style]").forEach(el => {
      const s = el.getAttribute("style") || "";
      const text = el.textContent.trim();
      if (el.hasAttribute("data-section")) return; // keep transcript hidden
      // Uppercase label (font-size 8-10px, letter-spacing, uppercase) → mobile label
      if (/font-size:\s*[89]px/.test(s) && /text-transform:\s*uppercase/.test(s)) {
        el.setAttribute("style", "font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#a09080;margin:20px 0 4px;");
        return;
      }
      // Title (font-size 20-28px) → mobile title
      if (/font-size:\s*2[0-8]px/.test(s)) {
        el.setAttribute("style", "font-size:22px;font-weight:700;color:#1a1a1a;margin:0 0 2px;line-height:1.25;");
        return;
      }
      // Agenda item number (min-width, 9px, color #bbb)
      if (/min-width/.test(s) && /font-size:\s*9px/.test(s)) {
        el.setAttribute("style", "font-size:12px;font-weight:700;color:#c4a882;min-width:24px;");
        return;
      }
      // Agenda item title (13-16px, font-weight 400-600)
      if (/font-size:\s*1[3-6]px/.test(s) && /font-weight:\s*[4-6]00/.test(s) && text.length < 120) {
        el.setAttribute("style", "font-size:15px;font-weight:600;color:#1a1a1a;margin-bottom:4px;");
        return;
      }
      // Body text (12-14px, color #333-#555, light weight)
      if (/font-size:\s*1[2-4]px/.test(s) && /color:#[345]/.test(s)) {
        el.setAttribute("style", "font-size:14px;color:#4a4040;line-height:1.7;margin-bottom:8px;");
        return;
      }
      // Flex containers → stack on mobile
      if (/display:\s*flex/.test(s)) {
        const isRow = /align-items:\s*baseline/.test(s) || /align-items:\s*flex-start/.test(s);
        el.setAttribute("style", isRow
          ? "display:flex;gap:10px;align-items:baseline;margin-bottom:6px;"
          : "display:flex;flex-direction:column;gap:2px;margin-bottom:16px;");
        return;
      }
      // Main container
      if (/max-width:\s*\d+px/.test(s) && /margin:\s*0\s*auto/.test(s)) {
        el.setAttribute("style", "padding:4px 0;color:#1a1a1a;line-height:1.6;");
        return;
      }
      // Section container with large padding
      if (/padding.*[3-7]0px/.test(s) || /margin-bottom:\s*[3-5]\dpx/.test(s)) {
        el.setAttribute("style", "margin-bottom:16px;");
        return;
      }
      // Indented content (padding-left: 56px etc.)
      if (/padding-left:\s*\d{2,}px/.test(s)) {
        el.setAttribute("style", "font-size:14px;color:#4a4040;line-height:1.7;margin-bottom:8px;padding-left:34px;");
        return;
      }
      // Border-bottom dividers in header
      if (/border-bottom/.test(s)) {
        el.setAttribute("style", "border-bottom:1px solid #ede8e2;padding-bottom:12px;margin-bottom:16px;");
        return;
      }
      // Default: remove style, let it flow
      el.removeAttribute("style");
    });

    const mobileCSS = `<style id="sophie-mobile-report">
      #reportDirect {
        font-family: -apple-system, system-ui, sans-serif;
        color: #2a2420; font-size: 14px; line-height: 1.65;
        overflow-x: hidden; word-wrap: break-word;
      }
      #reportDirect table { width:100%; border-collapse:collapse; font-size:13px; margin:8px 0 16px; }
      #reportDirect th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:#a09080; padding:6px 8px; border-bottom:2px solid #ede8e2; }
      #reportDirect td { padding:8px; border-bottom:1px solid #f0ece6; vertical-align:top; word-break:break-word; }
      #reportDirect ul, #reportDirect ol { margin:0 0 12px; padding-left:20px; }
      #reportDirect li { margin-bottom:6px; font-size:14px; color:#4a4040; }
      #reportDirect img { max-width:100%; height:auto; }
      #reportDirect .meeting-protocol { padding:0 !important; margin:0 !important; max-width:100% !important; }
    </style>`;

    reportDirect.innerHTML = mobileCSS + tmp.innerHTML;
    console.log("[meeting-report] Mobile render: styles rewritten for mobile");
  } else {
    // Desktop: iframe for A4 isolation
    reportDirect.style.display = "none";
    reportFrame.style.display = "block";
    const doc = reportFrame.contentDocument || reportFrame.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();
    setTimeout(() => {
      try { reportFrame.style.height = doc.documentElement.scrollHeight + "px"; } catch (_) {}
    }, 500);
  }

  // Helper: filter report sections based on toggle options (DOM-based, reliable)
  // Always works on the ORIGINAL report HTML (meetingReportHtml), not the re-rendered version
  function getExportHtml() {
    const originalHtml = meetingReportHtml || html;
    const tmp = document.createElement("div");
    tmp.innerHTML = originalHtml;

    // Transcript: remove if off, show if on
    const transcriptEl = tmp.querySelector('[data-section="full-transcript"]');
    if (transcriptEl) {
      if (!$("optTranscript")?.checked) {
        transcriptEl.remove();
      } else {
        transcriptEl.style.display = "";
      }
    }

    // Lean Check: try data-section first, then find by text content
    if (!$("optLeanCheck")?.checked) {
      let leanEl = tmp.querySelector('[data-section="lean-check"]');
      if (!leanEl) {
        // AI doesn't always add data-section — find by label text
        tmp.querySelectorAll("div").forEach(el => {
          const t = el.textContent.trim().toLowerCase();
          if (t.startsWith("lean check") && el.children.length <= 2) leanEl = el.closest("div[style]") || el;
        });
        // Walk up to find the section container (parent with margin-bottom)
        if (leanEl) {
          const parent = leanEl.parentElement;
          if (parent && parent !== tmp && /margin-bottom/.test(parent.getAttribute("style") || "")) leanEl = parent;
        }
      }
      if (leanEl) leanEl.remove();
    }

    // Re-assemble: extract style block + body content
    const styleMatch = originalHtml.match(/<style[^>]*>[\s\S]*?<\/style>/i);
    const styleBlock = styleMatch ? styleMatch[0] : "";
    return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">${styleBlock}</head><body>${tmp.innerHTML}</body></html>`;
  }

  function downloadHtmlFile(content, suffix) {
    const blob = new Blob([content], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = window.SophieExport
      ? SophieExport.buildFilename({ type: "meeting", title: suffix, createdAt: new Date() })
      : `meeting-${suffix}-${new Date().toISOString().slice(0,10)}.html`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // Wire up report action buttons
  // PDF Export — opens print dialog (official protocol without transcript)
  $("reportPrintBtn").onclick = () => {
    const cleanHtml = getExportHtml();
    const isMobilePrint = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isMobilePrint) {
      // Mobile: window.open is blocked by iOS. Use hidden iframe for print.
      let printFrame = document.getElementById("_printFrame");
      if (!printFrame) {
        printFrame = document.createElement("iframe");
        printFrame.id = "_printFrame";
        printFrame.style.cssText = "position:fixed;top:-9999px;left:-9999px;width:0;height:0;border:none;";
        document.body.appendChild(printFrame);
      }
      const doc = printFrame.contentDocument || printFrame.contentWindow.document;
      doc.open();
      doc.write(cleanHtml);
      doc.close();
      // Give browser time to render, then trigger print
      setTimeout(() => {
        try {
          printFrame.contentWindow.focus();
          printFrame.contentWindow.print();
        } catch (_) {
          // If iframe print also fails, fall back to HTML download
          const blob = new Blob([cleanHtml], { type: "text/html;charset=utf-8" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `protokoll-${new Date().toISOString().slice(0,10)}.html`;
          a.click();
          URL.revokeObjectURL(a.href);
          alert(lang === "de"
            ? "PDF: Datei heruntergeladen — öffne sie und nutze Teilen → Drucken → Als PDF sichern."
            : "PDF: File downloaded — open it and use Share → Print → Save as PDF.");
        }
      }, 600);
    } else {
      // Desktop: open in new window for print dialog
      const printWin = window.open("", "_blank");
      if (!printWin) { alert(lang === "de" ? "Popup-Blocker aktiv — bitte erlauben." : "Popup blocked — please allow popups."); return; }
      printWin.document.write(cleanHtml);
      printWin.document.close();
      printWin.onload = () => { printWin.focus(); printWin.print(); };
      setTimeout(() => { try { printWin.focus(); printWin.print(); } catch(_) {} }, 500);
    }
  };

  // Download — respects toggle options
  $("reportDownloadFullBtn").onclick = () => {
    downloadHtmlFile(getExportHtml(), "protokoll");
  };

  $("reportCopyBtn").onclick = async () => {
    const cleanHtml = getExportHtml();
    // Parse clean HTML to get plain text without transcript
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = cleanHtml;
    const plainText = tempDiv.innerText || tempDiv.textContent || "";
    try {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([cleanHtml], { type: "text/html" }),
        "text/plain": new Blob([plainText], { type: "text/plain" }),
      })]);
      $("reportCopyBtn").textContent = "✓ Kopiert";
      setTimeout(() => { $("reportCopyBtn").textContent = "📋 Kopieren"; }, 2000);
    } catch {
      await navigator.clipboard.writeText(plainText);
      $("reportCopyBtn").textContent = "✓ Text kopiert";
      setTimeout(() => { $("reportCopyBtn").textContent = "📋 Kopieren"; }, 2000);
    }
  };

  $("reportTemplateBtn").onclick = async () => {
    try {
      const { data: { session: authSession } } = await supabase.auth.getSession();
      const headers = { "Content-Type": "application/json" };
      if (authSession?.access_token) headers["Authorization"] = "Bearer " + authSession.access_token;

      const res = await fetch("/api/ai/save-template", {
        method: "POST",
        headers,
        body: JSON.stringify({ session_id: meetingReportSessionId, mode: "meeting" }),
      });
      if (res.ok) {
        $("reportTemplateBtn").textContent = "✓ Vorlage gespeichert";
        setTimeout(() => { $("reportTemplateBtn").textContent = "💾 Als Vorlage"; }, 3000);
      }
    } catch (e) {
      console.error("Save template error:", e);
    }
  };

  // Teilen — Share-Sheet + Clipboard
  const _shareBtn = $("reportShareBtn");
  if (_shareBtn) {
    _shareBtn.onclick = async () => {
      const cleanHtml = getExportHtml();
      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = cleanHtml;
      const plainText = tempDiv.innerText || tempDiv.textContent || "";
      if (window.SophieExport) {
        const result = await SophieExport.shareReport(cleanHtml, plainText, "Meeting Protokoll");
        if (result.method === "clipboard") {
          _shareBtn.textContent = "✓ Kopiert";
          setTimeout(() => { _shareBtn.textContent = "📤 Teilen"; }, 2000);
        }
      }
    };
  }

  // Fortführen — neues Meeting mit parent_meeting_id
  const _continueBtn = $("reportContinueBtn");
  if (_continueBtn) {
    _continueBtn.onclick = () => {
      if (window.SophieExport) {
        SophieExport.writeContinuePayload({
          sourceType: "meeting",
          sourceId: meetingId,
          resumeSessionId: meetingReportSessionId,
          targetMode: "meeting",
        });
      }
      window.location.href = `/meeting/?parentMeetingId=${encodeURIComponent(meetingId)}`;
    };
  }

  // "Aktualisieren" — re-render report with current toggle options (no AI call)
  // Always re-filter from the ORIGINAL HTML, then re-render
  $("reportRegenerateBtn").onclick = () => {
    const originalHtml = meetingReportHtml || html;
    const tmp = document.createElement("div");
    tmp.innerHTML = originalHtml;

    // Apply toggle filters on original
    const transcriptEl = tmp.querySelector('[data-section="full-transcript"]');
    if (transcriptEl) {
      if (!$("optTranscript")?.checked) transcriptEl.remove();
      else transcriptEl.style.display = "";
    }
    if (!$("optLeanCheck")?.checked) {
      let leanEl = tmp.querySelector('[data-section="lean-check"]');
      if (!leanEl) {
        tmp.querySelectorAll("div").forEach(el => {
          const t = el.textContent.trim().toLowerCase();
          if (t.startsWith("lean check") && el.children.length <= 2) leanEl = el.closest("div[style]") || el;
        });
        if (leanEl) {
          const parent = leanEl.parentElement;
          if (parent && parent !== tmp && /margin-bottom/.test(parent.getAttribute("style") || "")) leanEl = parent;
        }
      }
      if (leanEl) leanEl.remove();
    }

    // Extract style block from original for the re-render
    const styleMatch = originalHtml.match(/<style[^>]*>[\s\S]*?<\/style>/i);
    const filtered = (styleMatch ? styleMatch[0] : "") + tmp.innerHTML;
    showMeetingReport(filtered);

    $("reportRegenerateBtn").disabled = true;
    $("reportRegenerateBtn").style.opacity = ".4";
  };
}

// Toggle change → activate "Aktualisieren" button
window.onReportOptionChange = function() {

    btn.disabled = false;
    btn.style.opacity = "1";

function renderDocCard(fc, container) {
  const meta = fc.metadata || {};
  const fileName = meta.original_filename
    || (fc.file_path ? fc.file_path.split("/").pop().replace(/^\d+_/, "") : "File");
  const ext = fileName.split(".").pop().toLowerCase();
  const icon = ext === "pdf" ? "📄" : ["png","jpg","jpeg","webp"].includes(ext) ? "🖼️"
    : ext === "docx" ? "📝" : ext === "pptx" ? "📊" : "📎";

  const div = document.createElement("div");
  div.className = "doc-card";
  div.dataset.contextId = fc.id || "";

  const preview = meta.preview || "";
  const charInfo = meta.char_count > 0
    ? `${(meta.char_count / 1000).toFixed(1)}k Zeichen` : "";

  div.innerHTML = `
    <div class="doc-card-header">
      <span class="doc-card-icon">${icon}</span>
      <span class="doc-card-name" title="${fileName}">${fileName}</span>
      <span class="doc-card-status">${charInfo}</span>
    </div>
    ${preview ? `<div class="doc-card-preview">${preview}</div>` : ""}
    <div class="doc-card-actions">
      <button class="doc-card-btn" onclick="openDocModal(this)">Anzeigen</button>
      <button class="doc-card-btn primary" onclick="analyzeDoc(this)">Mit KI analysieren</button>
    </div>`;

  // Store full content for modal
  div._fullContent = fc.content || "";
  div._fileName = fileName;
  container.appendChild(div);
}

function openDocModal(btn) {
  const card = btn.closest(".doc-card");
  const content = card._fullContent || "(kein Inhalt)";
  const fileName = card._fileName || "Dokument";

  const overlay = document.createElement("div");
  overlay.className = "doc-modal-overlay";
  overlay.innerHTML = `
    <div class="doc-modal">
      <div class="doc-modal-header">
        <span class="doc-modal-title">${fileName}</span>
        <button class="doc-modal-close" onclick="this.closest('.doc-modal-overlay').remove()">✕</button>
      </div>
      <div class="doc-modal-body">${content.replace(/</g,"&lt;")}</div>
    </div>`;
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function analyzeDoc(btn) {
  const card = btn.closest(".doc-card");
  const contextId = card.dataset.contextId;
  if (!contextId) { appendSystemMsg("⚠️ Dokument noch nicht gespeichert — bitte kurz warten."); return; }
  analyzeDocById(contextId, card, btn);
}

async function analyzeDocById(contextId, card, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "Analysiere..."; }
  try {
    const result = await api("analyze_doc", { meeting_id: meetingId, context_id: contextId });
    if (!result?.analysis) throw new Error("Keine Analyse");
    showAnalysisPanel(result.analysis, card);
    if (result.cached && btn) btn.textContent = "Erneut anzeigen";
  } catch (e) {
    appendSystemMsg("⚠️ Analyse fehlgeschlagen: " + (e?.message || e));
  } finally {
    if (btn) { btn.disabled = false; if (!btn.textContent.includes("anzeigen")) btn.textContent = "Mit KI analysieren"; }
  }
}

function showAnalysisPanel(analysis, card) {
  // Remove existing panel if any
  card.querySelector(".analysis-panel")?.remove();

  const sections = [
    { key: "offene_punkte",     label: "Offene Punkte",    emoji: "❓" },
    { key: "entscheidungen",    label: "Entscheidungen",   emoji: "✅" },
    { key: "folgeaufgaben",     label: "Folgeaufgaben",    emoji: "📌" },
    { key: "agenda_vorschlaege",label: "Agenda-Vorschläge",emoji: "📋" },
  ];

  let html = `<div class="analysis-panel" style="margin-top:8px;border-top:1px solid #ede8e2;padding-top:8px">`;
  let hasContent = false;

  sections.forEach(({ key, label, emoji }) => {
    const items = analysis[key];
    if (!items?.length) return;
    hasContent = true;
    html += `<div style="margin-bottom:6px"><div style="font-size:11px;font-weight:600;color:#5a4a40;margin-bottom:3px">${emoji} ${label}</div>`;
    items.forEach((item, i) => {
      const escaped = item.replace(/</g, "&lt;");
      html += `<label style="display:flex;align-items:flex-start;gap:6px;font-size:11px;color:#5a4a40;margin-bottom:2px;cursor:pointer">
        <input type="checkbox" class="agenda-item-cb" data-text="${escaped}" style="margin-top:2px;flex-shrink:0">
        <span>${escaped}</span>
      </label>`;
    });
    html += `</div>`;
  });

  if (!hasContent) {
    html += `<div style="font-size:11px;color:#a09080">Keine strukturierten Inhalte gefunden.</div>`;
  } else {
    html += `<button class="doc-card-btn primary" style="margin-top:4px;width:100%" onclick="importCheckedToAgenda(this)">Auswahl in Agenda übernehmen</button>`;
  }
  html += `</div>`;
  card.insertAdjacentHTML("beforeend", html);
}

function importCheckedToAgenda(btn) {
  const panel = btn.closest(".analysis-panel");
  const checked = [...panel.querySelectorAll(".agenda-item-cb:checked")];
  if (!checked.length) { appendSystemMsg("Bitte zuerst Punkte auswählen."); return; }

  const items = checked.map(cb => "- " + cb.dataset.text).join("\n");
  const agendaEl = $("ctxAgenda");
  agendaEl.value = (agendaEl.value.trim() ? agendaEl.value.trim() + "\n" : "") + items;
  autoResizeTextarea(agendaEl);

  // Auto-save context
  $("saveContextBtn").click();
  appendSystemMsg(`${checked.length} Punkt(e) zur Agenda hinzugefügt.`);
}

async function uploadFile(file) {
  if (!meetingId) return;

  // Reject Pages files with helpful message
  if (file.name.endsWith(".pages")) {
    const pagesMsg = lang === "de"
      ? "Pages-Dateien werden nicht unterstützt. Bitte als DOCX oder PDF exportieren."
      : "Pages files are not supported. Please export as DOCX or PDF.";
    appendSystemMsg("⚠️ " + pagesMsg);
    return;
  }

  const fileList = $("fileList");
  const itemDiv = document.createElement("div");
  itemDiv.className = "file-item uploading";
  itemDiv.innerHTML = `<span class="file-icon">${FILE_ICONS[file.type] || "📎"}</span><span class="file-name">${file.name}</span><span class="file-status">...</span>`;
  fileList.appendChild(itemDiv);

  try {
    // 1. Upload to Supabase Storage
    const path = `${meetingId}/${Date.now()}_${file.name}`;
    const { error: uploadErr } = await supabase.storage
      .from("meeting-files")
      .upload(path, file, { contentType: file.type });
    if (uploadErr) throw uploadErr;

    // 2. Extract text content for TXT files
    let content = `[File: ${file.name}]`;
    if (file.type === "text/plain") {
      content = await file.text();
      if (content.length > 8000) content = content.slice(0, 8000) + "\n... (truncated)";
    }

    // 3. Save as meeting_context (server extracts PDF/DOCX/image content)
    const ctxResult = await api("context", {
      meeting_id: meetingId,
      context_type: "file",
      content,
      file_path: path,
    });

    // Replace uploading placeholder with document card
    itemDiv.remove();
    if (ctxResult?.context) {
      renderDocCard(ctxResult.context, $("fileList"));
    }
    appendSystemMsg(`${file.name} ${t("uploadDone").toLowerCase()}`);
  } catch (e) {
    itemDiv.classList.remove("uploading");
    itemDiv.querySelector(".file-status").textContent = "✗";
    itemDiv.querySelector(".file-status").style.color = "#ff5a5a";
    console.error("Upload error:", e);
  }
}

// ---------------------------------------------------------------------------
// Audio Recording (MediaRecorder) + Whisper Transcription at end
// Works on ALL browsers (no Google dependency like SpeechRecognition)
// Records in 2-minute segments so each blob stays under API limits.
// ---------------------------------------------------------------------------
let mediaRecorder = null;
let audioChunks = [];
let audioSegments = []; // Array of complete Blobs, each with its own header
let segmentRotationTimer = null;
let currentMimeType = "audio/webm";
const AUDIO_SEGMENT_MS = LIVE_SEGMENT_MS; // 60s for live hybrid mode (was 120s)

async function startAudioRecording() {
  try {
    // Clean up any dead streams/recorders before starting fresh
    if (mediaRecorder) {
      try { if (mediaRecorder.state === "recording") mediaRecorder.stop(); } catch (_) {}
      mediaRecorder = null;
    }
    if (sharedMicStream) {
      sharedMicStream.getTracks().forEach(t => t.stop());
      sharedMicStream = null;
    }
    if (segmentRotationTimer) {
      clearInterval(segmentRotationTimer);
      segmentRotationTimer = null;
    }

    sharedMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });

    // Monitor track health — if OS kills the mic, we know immediately
    sharedMicStream.getAudioTracks().forEach(track => {
      track.addEventListener("ended", () => {
        console.warn("[meeting-audio] Mic track ended unexpectedly — stream revoked by OS");
        if (meetingData?.phase === "live") {
          appendSystemMsg(lang === "de"
            ? "⚠️ Mikrofon wurde vom System getrennt — bei Rückkehr wird die Aufnahme neu gestartet."
            : "⚠️ Microphone disconnected by system — recording will restart when you return.");
        }
      });
    });

    appendSystemMsg("✅ Mikrofon aktiv — Aufnahme läuft");

    // iOS Safari: prefer mp4, desktop: prefer webm/opus
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isIOS) {
      // iOS Safari: mp4 is most reliable, webm may silently fail
      currentMimeType = MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4"
                : MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
                : "audio/webm";
    } else {
      currentMimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
                : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm"
                : "audio/mp4";
    }
    console.log(`[meeting-audio] Selected MIME: ${currentMimeType}, iOS: ${isIOS}`);
    audioChunks = [];
    audioSegments = [];
    _startNewRecorder();

    if (!mediaRecorder || mediaRecorder.state !== "recording") {
      appendSystemMsg("⚠️ Aufnahme konnte nicht gestartet werden — bitte Mikrofon-Berechtigung prüfen");
      console.error("[meeting-audio] MediaRecorder failed to start, state:", mediaRecorder?.state);
      return;
    }

    // Rotate segment every 60s to keep each blob small
    segmentRotationTimer = setInterval(() => _rotateSegment(), AUDIO_SEGMENT_MS);
    console.log("[meeting-audio] Recording started, mimeType:", currentMimeType);
  } catch (e) {
    appendSystemMsg(`❌ Mikrofon nicht verfügbar: ${e.message}`);
    console.error("[meeting-audio] getUserMedia failed:", e.message);
  }
}

function _startNewRecorder() {
  if (!sharedMicStream || !sharedMicStream.active) {
    console.error("[meeting-audio] Stream not active, cannot start recorder");
    appendSystemMsg("⚠️ Mikrofon-Stream unterbrochen — Aufnahme gestoppt");
    return;
  }
  try {
    mediaRecorder = new MediaRecorder(sharedMicStream, {
      mimeType: currentMimeType,
      audioBitsPerSecond: 32000,
    });
  } catch (e) {
    console.error("[meeting-audio] MediaRecorder constructor failed:", e.message);
    appendSystemMsg(`⚠️ Aufnahme-Fehler (${currentMimeType}): ${e.message}`);
    // Fallback: try without specifying mimeType (let browser choose)
    try {
      mediaRecorder = new MediaRecorder(sharedMicStream);
      currentMimeType = mediaRecorder.mimeType || "audio/webm";
      console.log("[meeting-audio] Fallback recorder started, mimeType:", currentMimeType);
    } catch (e2) {
      console.error("[meeting-audio] Fallback MediaRecorder also failed:", e2.message);
      appendSystemMsg(`❌ Aufnahme nicht möglich: ${e2.message}`);
      return;
    }
  }
  audioChunks = [];

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) audioChunks.push(e.data);
  };
  mediaRecorder.onerror = (e) => {
    console.error("[meeting-audio] MediaRecorder error:", e.error?.message);
    appendSystemMsg(`⚠️ Aufnahme-Fehler: ${e.error?.message || "unbekannt"}`);
  };
  // 10-second timeslice for crash safety
  mediaRecorder.start(10000);
}

function _rotateSegment() {
  if (!mediaRecorder || mediaRecorder.state !== "recording") {
    console.warn(`[meeting-audio] _rotateSegment skipped: recorder state=${mediaRecorder?.state || "null"}`);
    return;
  }
  // Detect zombie recorder: "recording" but mic stream is dead → blobs will be empty
  if (typeof isMicStreamDead === "function" && isMicStreamDead()) {
    console.warn("[meeting-audio] _rotateSegment: recorder alive but mic stream dead — skipping (waiting for visibility recovery)");
    return;
  }
  // If emergency flush already saved this segment, skip and reset
  if (_emergencyFlushed) {
    _emergencyFlushed = false;
    liveSegmentIndex++;
    _startNewRecorder();
    return;
  }
  const recorder = mediaRecorder;
  const segIdx = liveSegmentIndex++;
  recorder.onstop = () => {
    if (audioChunks.length > 0) {
      const blob = new Blob(audioChunks, { type: recorder.mimeType || currentMimeType });
      if (blob.size > 500) {
        audioSegments.push(blob);
        console.log(`[meeting-audio] Segment ${segIdx} saved: ${(blob.size / 1024).toFixed(0)}KB`);
        // Persist to IDB (awaited for confirmation, non-blocking for recorder)
        if (MeetingStore.isAvailable() && meetingId) {
          MeetingStore.saveSegment(meetingId, segIdx, blob, recorder.mimeType || currentMimeType)
            .then(() => MeetingStore.saveState(meetingId, { totalSegmentCount: segIdx + 1 }))
            .catch(e => console.error("[meeting-store] Segment persist failed:", e));
        }
        // Live transcription: send to Whisper with meeting_id
        if (meetingId && meetingData?.phase === "live") {
          transcribeLiveSegment(blob, segIdx);
        }
      }
      audioChunks = [];
    }
    _startNewRecorder();
  };
  recorder.stop();
}

// ── Live Whisper Transcription (Hybrid Mode) ────────────────────────────
async function transcribeLiveSegment(blob, segIdx, isRetry = false) {
  try {
    await refreshAccessToken();
    const authToken = accessToken;

    const ext = blob.type?.includes("mp4") ? "audio.mp4" : "audio.webm";
    const langCode = lang === "de" ? "de" : lang === "fr" ? "fr" : "en";

    const formData = new FormData();
    formData.append("file", blob, ext);
    formData.append("language", langCode);
    formData.append("meeting_id", meetingId);
    formData.append("segment_index", String(segIdx));

    const resp = await fetch("/api/ai/transcribe", {
      method: "POST",
      headers: { "Authorization": `Bearer ${authToken}` },
      body: formData,
    });

    if (resp.status === 402) {
      // No tokens remaining — stop meeting
      appendSystemMsg(lang === "de"
        ? "⚠️ Guthaben aufgebraucht — Meeting wird beendet."
        : "⚠️ No tokens remaining — ending meeting.");
      transitionPhase("post", "transcribe_402_no_tokens");
      return;
    }

    if (resp.status === 409) {
      // Meeting not in live phase or billing finalized — stop transcription
      console.log(`[meeting-live] Transcribe 409: meeting not live or finalized`);
      return;
    }

    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }

    const data = await resp.json();
    let text = (data.text || "").trim();
    // Filter known Whisper end-of-audio hallucination artifacts
    const WHISPER_ARTIFACTS = [
      "Untertitel der Amara.org-Community",
      "Untertitel von der Amara.org-Community",
      "Vielen Dank fürs Zuschauen",
      "Vielen Dank für's Zuschauen",
      "Thanks for watching",
      "Thank you for watching",
      "Sous-titres réalisés par la communauté d'Amara.org",
      "Merci d'avoir regardé",
    ];
    for (const artifact of WHISPER_ARTIFACTS) {
      if (text.endsWith(artifact)) {
        console.log(`[meeting-live] Whisper artifact removed: "${artifact}"`);
        text = text.slice(0, -artifact.length).trim();
      }
    }
    if (text) {
      liveTranscriptChunks[segIdx] = text;
      console.log(`[meeting-live] Seg ${segIdx}: "${text.slice(0, 80)}..."`);
      // Track in IDB
      MeetingStore.updateSegmentTranscript(meetingId, segIdx, "live_ok", "live", text, null).catch(() => {});
    }
    consecutiveTranscribeErrors = 0;
    transcribeWarningShown = false;
  } catch (e) {
    console.error(`[meeting-live] Transcribe seg ${segIdx} failed:`, e.message);
    consecutiveTranscribeErrors++;

    if (!isRetry) {
      // Retry once after 2s
      setTimeout(() => transcribeLiveSegment(blob, segIdx, true), 2000);
    } else {
      // Mark as failed in IDB
      MeetingStore.updateSegmentTranscript(meetingId, segIdx, "live_failed", null, null,
        { code: "TRANSCRIBE_FAIL", message: e.message, attempts: 2, lastAttemptAt: Date.now() }
      ).catch(() => {});
      if (consecutiveTranscribeErrors >= 2 && !transcribeWarningShown) {
        transcribeWarningShown = true;
        appendSystemMsg(lang === "de"
          ? "⚠️ Live-Transkription unterbrochen — Meeting läuft weiter"
          : "⚠️ Live transcription interrupted — meeting continues");
        // Proactive mic recovery: if 3+ consecutive errors, the mic stream may be dead
        if (consecutiveTranscribeErrors >= 3 && meetingData?.phase === "live") {
          console.warn("[meeting-live] 3+ transcribe errors — attempting mic stream recovery");
          try {
            if (!sharedMicStream || !sharedMicStream.active || sharedMicStream.getTracks().every(t => t.readyState === "ended")) {
              appendSystemMsg(lang === "de"
                ? "🔄 Mikrofon-Stream unterbrochen — starte Aufnahme neu..."
                : "🔄 Mic stream interrupted — restarting recording...");
              await startAudioRecording();
              consecutiveTranscribeErrors = 0;
            }
          } catch (recErr) {
            console.error("[meeting-live] Mic recovery failed:", recErr.message);
          }
        }
      }
    }
  }
}

function pauseAudioRecording() {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.pause();

  }
}

    if (!segmentRotationTimer) {

// ── Meeting Pause / Resume ──────────────────────────────────────────────────
function pauseMeeting() {
  if (meetingIsPaused) return;
  meetingIsPaused = true;
  console.log("[meeting] pausing");

  // Pause audio recording
  pauseAudioRecording();

  // Disconnect Sophie voice if active
  if (!sophieMuted) {
    toggleSophieMute(); // disconnects Sophie
  }

  // Pause timer — save total elapsed (replace, not accumulate — liveStartTime is already backdated on resume)
  if (liveStartTime) {
    meetingPausedElapsed = Date.now() - liveStartTime;
  }
  stopLiveTimer();

  // UI
  meetingPauseBtn.textContent = "▶ Resume";
  meetingPauseBtn.classList.add("is-paused");
  liveTimerEl.textContent = "PAUSED";
  liveTimerEl.classList.remove("hidden");
}

function resumeMeeting() {
  if (!meetingIsPaused) return;
  meetingIsPaused = false;
  console.log("[meeting] resuming");

  // Resume audio recording
  resumeAudioRecording();

  // Resume timer from saved position
  liveStartTime = Date.now() - meetingPausedElapsed;
  liveTimerEl.classList.remove("hidden");
  if (liveTimerInterval) clearInterval(liveTimerInterval); // defensive: prevent leaked intervals
  liveTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - liveStartTime) / 1000);
    const m = Math.floor(elapsed / 60).toString().padStart(2, "0");
    const s = (elapsed % 60).toString().padStart(2, "0");
    liveTimerEl.textContent = `🔴 Aufnahme ${m}:${s}`;
  }, 1000);

  // UI
  meetingPauseBtn.textContent = "⏸ Pause";
  meetingPauseBtn.classList.remove("is-paused");
}

if (meetingPauseBtn) {
  meetingPauseBtn.addEventListener("click", () => {
    meetingIsPaused ? resumeMeeting() : pauseMeeting();
  });
}
// ────────────────────────────────────────────────────────────────────────────

function stopAudioRecording() {
  // Stop segment rotation
  if (segmentRotationTimer) { clearInterval(segmentRotationTimer); segmentRotationTimer = null; }

  return new Promise((resolve) => {
    if (!mediaRecorder || mediaRecorder.state === "inactive") {
      // Return previously saved segments (if any)
      const result = audioSegments.length > 0 ? audioSegments : null;
      resolve(result);
      return;
    }
    const recorder = mediaRecorder;
    recorder.onstop = async () => {
      // Save final segment — MUST persist and transcribe (was lost before!)
      if (audioChunks.length > 0) {
        const blob = new Blob(audioChunks, { type: recorder.mimeType || currentMimeType });
        if (blob.size > 500) {
          const finalIdx = liveSegmentIndex++;
          audioSegments.push(blob);
          // Persist to IDB so gap-filling can find it
          try {
            await MeetingStore.saveSegment(meetingId, finalIdx, blob, currentMimeType);
            console.log(`[meeting-audio] Final segment ${finalIdx} saved to IDB (${(blob.size/1024).toFixed(0)}KB)`);
          } catch (e) { console.warn("[meeting-audio] Final segment IDB save failed:", e?.message); }
          // Live-transcribe the final segment
          try {
            await transcribeLiveSegment(blob, finalIdx);
            console.log(`[meeting-audio] Final segment ${finalIdx} transcribed`);
          } catch (e) { console.warn("[meeting-audio] Final segment transcription failed:", e?.message); }
        }
        audioChunks = [];
      }
      const totalKB = audioSegments.reduce((s, b) => s + b.size, 0) / 1024;
      console.log(`[meeting-audio] Stopped. ${audioSegments.length} segments, total ${totalKB.toFixed(0)}KB`);
      resolve(audioSegments.length > 0 ? audioSegments : null);
    };
    recorder.stop();
  });
}

// Transcribe an array of audio segments sequentially via Whisper
async function transcribeAudioSegments(segments) {
  if (!segments || segments.length === 0) {
    appendSystemMsg("⚠️ Keine Audioaufnahme vorhanden");
    return "";
  }

  // Filter out tiny segments
  const valid = segments.filter(b => b && b.size >= 1000);
  if (valid.length === 0) {
    appendSystemMsg("⚠️ Audioaufnahme zu kurz für Transkription");
    return "";
  }

  const totalKB = valid.reduce((s, b) => s + b.size, 0) / 1024;
  appendSystemMsg(`🔄 Transkribiere ${valid.length} Segment${valid.length > 1 ? "e" : ""} (${totalKB.toFixed(0)}KB) via Whisper...`);

  await refreshAccessToken();
  const authToken = accessToken;

  const langCode = lang === "de" ? "de" : lang === "fr" ? "fr" : "en";
  const results = [];
  let failures = 0;

  for (let i = 0; i < valid.length; i++) {
    const blob = valid[i];
    const ext = blob.type && blob.type.includes("mp4") ? "audio.mp4" : "audio.webm";

    try {
      const formData = new FormData();
      formData.append("file", blob, ext);
      formData.append("language", langCode);

      if (valid.length > 1) {
        appendSystemMsg(`📝 Segment ${i + 1}/${valid.length} (${(blob.size / 1024).toFixed(0)}KB)...`);
      }

      const resp = await fetch("/api/ai/transcribe", {
        method: "POST",
        headers: { "Authorization": `Bearer ${authToken}` },
        body: formData,
      });

      if (!resp.ok) {
        const err = await resp.text();
        console.error(`[meeting-audio] Whisper error segment ${i + 1}:`, resp.status, err);
        appendSystemMsg(`⚠️ Segment ${i + 1}: Whisper-Fehler ${resp.status}`);
        failures++;
        continue;
      }

      const data = await resp.json();
      const text = (data.text || "").trim();
      if (text) {
        results.push(text);
        console.log(`[meeting-audio] Segment ${i + 1} OK: "${text.slice(0, 80)}..."`);
      }
    } catch (e) {
      console.error(`[meeting-audio] Segment ${i + 1} failed:`, e.message);
      failures++;
    }
  }

  const combined = results.join(" ");
  if (combined) {
    appendSystemMsg(`✅ Transkription: ${combined.length} Zeichen${failures > 0 ? ` (${failures} Segment${failures > 1 ? "e" : ""} fehlgeschlagen)` : ""}`);
  } else {
    appendSystemMsg("⚠️ Whisper hat keinen Text erkannt");
  }
  return combined;
}

// ── Periodic Hint Analysis (Delta + Running State) ──────────────────────
async function runHintAnalysis(isFinal = false) {
  if (analysisInProgress) return;
  if (!meetingId) return;
  analysisInProgress = true;

  try {
    await refreshAccessToken();
    const authToken = accessToken;

    const resp = await fetch(`/api/meeting?action=analyze`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${authToken}`,
      },
      body: JSON.stringify({
        meeting_id: meetingId,
        last_segment_index: lastAnalyzedSegmentIndex,
      }),
    });

    if (resp.status === 409 && !isFinal) {
      // Analysis in progress on server — retry after 30s (max 2x)
      console.log("[meeting-analyze] 409 — retrying in 30s");
      analysisInProgress = false;
      setTimeout(() => runHintAnalysis(), 30000);
      return;
    }

    if (!resp.ok) {
      console.error("[meeting-analyze] Error:", resp.status);
      return;
    }

    const data = await resp.json();
    if (data.skipped) {
      console.log("[meeting-analyze] Skipped:", data.reason);
      return;
    }

    // Update checkpoint
    if (data.next_segment_index != null) {
      lastAnalyzedSegmentIndex = data.next_segment_index;
    }

    // Show hints in chat
    if (data.hints?.length > 0) {
      for (const hint of data.hints) {
        const hintText = hint.text || hint.type || "";
        if (hintText) appendMsg("assistant", `💡 ${hintText}`);
      }
    }

    // Show extracted items count
    const items = data.items;
    if (items) {
      const counts = [
        items.decisions?.length && `${items.decisions.length} Decisions`,
        items.actions?.length && `${items.actions.length} Actions`,
        items.risks?.length && `${items.risks.length} Risks`,
      ].filter(Boolean);
      if (counts.length > 0) {
        console.log(`[meeting-analyze] Extracted: ${counts.join(", ")}`);
      }
    }
  } catch (e) {
    console.error("[meeting-analyze] Error:", e.message);
  } finally {
    analysisInProgress = false;
  }
}

// ── Balance Check before meeting start ──────────────────────────────────
async function checkMeetingBalance() {
  try {
    await refreshAccessToken();
    const authToken = accessToken;

    const resp = await fetch("/api/user?action=balance", {
      headers: { Authorization: `Bearer ${authToken}` },
    });
    if (!resp.ok) return;
    const data = await resp.json();
    const remaining = data.remaining_tokens ?? data.totalRemaining ?? 0;

    if (remaining <= 0) {
      appendSystemMsg(lang === "de"
        ? "⚠️ Kein Guthaben — Meeting kann nicht gestartet werden."
        : "⚠️ No balance — meeting cannot start.");
      transitionPhase("post", "balance_check_zero");
      return;
    }

    if (remaining < 5) {
      const estMinutes = Math.floor(remaining * 5); // 1 token ≈ 5 min listening
      appendSystemMsg(lang === "de"
        ? `⚠️ Guthaben gering (${remaining} Tokens) — reicht für ca. ${estMinutes} Minuten.`
        : `⚠️ Low balance (${remaining} tokens) — enough for ~${estMinutes} minutes.`);
    }
  } catch (e) {
    console.warn("[meeting-balance] Check failed:", e.message);
  }
}

// ── Flush pending burst messages to server ───────────────────────────────
async function flushPendingBurstMessages() {
  if (pendingBurstMessages.length === 0) return;

  const msgs = [...pendingBurstMessages];
  pendingBurstMessages = [];

  try {
    await refreshAccessToken();
    const authToken = accessToken;

    const resp = await fetch("/api/meeting?action=burst_message", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${authToken}`,
      },
      body: JSON.stringify({ meeting_id: meetingId, messages: msgs }),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    console.log(`[meeting-burst] Flushed ${msgs.length} messages`);
  } catch (e) {
    console.error("[meeting-burst] Flush failed:", e.message);
    // Retry: put messages back
    pendingBurstMessages = [...msgs, ...pendingBurstMessages];
    // Warn user if this is phase-end flush
    appendSystemMsg(lang === "de"
      ? "⚠️ Sophie-Beiträge evtl. unvollständig im Report"
      : "⚠️ Sophie contributions may be incomplete in report");
  }
}

// Batch-transcribe: returns per-segment results for IDB tracking
async function transcribeMeetingBatchPerSegment(segmentItems) {
  if (!segmentItems || segmentItems.length === 0) return [];
  await refreshAccessToken();
  const authToken = accessToken;
  const langCode = lang === "de" ? "de" : lang === "fr" ? "fr" : "en";
  const results = [];

  for (const item of segmentItems) {
    const blob = item.blob;
    if (!blob || blob.size < 1000) {
      results.push({ segmentIndex: item.segmentIndex, text: null, error: "too small" });
      continue;
    }
    const ext = blob.type?.includes("mp4") ? "audio.mp4" : "audio.webm";
    const segIdx = item.segmentIndex;
    try {
      const formData = new FormData();
      formData.append("file", blob, ext);
      formData.append("language", langCode);
      formData.append("meeting_id", meetingId);
      formData.append("segment_index", String(segIdx));

      const resp = await fetch("/api/ai/transcribe", {
        method: "POST",
        headers: { Authorization: `Bearer ${authToken}` },
        body: formData,
      });
      if (!resp.ok) {
        results.push({ segmentIndex: segIdx, text: null, error: `HTTP ${resp.status}` });
        continue;
      }
      const data = await resp.json();
      results.push({ segmentIndex: segIdx, text: data.text || null, error: null });
    } catch (e) {
      console.error(`[meeting-batch] Segment ${segIdx} failed:`, e.message);
      results.push({ segmentIndex: segIdx, text: null, error: e.message });
    }
  }
  return results;
}

// Legacy wrapper — used by transitionPhase post-flow
async function transcribeMeetingBatch(segments) {
  if (!segments || segments.length === 0) return "";
  const valid = segments.filter(b => b && b.size >= 1000);
  if (valid.length === 0) return "";
  const items = valid.map((blob, i) => ({
    blob, segmentIndex: liveSegmentIndex + i, mimeType: blob.type
  }));
  const results = await transcribeMeetingBatchPerSegment(items);
  // Track in IDB
  for (const r of results) {
    try {
      await MeetingStore.updateSegmentTranscript(
        meetingId, r.segmentIndex,
        r.text ? "batch_ok" : "batch_failed", "batch", r.text || null,
        r.error ? { code: "BATCH_FAIL", message: r.error, attempts: 1, lastAttemptAt: Date.now() } : null
      );
    } catch (_) {}
  }
  return results.filter(r => r.text).map(r => r.text).join(" ");
}

function cleanupMicStream() {

    sharedMicStream = null;

// ---------------------------------------------------------------------------
// Sophie Voice — Uses the SAME Talk-Sophie (WebRTC Realtime API)
// Unmute = Connect Sophie voice session, Mute = Disconnect
// ---------------------------------------------------------------------------

async function fetchRealtimeAnswerSdp(offerSdp, clientSecret) {
  const baseUrl = "https://api.openai.com/v1/realtime";
  const model = "gpt-realtime";
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const res = await fetch(`${baseUrl}?model=${model}`, {
        method: "POST",
        body: offerSdp,
        headers: {
          Authorization: `Bearer ${clientSecret}`,
          "Content-Type": "application/sdp",
        },
      });
      if (!res.ok) throw new Error(`Realtime handshake failed (${res.status})`);
      const sdp = await res.text();
      if (!sdp || sdp.trim().startsWith("<")) throw new Error("Invalid SDP");
      return sdp;
    } catch (e) {
      if (attempt === 3) throw e;
      await new Promise(r => setTimeout(r, 600 * attempt));
    }
  }
}

function startPrepVoice() {
  if (sophieVoicePc) {
    // Already connected — disconnect (toggle)
    disconnectSophieVoice();
    $("prepVoiceBtn").textContent = "🎙 Mit Sophie besprechen";
    return;
  }
  $("prepVoiceBtn").textContent = "⏳ Verbinde...";
  connectSophieVoice("prep");
}

async function connectSophieVoice(phase = "live") {
  if (isConnecting || sophieVoicePc) return;

  // Acquire realtime lock (primary → realtime order)
  if (!sophieTabManager.isPrimary) {
    const took = await sophieTabManager.requestTakeover();
    if (!took) {
      const msg = (localStorage.getItem("preferredLanguage") || "en") === "de"
        ? "Sophie Voice läuft in einem anderen Tab."
        : "Sophie Voice is active in another tab.";
      if (typeof appendSystemMsg === "function") appendSystemMsg(msg);
      return;
    }
  }
  const gotRealtime = await sophieTabManager.acquireRealtime();
  if (!gotRealtime) {
    const msg = (localStorage.getItem("preferredLanguage") || "en") === "de"
      ? "Konnte Voice-Session nicht starten — anderer Tab aktiv."
      : "Could not start voice session — another tab is active.";
    if (typeof appendSystemMsg === "function") appendSystemMsg(msg);
    return;
  }

  isConnecting = true;
  isSpeaking = true;
  updateParticipantsBar();

  const connectMsg = lang === "de" ? "Sophie wird verbunden..." : lang === "fr" ? "Connexion de Sophie..." : "Connecting Sophie...";
  appendSystemMsg(connectMsg);

  try {
    // 1. Get fresh auth token
    await refreshAccessToken();
    const authToken = accessToken;
    if (!authToken) throw new Error("Not authenticated — please reload and login");

    // 2. Get session token from /api/session (same as Talk)
    console.log("[meeting-voice] Calling /api/session...");
    const sessionHeaders = {
      Authorization: `Bearer ${authToken}`,
      "X-Sophie-Session-Mode": "meeting",
      "X-Sophie-Meeting-Id": meetingId || "",
      "X-Sophie-Meeting-Phase": phase,
    };
    // Burst mode: tell server to load transcript context from DB
    if (isMeetingBurstActive) {
      sessionHeaders["X-Sophie-Meeting-Burst"] = "true";
    }

    const tokenRes = await fetch("/api/session", { headers: sessionHeaders });
    const data = await tokenRes.json();
    console.log("[meeting-voice] Session response:", tokenRes.status, data?.error || "OK");

    if (tokenRes.status === 429) {
      // Session lock — wait and retry once
      appendSystemMsg(lang === "de" ? "Sophie ist noch beschäftigt, versuche erneut..." : "Sophie is busy, retrying...");
      await new Promise(r => setTimeout(r, 3000));
      const retry = await fetch("/api/session", { headers: sessionHeaders });
      const retryData = await retry.json();
      if (!retry.ok) throw new Error(retryData?.error || retryData?.message || `HTTP ${retry.status}`);
      Object.assign(data, retryData);
    } else if (!tokenRes.ok) {
      throw new Error(data?.error || data?.message || `HTTP ${tokenRes.status}`);
    }

    window._ecoMode = !!data?.eco_mode;

    // 2. Set up WebRTC (same as Talk)
    sophieVoicePc = new RTCPeerConnection();

    // DataChannel for transcript (MUST be created before offer)
    sophieVoiceDc = sophieVoicePc.createDataChannel("oai-events");
    sophieVoiceDc.onerror = (e) => {
      console.error("[meeting-voice] DataChannel error:", e);
      appendSystemMsg("⚠️ Voice DataChannel Error");
    };
    sophieVoiceDc.onclose = () => {
      console.log("[meeting-voice] DataChannel closed");
    };
    sophieVoiceDc.onopen = () => {
      console.log("[meeting-voice] DataChannel open — enabling auto-response + transcript");
      appendSystemMsg("✅ Voice Transcript aktiv");
      // Enable auto-response after user speech + keep transcription
      sophieVoiceDc.send(JSON.stringify({
        type: "session.update",
        session: {
          turn_detection: {
            type: "server_vad",
            threshold: 0.6,
            prefix_padding_ms: 300,
            silence_duration_ms: 800,
            create_response: true,
            interrupt_response: true,
          },
        },
      }));
    };
    sophieVoiceDc.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        handleVoiceTranscriptEvent(msg);
      } catch (_) {}
    };

    // Reuse the shared mic stream (created at meeting start — single permission dialog)
    // Only re-request if stream died (e.g. hardware disconnect)
    if (!sharedMicStream || sharedMicStream.getTracks().some(t => t.readyState === "ended")) {
      console.log("[meeting-voice] sharedMicStream unavailable, requesting new one...");
      sharedMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }
    const sophieStream = sharedMicStream.clone();
    sophieVoiceStream = sophieStream;
    sophieStream.getTracks().forEach(track => sophieVoicePc.addTrack(track, sophieStream));

    // Sophie's audio output
    sophieVoiceAudio = document.createElement("audio");
    sophieVoiceAudio.autoplay = true;
    sophieVoiceAudio.playsInline = true;
    sophieVoicePc.ontrack = e => {
      sophieVoiceAudio.srcObject = e.streams[0];
      isSpeaking = true;
      updateParticipantsBar();
    };

    // Create offer
    const offer = await sophieVoicePc.createOffer();
    await sophieVoicePc.setLocalDescription(offer);

    // 3. Handshake with OpenAI Realtime (same as Talk)
    if (!data?.client_secret?.value) throw new Error("No client_secret received from session API");
    const answerSdp = await fetchRealtimeAnswerSdp(offer.sdp, data.client_secret.value);
    await sophieVoicePc.setRemoteDescription({ type: "answer", sdp: answerSdp });

    // Connection state monitoring — pass burst context to avoid old billing path
    const wasBurstAtConnect = isMeetingBurstActive;
    sophieVoicePc.onconnectionstatechange = () => {
      const state = sophieVoicePc?.connectionState;
      if (state === "disconnected" || state === "failed" || state === "closed") {
        disconnectSophieVoice(true, { wasBurst: wasBurstAtConnect });
      }
    };

    isConnecting = false;
    isSpeaking = true;
    updateParticipantsBar();

    sophieVoiceStartTime = Date.now();
    const joinedMsg = lang === "de" ? "Sophie ist jetzt im Meeting." : lang === "fr" ? "Sophie est dans le meeting." : "Sophie joined the meeting.";
    appendSystemMsg(joinedMsg);

  } catch (e) {
    console.error("Sophie voice connect error:", e);
    isConnecting = false;
    isSpeaking = false;
    updateParticipantsBar();
    disconnectSophieVoice(true);
    const errMsg = lang === "de" ? "Sophie konnte nicht verbunden werden." : "Could not connect Sophie.";
    appendSystemMsg(errMsg + " " + e.message);
  }
}

// Handle voice transcript events from DataChannel (same logic as Talk)
function handleVoiceTranscriptEvent(msg) {
  // ── FIRST: Burst timer management (before ANY early returns) ──────────
  // Clear auto-disconnect timer on ANY activity (Sophie or User)
  if (isMeetingBurstActive && window._burstSilenceTimer) {
    const t = msg?.type || "";
    // Sophie active: any response.* except response.done (which STARTS the timer)
    // User active: any conversation.* event
    if ((t.startsWith("response.") && t !== "response.done") || t.startsWith("conversation.")) {
      clearTimeout(window._burstSilenceTimer);
      window._burstSilenceTimer = null;
    }
  }

  // User speech transcript (incremental)
  if (msg?.type === "conversation.item.input_audio_transcription.delta") {
    const itemId = msg?.item_id;
    const delta = String(msg?.delta || "");
    if (itemId && delta) {
      const prev = userTranscriptBuffer.get(itemId) || "";
      userTranscriptBuffer.set(itemId, prev + delta);
    }
    return;
  }

  // User speech transcript (final)
  if (msg?.type === "conversation.item.input_audio_transcription.completed") {
    const itemId = msg?.item_id;
    const t1 = String(msg?.transcript || "").trim();
    const tBuf = itemId ? String(userTranscriptBuffer.get(itemId) || "").trim() : "";
    const text = (t1 || tBuf).trim();
    if (itemId) userTranscriptBuffer.delete(itemId);
    if (text) {
      voiceTranscript.push({ role: "user", text });
      console.log("[meeting-voice] User:", text.slice(0, 80));
    }
    return;
  }

  // Sophie speech transcript (final)
  if (msg?.type === "response.audio_transcript.done") {
    const full = String(msg?.transcript || msg?.text || "").trim();
    if (full) partialAssistant = full;
    return;
  }

  // Response complete — save Sophie's text + start auto-disconnect timer
  if (msg?.type === "response.done") {
    let final = String(partialAssistant || "").replace(/\s+/g, " ").trim();
    final = final.replace(/\s*\{["']?(?:decisions|actions|risks|open_points)["']?\s*:[\s\S]*$/i, "").trim();
    const last = String(lastAssistantFinal || "").replace(/\s+/g, " ").trim();
    if (final && final !== last) {
      voiceTranscript.push({ role: "assistant", text: final });
      lastAssistantFinal = final;
      console.log("[meeting-voice] Sophie:", final.slice(0, 80));

      if (isMeetingBurstActive) {
        pendingBurstMessages.push({ role: "sophie", text: final });
      }
    }
    partialAssistant = "";

    // Start 45s silence timer ONLY after Sophie finished speaking
    if (isMeetingBurstActive) {
      clearTimeout(window._burstSilenceTimer);
      window._burstSilenceTimer = setTimeout(() => {
        if (isMeetingBurstActive && !sophieMuted) {
          console.log("[meeting-burst] Auto-disconnect after 45s post-response silence");
          toggleSophieMute();
        }
      }, 45000);
    }
    return;
  }
}

function disconnectSophieVoice(silent = false, { wasBurst = false } = {}) {
  // Capture burst state at call time — caller passes it explicitly
  // This avoids race conditions with flag resets
  const isBurst = wasBurst || isMeetingBurstActive;

  // Report usage for Sophie voice session
  if (sophieVoiceStartTime) {
    const secondsUsed = Math.ceil((Date.now() - sophieVoiceStartTime) / 1000);
    sophieVoiceStartTime = null;
    if (secondsUsed > 0) {
      if (isBurst) {
        // BURST MODE: track cost server-side via burst_cost_usd
        // Legacy reportMeetingVoiceUsage() is HARD DISABLED in burst context
        console.log(`[meeting-burst] Burst ended: ${secondsUsed}s → reportBurstCost (new path)`);
        reportBurstCost(secondsUsed);
      } else {
        // NON-BURST (Talk-Sophie unmute/legacy): old token deduction path
        console.log(`[meeting-voice] Legacy session ended: ${secondsUsed}s → reportMeetingVoiceUsage (old path)`);
        reportMeetingVoiceUsage(secondsUsed);
      }
    }
  }

  // Kill Sophie's cloned stream only — keep sharedMicStream alive for SpeechRecognition reuse
  if (sophieVoiceStream) {
    try { sophieVoiceStream.getTracks().forEach(t => t.stop()); } catch {}
  }
  sophieVoiceStream = null;
  // Stop audio
  if (sophieVoiceAudio) {
    try { sophieVoiceAudio.srcObject = null; } catch {}
    sophieVoiceAudio = null;
  }
  // Close DataChannel + WebRTC
  if (sophieVoiceDc) {
    try { sophieVoiceDc.close(); } catch {}
    sophieVoiceDc = null;
  }
  if (sophieVoicePc) {
    sophieVoicePc.close();
    sophieVoicePc = null;
  }
  isSpeaking = false;
  isConnecting = false;
  updateParticipantsBar();

  if (!silent) {
    const leftMsg = lang === "de" ? "Sophie hat das Meeting verlassen." : lang === "fr" ? "Sophie a quitté le meeting." : "Sophie left the meeting.";
    appendSystemMsg(leftMsg);
  }
}

// Report burst cost server-side (increments meetings.burst_cost_usd)
async function reportBurstCost(seconds) {
  try {
    const { data: { session: authSession } } = await supabase.auth.getSession();
    if (!authSession?.access_token || !meetingId) return;

    // Realtime API cost: ~$0.17/min normal, ~$0.07/min eco
    const costPerMin = window._ecoMode ? 0.07 : 0.17;
    const costUsd = (seconds / 60) * costPerMin;

    const resp = await fetch("/api/meeting?action=burst_cost", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${authSession.access_token}`,
      },
      body: JSON.stringify({ meeting_id: meetingId, cost_usd: costUsd, seconds }),
      keepalive: true,
    });
    console.log(`[meeting-burst] Cost reported: ${seconds}s = $${costUsd.toFixed(4)}`, resp.status);
  } catch (e) {
    console.error("[meeting-burst] Cost report failed:", e.message);
  }
}

async function reportMeetingVoiceUsage(seconds) {
  try {
    const { data: { session: authSession } } = await supabase.auth.getSession();
    if (!authSession?.access_token) return;

    const secPerToken = window._ecoMode ? 7.5 : 3; // Eco: 8 tokens/min, Normal: 20 tokens/min
    const tokens = Math.ceil(seconds / secPerToken);
    const res = await fetch("/api/user?action=usage", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${authSession.access_token}`,
      },
      body: JSON.stringify({ tokens_used: tokens }),
      keepalive: true,
    });
    const data = await res.json().catch(() => null);
    console.log(`[meeting-voice] Usage reported: ${seconds}s (${tokens} tokens)`, res.status, data);

    if (data?.suggest_eco && !sessionStorage.getItem("eco_suggested")) {
      sessionStorage.setItem("eco_suggested", "1");
      showEcoBanner();
    }
  } catch (e) {
    console.error("[meeting-voice] Usage report failed:", e.message);
  }
}

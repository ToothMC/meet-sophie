<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<script>if("serviceWorker"in navigator){navigator.serviceWorker.register("/sw.js");navigator.serviceWorker.addEventListener("message",e=>{if(e.data?.type==="SW_UPDATED")location.reload()})}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sophie — Meeting Mode</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:#2a2420;background:#ffffff;
  display:flex;flex-direction:column;
  min-height:100vh;min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---- TOPBAR / BANNER ---- */
.topbar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;
  padding-top:max(12px, env(safe-area-inset-top));
  background:rgba(250,249,246,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid #ede8e2;
}
.topbar .back{
  color:#7a6a5a;text-decoration:none;font-size:14px;
  padding:6px 10px;border-radius:8px;
  background:rgba(0,0,0,.04);border:1px solid #ede8e2;
  white-space:nowrap;
}
.topbar .back:hover{background:rgba(0,0,0,.08);color:#2a2420}
.topbar .title{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2a2420}
/* Phase badge, participants bar, recording status — hidden (clean UI) */
.phase-badge{display:none!important}
.participants-bar{display:none!important}
#recordingStatus{display:none!important}
@keyframes sophiePulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ---- SETUP SCREEN ---- */
.setup-screen{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.setup-card{
  width:100%;max-width:420px;
  background:#fff;border:1px solid #ede8e2;
  border-radius:16px;padding:28px 24px;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
}
.setup-card h2{font-size:20px;font-weight:600;margin:0 0 20px;text-align:center;color:#2a2420}
.setup-card label{
  display:block;font-size:12px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:#a09080;margin-bottom:6px;margin-top:16px;
}
.setup-card label:first-of-type{margin-top:0}
.setup-card input[type="text"]{
  width:100%;padding:12px 14px;font-size:16px;
  background:#fff;border:1px solid #ede8e2;
  border-radius:10px;color:#2a2420;outline:none;
  font-family:inherit;min-height:48px;
}
.setup-card input[type="text"]:focus{border-color:#c4a882}
.type-pill{
  padding:10px 18px;font-size:14px;font-weight:600;
  border:1px solid #ede8e2;border-radius:10px;
  background:#fff;color:#7a6a5a;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
.type-pill:hover{border-color:#c4a882;color:#2a2420}
.type-pill.active{background:#2a2420;color:#fff;border-color:#2a2420}
#parentMeetingSelect{
  width:100%;padding:12px 14px;font-size:14px;
  border:1px solid #ede8e2;border-radius:10px;
  background:#fff;color:#2a2420;cursor:pointer;
  font-family:inherit;appearance:auto;
  -webkit-appearance:menulist;
}
.setup-card .btn-primary{
  display:block;width:100%;margin-top:24px;padding:14px;font-size:16px;font-weight:700;
  border:none;border-radius:12px;cursor:pointer;
  background:#2a2420;color:#fff;
  font-family:inherit;
}
.setup-card .btn-primary:disabled{opacity:.5;cursor:not-allowed}

/* ---- MAIN MEETING AREA ---- */
.meeting-area{
  flex:1;display:none;flex-direction:column;
  max-width:680px;width:100%;margin:0 auto;
  min-height:0; /* Allow flex child to shrink — critical for overflow:auto in chat */
  overflow-y:auto; /* Scroll for report card in post phase */
}
.meeting-area.active{display:flex}

/* ---- CONTEXT PANEL ---- */
.context-panel{
  border-bottom:1px solid #ede8e2;
  overflow:hidden;transition:max-height .3s ease;
}
.context-panel.collapsed .context-body{display:none}
.context-toggle{
  display:none; /* Hide toggle label on mobile — fields speak for themselves */
}
.context-body{padding:8px 16px 8px}
.context-body textarea{
  width:100%;padding:8px 10px;font-size:14px;line-height:1.4;
  background:#fff;border:1px solid #ede8e2;
  border-radius:8px;color:#2a2420;resize:none;min-height:44px;
  font-family:inherit;outline:none;margin-bottom:6px;
}
.context-body textarea:focus{border-color:#c4a882}
.context-body textarea::placeholder{color:#b0a090}
.save-context-btn{
  font-size:12px;padding:5px 12px;border-radius:6px;
  background:rgba(0,0,0,.04);border:1px solid #ede8e2;
  color:#7a6a5a;cursor:pointer;font-family:inherit;
}
.save-context-btn:hover{background:rgba(0,0,0,.08);color:#2a2420}

/* ---- CHAT ---- */
.chat-area{
  flex:1;overflow-y:auto;padding:16px;
  display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.msg{
  max-width:85%;padding:10px 14px;border-radius:14px;
  font-size:14px;line-height:1.55;word-wrap:break-word;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.user{
  align-self:flex-end;
  background:#2a2420;color:#fff;
  border-bottom-right-radius:4px;
}
.msg.assistant{
  align-self:flex-start;
  background:#fff;color:#2a2420;
  border:1px solid #ede8e2;
  border-bottom-left-radius:4px;
}
.msg.system{
  align-self:center;text-align:center;
  font-size:12px;color:#a09080;
  background:none;padding:4px;
}
.msg.assistant .typing-dots{display:inline-block}
.msg.assistant .typing-dots::after{content:'...';animation:dots 1.2s infinite}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}100%{content:'.'}}

/* ---- INPUT BAR ---- */
.input-bar{
  display:flex;align-items:flex-end;gap:8px;
  padding:12px 16px;
  padding-bottom:max(12px, env(safe-area-inset-bottom));
  border-top:1px solid #ede8e2;
  background:rgba(250,249,246,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.input-bar textarea{
  flex:1;padding:10px 14px;font-size:14px;line-height:1.5;
  background:#fff;border:1px solid #ede8e2;
  border-radius:12px;color:#2a2420;resize:none;
  min-height:42px;max-height:120px;
  font-family:inherit;outline:none;
}
.input-bar textarea:focus{border-color:#c4a882}
.input-bar textarea::placeholder{color:#b0a090}
.send-btn{
  padding:10px 16px;font-size:14px;font-weight:600;
  background:#34c47a;color:#000;border:none;border-radius:12px;
  cursor:pointer;white-space:nowrap;font-family:inherit;
}
.send-btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- PHASE CTA ---- */
.phase-cta{
  padding:10px 16px;text-align:center;
  border-top:1px solid #ede8e2;
  position:sticky;bottom:0;z-index:5;
  background:rgba(250,249,246,.95);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.phase-cta button{
  width:100%;padding:16px 24px;font-size:17px;font-weight:700;
  border:none;border-radius:14px;cursor:pointer;
  font-family:inherit;
}
.phase-cta .cta-live{background:#34c47a;color:#fff}
.phase-cta .cta-post{background:#ef4444;color:#fff}
.phase-cta .cta-close{background:rgba(0,0,0,.06);color:#2a2420;border:1px solid #ede8e2}

/* ---- REPORT CARD ---- */
.report-card{
  margin:16px;padding:20px;
  background:#fff;border:1px solid #ede8e2;
  border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.04);
}

/* ---- FILE UPLOAD ---- */
.upload-area{
  margin-top:8px;padding:12px;
  border:2px dashed #ede8e2;border-radius:10px;
  text-align:center;cursor:pointer;transition:border-color .2s;
}
.upload-area:hover{border-color:#c4a882}
.upload-area input[type="file"]{display:none}
.upload-area .upload-label{
  font-size:12px;color:#a09080;
}
.upload-area .upload-label:hover{color:#2a2420}
.file-list{margin-top:8px}
.file-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;margin-bottom:4px;
  background:#fff;border:1px solid #ede8e2;
  border-radius:8px;font-size:12px;color:#5a4a40;
}
.file-item .file-icon{font-size:14px;flex-shrink:0}
.file-item .file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .file-status{font-size:10px;color:#34c47a}
.uploading{opacity:.5}

/* ---- DOCUMENT REPORT CARDS ---- */
.doc-card{
  background:#fff;border:1px solid #e5e0d8;border-radius:10px;
  padding:10px 12px;margin-bottom:6px;font-size:12px;color:#5a4a40;
}
.doc-card-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.doc-card-icon{font-size:15px;flex-shrink:0}
.doc-card-name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-card-status{font-size:10px;color:#34c47a;flex-shrink:0}
.doc-card-preview{
  color:#a09080;font-size:11px;line-height:1.4;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  margin-bottom:6px;
}
.doc-card-actions{display:flex;gap:6px;flex-wrap:wrap}
.doc-card-btn{
  font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid #ddd;
  background:#faf8f5;color:#5a4a40;cursor:pointer;
}
.doc-card-btn:hover{background:#ede8e2}
.doc-card-btn.primary{background:#c4a882;color:#fff;border-color:#c4a882}
.doc-card-btn.primary:hover{background:#b8956e}

/* ---- DOC PREVIEW MODAL ---- */
.doc-modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;
  display:flex;align-items:flex-end;justify-content:center;
}
.doc-modal{
  background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:600px;
  max-height:80vh;display:flex;flex-direction:column;padding:0;overflow:hidden;
}
.doc-modal-header{
  display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid #ede8e2;
}
.doc-modal-title{flex:1;font-weight:600;font-size:14px;color:#2a2420;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-modal-close{font-size:20px;cursor:pointer;color:#a09080;padding:0 4px;background:none;border:none}
.doc-modal-body{flex:1;overflow-y:auto;padding:16px;font-size:13px;color:#3a3030;line-height:1.6;white-space:pre-wrap;word-break:break-word}

/* ---- HINT MESSAGES ---- */
.msg.assistant.hint{
  border-left:3px solid #eab308;
  background:#fffbeb;
  font-size:13px;
  color:#5a4a40;
}

/* ---- FOLLOWUP DIFF ---- */
.diff-section{margin-top:16px;border-top:1px solid #ede8e2;padding-top:14px}
.diff-section h4{
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#a09080;margin:0 0 8px;
}
.diff-item{
  font-size:13px;line-height:1.5;padding:4px 0;
  color:#3a3028;
  border-bottom:1px solid #f0ece6;
  display:flex;align-items:center;gap:8px;
}
.diff-item:last-child{border-bottom:none}
.diff-icon{font-size:14px;flex-shrink:0}
.diff-icon.done{color:#34d399}
.diff-icon.open{color:#f5c842}
.diff-icon.escalated{color:#ff5a5a}
.diff-icon.new{color:#6cb4ff}

/* ---- MUTE TOGGLE + PAUSE ---- */
.mute-toggle{
  padding:10px 16px;font-size:15px;font-weight:600;border-radius:10px;cursor:pointer;
  border:1px solid #ede8e2;background:rgba(0,0,0,.03);
  color:#a09080;transition:all .2s;white-space:nowrap;
  font-family:inherit;display:none;
}
.mute-toggle:hover{background:rgba(0,0,0,.06);color:#2a2420}
.mute-toggle.active{
  background:rgba(52,196,122,.1);border-color:rgba(52,196,122,.3);
  color:#22c55e;
}
.mute-toggle.active .mute-icon::after{content:"🔊"}
.mute-toggle .mute-icon::after{content:"🔇"}
#meetingPauseBtn{display:none;padding:10px 16px;font-size:15px;font-weight:600;border-radius:10px;border-color:#e0c070;color:#b89040}
#meetingPauseBtn:hover{background:rgba(180,140,60,.1);color:#8a6e2a}
#meetingPauseBtn.is-paused{border-color:rgba(52,196,122,.3);color:#22c55e}

/* ---- PARTICIPANTS BAR ---- */
.participants-bar{
  display:none;align-items:center;gap:6px;
  padding:6px 16px;font-size:12px;color:#a09080;
  border-bottom:1px solid #ede8e2;
  overflow-x:auto;white-space:nowrap;
}
.participants-bar.visible{display:flex}
.participant-chip{
  padding:3px 8px;border-radius:10px;font-size:11px;
  background:#fff;border:1px solid #ede8e2;
  color:#5a4a40;flex-shrink:0;
}
.participant-chip.sophie{
  background:rgba(52,196,122,.12);border-color:rgba(52,196,122,.2);
  color:#34c47a;transition:all .3s;
}
.participant-chip.sophie.speaking{
  background:rgba(52,196,122,.25);border-color:rgba(52,196,122,.5);
  animation:pulse-speak 1.2s infinite;
}
@keyframes pulse-speak{0%,100%{box-shadow:0 0 0 0 rgba(52,196,122,.3)}50%{box-shadow:0 0 0 6px rgba(52,196,122,0)}}

/* ---- EXPORT BUTTON ---- */
.export-bar{
  display:flex;gap:8px;margin-top:12px;
}
/* Export section labels */
.report-export-title{
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:#b0a090;font-weight:600;text-align:center;margin:12px 0 6px;
}
.export-row{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
}
.export-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:20px;
  background:none;border:1px solid #ddd6cc;color:#6a5a50;
  font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:all .18s ease;
}
.export-btn:hover{background:#f0ece6;border-color:#c4a882;color:#2c2420}
.export-btn.primary{background:#2c2420;color:#faf9f6;border-color:#2c2420}
.export-btn.primary:hover{background:#3d3028;border-color:#3d3028;color:#faf9f6}

/* ---- LOADING ---- */
.loading-screen{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#a09080;
}
/* ---- MOBILE OPTIMIZATIONS ---- */
@media (max-width: 600px) {
  .topbar { padding:8px 12px; padding-top:max(8px, env(safe-area-inset-top)); }
  /* In prep phase: hide topbar, unstick CTA + input so they don't cover fields */
  .meeting-area[data-phase="prep"] .topbar { display:none; }
  .meeting-area[data-phase="prep"] .phase-cta { position:static; }
  .meeting-area[data-phase="prep"] .input-bar { position:static; }
  .context-body { padding:12px 12px 8px; }
  .phase-cta { padding:8px 12px; padding-bottom:max(8px, env(safe-area-inset-bottom)); }
  .input-bar { padding:8px 12px; padding-bottom:max(8px, env(safe-area-inset-bottom)); }
  /* Upload area compact on mobile */
  .upload-area { padding:8px; margin-top:4px; }
  /* Report card full-bleed on mobile */
  .report-card { margin:4px 0; padding:8px; border-radius:10px; }
  #reportPreview { border:none !important; border-radius:0 !important; overflow-x:hidden !important; }
  #reportDirect { padding:4px !important; overflow-x:hidden !important; }
  #reportFrame { min-height:300px; }
}

.hidden{display:none!important}

/* ---- LIVE TIMER ---- */
.live-timer{
  font-size:28px;color:#ef4444;font-weight:700;
  letter-spacing:.06em;text-align:center;padding:10px 0;
  font-variant-numeric:tabular-nums;
}
</style>
</head>
<body>

<!-- Auth Loading -->
<div id="authLoading" class="loading-screen">
  <p>Loading...</p>
</div>

<!-- Setup Screen (create new meeting) -->
<div id="setupScreen" class="setup-screen hidden">
  <div class="setup-card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <a href="/" style="color:#7a6a5a;text-decoration:none;font-size:20px;line-height:1">&larr;</a>
      <h2 id="setupTitle" style="margin:0;flex:1">New Meeting</h2>
    </div>

    <label id="lblType">Meeting Type</label>
    <div id="meetingTypePills" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px">
      <button type="button" class="type-pill active" data-value="team">Team</button>
      <button type="button" class="type-pill" data-value="client">Client</button>
      <button type="button" class="type-pill" data-value="strategy">Strategy</button>
      <button type="button" class="type-pill" data-value="other">Other</button>
    </div>

    <label id="lblTitle">Title (optional)</label>
    <input type="text" id="meetingTitle" placeholder="e.g. Q2 Planning" />

    <label id="lblParent">Previous Meeting (optional)</label>
    <select id="parentMeetingSelect">
      <option value="">—</option>
    </select>

    <button class="btn-primary" id="createBtn">Start Preparation</button>
  </div>
</div>

<!-- Meeting Area -->
<div id="meetingArea" class="meeting-area">
  <!-- Topbar -->
  <div class="topbar">
    <a href="/app" class="back" id="backBtn">&larr;</a>
    <span class="title" id="meetingTitleDisplay">Meeting</span>
    <button class="mute-toggle" id="muteToggle"><span class="mute-icon"></span> Sophie</button>
    <button class="mute-toggle" id="meetingPauseBtn" style="display:none">⏸ Pause</button>
    <span class="phase-badge" id="phaseBadge" data-phase="prep">PREP</span>
  </div>

  <!-- Participants Bar -->
  <div class="participants-bar" id="participantsBar"></div>

  <!-- Context Panel (PREP phase) -->
  <div class="context-panel" id="contextPanel">
    <div class="context-toggle" id="contextToggle">
      <span class="arrow">&#x25BE;</span> <span id="ctxLabel">Context</span>
    </div>
    <div class="context-body">
      <textarea id="ctxAgenda" placeholder="Agenda..." rows="2"></textarea>
      <textarea id="ctxParticipants" placeholder="Participants..." rows="2"></textarea>
      <textarea id="ctxGoal" placeholder="Goal of this meeting..." rows="2"></textarea>
      <button class="save-context-btn" id="saveContextBtn">Save Context</button>
      <button class="save-context-btn" id="prepVoiceBtn" style="background:#c4a882;color:#fff;border-color:#c4a882;margin-top:6px;width:100%" onclick="startPrepVoice()">🎙 Mit Sophie besprechen</button>

      <!-- File Upload -->
      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept=".pdf,.docx,.pptx,.txt,.png,.jpg,.jpeg,.webp" multiple />
        <span class="upload-label" id="uploadLabel">📎 Drop files or click to upload</span>
        <div style="font-size:10px;color:#a09080;margin-top:4px" id="uploadHint">TXT, DOCX, PDF, Images</div>
      </div>
      <div class="file-list" id="fileList"></div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea"></div>

  <!-- Live Timer -->
  <div class="live-timer hidden" id="liveTimer"></div>

  <!-- Input Bar -->
  <!-- Sophie status indicator -->
  <div id="sophieStatus" style="display:none;text-align:center;padding:8px 12px;font-size:20px;font-weight:600;color:#22c55e;animation:sophiePulse 2s ease-in-out infinite"></div>

  <div class="input-bar" id="inputBar">
    <textarea id="chatInput" placeholder="Type here..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" disabled>Send</button>
  </div>

  <!-- Recording Status (visible during live phase) -->
  <div id="recordingStatus" class="hidden" style="display:none;padding:6px 12px;font-size:11px;font-family:monospace;background:#f0f0f0;border-radius:8px;margin:8px 0;color:#666;line-height:1.6">
    🔴 REC: <span id="recStatusText">—</span>
  </div>

  <!-- Phase CTA — sticky bottom, always visible -->
  <div class="phase-cta" id="phaseCta">
    <button class="cta-live" id="ctaLive">Start Meeting &rarr;</button>
    <button class="cta-post hidden" id="ctaPost">End Meeting &rarr;</button>
    <button class="cta-close hidden" id="ctaClose">Close</button>
  </div>

  <!-- Report Card (POST phase) — single source, no separate summary -->
  <div class="report-card hidden" id="summaryCard">
    <div id="reportProgress" style="margin-bottom:16px">
      <div style="font-size:15px;font-weight:600;color:#2a2420;margin-bottom:10px" id="reportTitle">Erstelle Sitzungsprotokoll...</div>
      <div style="height:6px;background:#e5e7eb;border-radius:6px;overflow:hidden">

// ── MeetingStore: IndexedDB persistence for audio safety net ─────
const MeetingStore = {
  _db: null,
  _available: false,

  async open() {
    try {
      this._db = await new Promise((resolve, reject) => {
        const req = indexedDB.open("sophie-meeting-store", 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("audio_segments")) {
            db.createObjectStore("audio_segments", { keyPath: ["meetingId", "segmentIndex"] });
          }
          if (!db.objectStoreNames.contains("meeting_state")) {
            db.createObjectStore("meeting_state", { keyPath: "meetingId" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      this._available = true;
    } catch (e) {
      console.error("[MeetingStore] Failed to open IndexedDB:", e);
      this._available = false;
    }
  },

  isAvailable() { return this._available && this._db; },

  async _tx(store, mode, fn) {
    return new Promise((resolve, reject) => {
      const tx = this._db.transaction(store, mode);
      const os = tx.objectStore(store);
      const result = fn(os);
      tx.oncomplete = () => resolve(result._result);
      tx.onerror = () => reject(tx.error);
      // Capture result from IDB request
      if (result instanceof IDBRequest) {
        result.onsuccess = () => { result._result = result.result; };
      }
    });
  },

  // ── Segments ──
  async saveSegment(meetingId, segIdx, blob, mimeType) {
    if (!this.isAvailable()) return;
    const now = Date.now();
    await this._tx("audio_segments", "readwrite", (os) =>
      os.put({
        meetingId, segmentIndex: segIdx, blob, mimeType,
        transcriptStatus: "pending", transcriptText: null,
        transcriptSource: null, errorInfo: null,
        createdAt: now, updatedAt: now
      })
    );
  },

  async updateSegmentTranscript(meetingId, segIdx, status, source, text, errorInfo) {
    if (!this.isAvailable()) return;
    const existing = await this._tx("audio_segments", "readonly", (os) =>
      os.get([meetingId, segIdx])
    );
    if (!existing) throw new Error(`Segment [${meetingId}, ${segIdx}] not found in IDB`);
    await this._tx("audio_segments", "readwrite", (os) =>
      os.put({
        ...existing,
        transcriptStatus: status,
        transcriptSource: source,
        transcriptText: text,
        errorInfo: errorInfo || null,
        updatedAt: Date.now()
      })
    );
  },

  async getAllSegments(meetingId) {
    if (!this.isAvailable()) return [];
    return new Promise((resolve, reject) => {
      const tx = this._db.transaction("audio_segments", "readonly");
      const os = tx.objectStore("audio_segments");
      const results = [];
      const req = os.openCursor();
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          if (cursor.value.meetingId === meetingId) results.push(cursor.value);
          cursor.continue();
        } else {
          resolve(results.sort((a, b) => a.segmentIndex - b.segmentIndex));
        }
      };
      req.onerror = () => reject(req.error);
    });
  },

  async getUntranscribed(meetingId) {
    const all = await this.getAllSegments(meetingId);
    return all.filter(s => s.transcriptStatus !== "live_ok" && s.transcriptStatus !== "batch_ok");
  },

  async getPersistedCount(meetingId) {
    return (await this.getAllSegments(meetingId)).length;
  },

  // ── State ──
  async saveState(meetingId, partial) {
    if (!this.isAvailable()) return;
    const existing = await this._tx("meeting_state", "readonly", (os) => os.get(meetingId));
    const now = Date.now();
    await this._tx("meeting_state", "readwrite", (os) =>
      os.put({
        meetingId,
        meetingTitle: null, meetingStatus: "recording",
        reportStatus: "idle", reportSessionId: null,
        lastErrorCode: null, lastErrorMessage: null,
        totalSegmentCount: 0, localPersistenceAvailable: true,
        schemaVersion: 1, createdAt: now, updatedAt: now,
        ...(existing || {}),
        ...partial,
        meetingId, // force key
        updatedAt: now
      })
    );
  },

  async getState(meetingId) {
    if (!this.isAvailable()) return null;
    return this._tx("meeting_state", "readonly", (os) => os.get(meetingId));
  },

  async getIncompleteMeetings() {
    if (!this.isAvailable()) return [];
    return new Promise((resolve, reject) => {
      const tx = this._db.transaction("meeting_state", "readonly");
      const os = tx.objectStore("meeting_state");
      const results = [];
      const req = os.openCursor();
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          if (cursor.value.meetingStatus !== "report_completed") results.push(cursor.value);
          cursor.continue();
        } else {
          resolve(results.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)));
        }
      };
      req.onerror = () => reject(req.error);
    });
  },

  // ── Cleanup ──
  async cleanup(meetingId) {
    if (!this.isAvailable()) return;
    // Delete all segments
    const segs = await this.getAllSegments(meetingId);
    await Promise.all(segs.map(s =>
      this._tx("audio_segments", "readwrite", (os) => os.delete([meetingId, s.segmentIndex]))
    ));
    // Delete state
    await this._tx("meeting_state", "readwrite", (os) => os.delete(meetingId));
  },

  async cleanupCompleted(maxAgeDays = 1) {
    if (!this.isAvailable()) return;
    const cutoff = Date.now() - maxAgeDays * 86400000;
    const incomplete = await this.getIncompleteMeetings();
    // Get ALL states, filter completed + old
    return new Promise((resolve, reject) => {
      const tx = this._db.transaction("meeting_state", "readonly");
      const os = tx.objectStore("meeting_state");
      const toClean = [];
      const req = os.openCursor();
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const v = cursor.value;
          if (v.meetingStatus === "report_completed" && (v.updatedAt || v.createdAt || 0) < cutoff) {
            toClean.push(v.meetingId);
          }
          cursor.continue();
        } else {
          Promise.all(toClean.map(id => this.cleanup(id))).then(resolve).catch(reject);
        }
      };
      req.onerror = () => reject(req.error);
    });
  },

  async cleanupAll(maxAgeDays = 7) {
    if (!this.isAvailable()) return;
    const cutoff = Date.now() - maxAgeDays * 86400000;
    return new Promise((resolve, reject) => {
      const tx = this._db.transaction("meeting_state", "readonly");
      const os = tx.objectStore("meeting_state");
      const toClean = [];
      const req = os.openCursor();
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const v = cursor.value;
          if ((v.createdAt || 0) < cutoff) toClean.push(v.meetingId);
          cursor.continue();
        } else {
          Promise.all(toClean.map(id => this.cleanup(id))).then(resolve).catch(reject);
        }
      };
      req.onerror = () => reject(req.error);
    });
  }
};

// Canonical transcript merge — the SINGLE source of truth for report input
async function buildCanonicalTranscript(mid) {
  // 1. Server: meeting_segments (RLS-protected, read-only)
  const serverMap = new Map();
  try {
    await refreshAccessToken();
    const { data: serverSegs } = await supabase
      .from("meeting_segments")
      .select("segment_index, transcript")
      .eq("meeting_id", mid)
      .order("segment_index");
    for (const s of (serverSegs || [])) {
      if (s.transcript?.trim()) serverMap.set(s.segment_index, { text: s.transcript, source: "server" });
    }
  } catch (e) {
    console.warn("[canonical] Server segments unavailable:", e.message);
  }

  // 2. Local IDB: segments with successful transcript
  const localMap = new Map();
  try {
    const localSegs = await MeetingStore.getAllSegments(mid);
    for (const s of localSegs) {
      if (s.transcriptText?.trim() && (s.transcriptStatus === "live_ok" || s.transcriptStatus === "batch_ok")) {
        localMap.set(s.segmentIndex, { text: s.transcriptText, source: "local" });
      }
    }
  } catch (_) {}

  // 3. In-memory: liveTranscriptChunks (volatile, last resort)
  const memoryMap = new Map();
  for (const [idx, text] of Object.entries(liveTranscriptChunks || {})) {
    if (text?.trim()) memoryMap.set(Number(idx), { text, source: "memory" });
  }

  // 4. Merge: Server > IDB > Memory, sorted by index
  const allIndices = new Set([...serverMap.keys(), ...localMap.keys(), ...memoryMap.keys()]);
  const merged = [...allIndices].sort((a, b) => a - b).map(idx => {
    const entry = serverMap.get(idx) || localMap.get(idx) || memoryMap.get(idx);
    return { index: idx, text: entry.text, source: entry.source };
  });

  // 5. Sophie voice as separate block
  const voiceText = (voiceTranscript || [])
    .filter(m => m.text?.trim())
    .map(m => `[${m.role === "user" ? "User" : "Sophie"}] ${m.text}`)
    .join("\n");

  return { segments: merged, voiceText };
}

// Format canonical transcript for API consumption
async function prepareSummaryInput(mid) {
  const { segments, voiceText } = await buildCanonicalTranscript(mid);
  const parts = [];

  // Include meeting context (participants, agenda, goal) from DB
  try {
    await refreshAccessToken();
    const { data: ctx } = await supabase
      .from("meeting_context")
      .select("context_type, content")
      .eq("meeting_id", mid);
    if (ctx?.length) {
      const contextLines = ctx.map(c => `[${c.context_type.toUpperCase()}] ${c.content}`).join("\n");
      parts.push(`[Meeting-Kontext]\n${contextLines}`);
    }
  } catch (_) {}

  // Include meeting title if available
  if (meetingData?.title) parts.push(`[Meeting-Titel] ${meetingData.title}`);

  const segText = segments.map(s => s.text).join(" ");
  if (segText.trim()) parts.push(`[Aufnahme — Gesprächsinhalt]\n${segText}`);
  if (voiceText.trim()) parts.push(`[Sophie Voice Session]\n${voiceText}`);
  return { transcriptText: parts.join("\n\n---\n\n"), hasContent: parts.length > 0 };
}

// Emergency flush: persist current recording segment on pagehide
async function emergencyFlush() {
  if (_emergencyFlushed || !MeetingStore.isAvailable()) return;
  if (!mediaRecorder || mediaRecorder.state !== "recording") return;
  _emergencyFlushed = true;

  try {
    const flushBlob = await new Promise((resolve) => {
      let resolved = false;
      const handler = (e) => {
        if (resolved) return;
        resolved = true;
        mediaRecorder.removeEventListener("dataavailable", handler);
        const allChunks = [...audioChunks];
        if (e.data?.size > 0) allChunks.push(e.data);
        resolve(allChunks.length > 0 ? new Blob(allChunks, { type: currentMimeType }) : null);
      };
      mediaRecorder.addEventListener("dataavailable", handler);
      try { mediaRecorder.requestData(); } catch (_) {}
      // Timeout fallback — pagehide has limited time
      setTimeout(() => {
        if (resolved) return;
        resolved = true;
        mediaRecorder.removeEventListener("dataavailable", handler);
        resolve(audioChunks.length > 0 ? new Blob(audioChunks, { type: currentMimeType }) : null);
      }, 500);
    });

    if (flushBlob && flushBlob.size > 500) {
      await MeetingStore.saveSegment(meetingId, liveSegmentIndex, flushBlob, currentMimeType);
      console.log(`[meeting-store] Emergency flush: seg ${liveSegmentIndex}, ${(flushBlob.size/1024).toFixed(0)}KB`);
    }
  } catch (e) {
    console.error("[meeting-store] Emergency flush failed:", e);
  }
}

// Retry report generation — fills gaps, builds canonical transcript, generates report
async function retryReportGeneration() {
  if (_reportRetryLock) return;
  _reportRetryLock = true;
  const retryBtn = document.getElementById("retryReportBtn");
  if (retryBtn) retryBtn.disabled = true;

  try {
    await MeetingStore.saveState(meetingId, { meetingStatus: "generating_report", reportStatus: "running" });
    currentMeetingStatus = "generating_report";

    // 1. Fill transcript gaps with batch transcription
    const gaps = await MeetingStore.getUntranscribed(meetingId);
    if (gaps.length > 0) {
      const batchResults = await transcribeMeetingBatchPerSegment(
        gaps.map(g => ({ blob: g.blob, segmentIndex: g.segmentIndex, mimeType: g.mimeType }))
      );
      for (const r of batchResults) {
        try {
          await MeetingStore.updateSegmentTranscript(
            meetingId, r.segmentIndex,
            r.text ? "batch_ok" : "batch_failed", "batch", r.text || null,
            r.error ? { code: "BATCH_FAIL", message: r.error, attempts: 1, lastAttemptAt: Date.now() } : null
          );
        } catch (_) {}
      }
    }

    // 2. Build canonical transcript
    const input = await prepareSummaryInput(meetingId);
    if (!input.hasContent) {
      const lang = localStorage.getItem("preferredLanguage") || "en";
      appendSystemMsg(lang === "de" ? "⚠️ Kein Inhalt verfügbar — Report nicht möglich" : "⚠️ No content available");
      await MeetingStore.saveState(meetingId, { meetingStatus: "report_failed_recoverable", reportStatus: "failed" });
      currentMeetingStatus = "report_failed_recoverable";
      return;
    }

    // 3. Generate report (reuse session if available)
    const state = await MeetingStore.getState(meetingId);
    let sessionId = state?.reportSessionId;
    if (!sessionId) {
      sessionId = await requestSummaryGeneration(meetingId, input.transcriptText);
      await MeetingStore.saveState(meetingId, { reportSessionId: sessionId });
    }

    // Show progress card
    const card = document.getElementById("summaryCard");
    if (card) card.classList.remove("hidden");

    await triggerAndPollMeetingReport(sessionId, input.transcriptText);

  } catch (e) {
    console.error("[meeting-retry] Failed:", e);
    await MeetingStore.saveState(meetingId, {
      meetingStatus: "report_failed_recoverable", reportStatus: "failed",
      lastErrorMessage: e.message
    });
    currentMeetingStatus = "report_failed_recoverable";
    const lang = localStorage.getItem("preferredLanguage") || "en";
    appendSystemMsg(lang === "de" ? `⚠️ Retry fehlgeschlagen: ${e.message}` : `⚠️ Retry failed: ${e.message}`);
    if (retryBtn) retryBtn.disabled = false;
  } finally {
    _reportRetryLock = false;
  }
}

async function requestWakeLock() {

  }
}

function releaseWakeLock() {

    wakeLockSentinel = null;
  }
}

function isMicStreamDead() {
  if (!sharedMicStream || !sharedMicStream.active) return true;
  const tracks = sharedMicStream.getAudioTracks();
  if (tracks.length === 0) return true;
  return tracks.every(t => t.readyState === "ended" || !t.enabled);
}

let _lastVisibilityHidden = null; // Track when page went hidden

// Re-acquire wake lock when page becomes visible again (iOS releases on tab switch)
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "hidden" && meetingData?.phase === "live") {
    _lastVisibilityHidden = Date.now();
    console.log("[meeting] Page hidden — recording may be interrupted");
  }

  if (document.visibilityState === "visible" && meetingData?.phase === "live") {
    const hiddenDuration = _lastVisibilityHidden ? Math.round((Date.now() - _lastVisibilityHidden) / 1000) : 0;
    _lastVisibilityHidden = null;
    console.log(`[meeting] Page visible again after ${hiddenDuration}s hidden`);

    await requestWakeLock();

    // Check BOTH recorder state AND mic stream health
    // iOS: recorder may still say "recording" but mic stream tracks are "ended" → zombie state
    const recorderDead = !mediaRecorder || mediaRecorder.state === "inactive";
    const micDead = isMicStreamDead();

    if (recorderDead || micDead) {
      console.warn(`[meeting] Recording needs restart — recorder=${mediaRecorder?.state || "null"}, micDead=${micDead}, hiddenFor=${hiddenDuration}s`);

      const msg = lang === "de"
        ? `⚠️ Aufnahme wurde unterbrochen (${hiddenDuration > 0 ? hiddenDuration + "s im Hintergrund" : "Bildschirm gesperrt"}). Starte neu...`
        : `⚠️ Recording interrupted (${hiddenDuration > 0 ? hiddenDuration + "s in background" : "screen locked"}). Restarting...`;
      appendMsg("assistant", msg);

      // Recover: transcribe any IDB segments that weren't sent during background
      if (MeetingStore.isAvailable() && meetingId) {
        try {
          const idbSegments = await MeetingStore.getAllSegments(meetingId);
          for (const seg of idbSegments) {
            const idx = seg.segmentIndex;
            if (liveTranscriptChunks[idx]) continue;
            if (seg.blob && seg.blob.size > 500) {
              console.log(`[meeting-recovery] Retrying IDB segment ${idx} (${(seg.blob.size / 1024).toFixed(0)}KB)`);
              transcribeLiveSegment(seg.blob, idx);
            }
          }
        } catch (e) {
          console.warn("[meeting-recovery] IDB segment recovery failed:", e.message);
        }
      }

      // Kill old dead stream before starting new one
      if (sharedMicStream) {
        sharedMicStream.getTracks().forEach(t => t.stop());
        sharedMicStream = null;
      }
      if (mediaRecorder && mediaRecorder.state === "recording") {
        try { mediaRecorder.stop(); } catch (_) {}
      }
      mediaRecorder = null;

      await startAudioRecording();
      consecutiveTranscribeErrors = 0; // Reset error counter after fresh start
    }
  }
});

// ---------------------------------------------------------------------------
// API helpers
// ---------------------------------------------------------------------------
async function api(action, body = null, method = "POST") {
  // Always try fresh token — long meetings can outlive the initial accessToken
  await refreshAccessToken();

  const opts = {
    method,
    headers: { "Content-Type": "application/json" },
  };
  if (accessToken) opts.headers.Authorization = `Bearer ${accessToken}`;

  let url = `/api/meeting?action=${action}`;
  if (body && method === "GET") {
    // For GET requests, append id to query
    if (body.id) url += `&id=${body.id}`;
    opts.method = "GET";
    opts.body = undefined;
  } else if (body) {
    opts.body = JSON.stringify(body);
  }

  const res = await fetch(url, opts);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error(`Server error (${res.status})`); }
  if (!res.ok) {
    const err = new Error(data.error || `HTTP ${res.status}`);
    err.status = res.status;
    err.redirect = data.redirect;
    err.pricing_url = data.pricing_url;
    err.reason = data.reason;
    err.remaining_tokens = data.remaining_tokens;
    throw err;
  }
  return data;
}

async function initAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = "/login/";
    return;
  }
  currentUser = session.user;
  accessToken = session.access_token;

  // Initialize MeetingStore (IndexedDB for audio safety net)
  await MeetingStore.open();
  localPersistenceAvailable = MeetingStore.isAvailable();
  if (!localPersistenceAvailable) {
    console.warn("[meeting] IndexedDB unavailable — no local audio backup");
  }
  // Cleanup old IDB data
  try {
    await MeetingStore.cleanupCompleted(1);
    await MeetingStore.cleanupAll(7);
  } catch (_) {}

  // Initial offline check
  if (!navigator.onLine) {
    setTimeout(() => {
      if (typeof appendSystemMsg === "function") {
        appendSystemMsg(lang === "de"
          ? "⚠️ Offline — Aufnahme möglich, Report erst bei Verbindung"
          : "⚠️ Offline — recording possible, report requires connection");
      }
    }, 1000);
  }

  // Check URL for meeting_id and test mode
  const params = new URLSearchParams(window.location.search);
  const urlMeetingId = params.get("id");
  const urlParentId = params.get("parentMeetingId");
  if (params.has("test")) window.__testMode = true;

  authLoading.classList.add("hidden");

  if (urlMeetingId) {
    await loadMeeting(urlMeetingId);
  } else if (urlParentId) {
    // Fortführen: neues Meeting basierend auf Parent
    selectedParentId = urlParentId;
    await showSetup();
    // Offene Punkte + Action Items des Parents laden und Agenda vorbefüllen
    _prefillFromParent(urlParentId, authSession?.access_token);
  } else {
    // Check for incomplete meetings (global recovery)
    if (MeetingStore.isAvailable()) {
      try {
        const incomplete = await MeetingStore.getIncompleteMeetings();
        const recoverable = incomplete.filter(m => m.meetingStatus === "report_failed_recoverable");
        if (recoverable.length > 0) {
          const latest = recoverable[0]; // sorted by updatedAt desc
          const date = new Date(latest.updatedAt || latest.createdAt).toLocaleString();
          const title = latest.meetingTitle || "Meeting";
          appendSystemMsg(lang === "de"
            ? `📋 Unvollständiges Meeting gefunden: "${title}" (${date}) — <a href="/meeting/?id=${latest.meetingId}" style="color:#4a7c59;text-decoration:underline;">Report jetzt erstellen</a>`
            : `📋 Incomplete meeting found: "${title}" (${date}) — <a href="/meeting/?id=${latest.meetingId}" style="color:#4a7c59;text-decoration:underline;">Create report now</a>`);
        }
      } catch (_) {}
    }
    // Go directly to setup (new meeting) — history accessible via back button
    await showSetup();
  }
}

let selectedMeetingType = "team";

// Fortführen: offene Punkte + Action Items vom Parent-Meeting laden und Agenda vorbefüllen
async function _prefillFromParent(parentId, accessToken) {
  try {
    const headers = { "Content-Type": "application/json" };
    if (accessToken) headers["Authorization"] = "Bearer " + accessToken;
    const res = await fetch(`/api/meeting?action=detail&meeting_id=${encodeURIComponent(parentId)}`, { headers });
    if (!res.ok) return;
    const data = await res.json();

    const agendaItems = [];

    // Offene Punkte aus meeting_summary
    if (data.summary?.open_points?.length) {
      agendaItems.push("--- Offene Punkte ---");
      data.summary.open_points.forEach(p => {
        agendaItems.push(typeof p === "string" ? p : p.text || p.title || JSON.stringify(p));
      });
    }

    // Nicht-erledigte Action Items
    if (data.summary?.action_items?.length) {
      const pending = data.summary.action_items.filter(a =>
        !a.done && !a.completed && a.status !== "done" && a.status !== "completed"
      );
      if (pending.length) {
        agendaItems.push("--- Offene Action Items ---");
        pending.forEach(a => {
          const who = a.assignee || a.who || "";
          const what = a.text || a.title || a.description || "";
          agendaItems.push(who ? `${who}: ${what}` : what);
        });
      }
    }

    // Agenda-Feld vorbefüllen wenn vorhanden
    const agendaField = $("meetingAgenda") || $("agendaInput");
    if (agendaField && agendaItems.length) {
      agendaField.value = agendaItems.join("\n");
    }

    // Titel vorbefüllen: "Fortführung: [Original-Titel]"
    const titleField = $("meetingTitle");
    if (titleField && data.meeting?.title) {
      const prefix = lang === "de" ? "Fortführung" : "Follow-up";
      titleField.value = `${prefix}: ${data.meeting.title}`;
    }
  } catch (e) {
    console.warn("[prefill-parent]", e?.message);
  }
}

async function showSetup() {
  historyScreen.classList.add("hidden");
  meetingArea.classList.remove("active");
  setupScreen.classList.remove("hidden");

  // ── Token balance pre-check (UX only — backend is the truth) ──
  try {
    await refreshAccessToken();
    const balanceRes = await fetch("/api/user?action=balance", {
      headers: accessToken ? { Authorization: `Bearer ${accessToken}` } : {},
    });
    if (balanceRes.ok) {
      const balanceData = await balanceRes.json();
      const remaining = balanceData.remaining_tokens ?? balanceData.totalRemaining ?? 0;
      const createBtn = $("createBtn");
      if (remaining < 1) {
        createBtn.disabled = true;
        createBtn.style.opacity = "0.5";
        const hint = document.createElement("div");
        hint.style.cssText = "text-align:center;margin:8px 0;font-size:13px;color:#a09080;";
        hint.innerHTML = lang === "de"
          ? `⚠️ Kein Guthaben — <a href="/pricing" style="color:#4a7c59;text-decoration:underline;">Tokens aufladen</a>`
          : lang === "fr"
          ? `⚠️ Pas de crédits — <a href="/pricing" style="color:#4a7c59;text-decoration:underline;">Recharger</a>`
          : `⚠️ No tokens — <a href="/pricing" style="color:#4a7c59;text-decoration:underline;">Get tokens</a>`;
        createBtn.parentNode.insertBefore(hint, createBtn.nextSibling);
      } else {
        createBtn.disabled = false;
        createBtn.style.opacity = "";
      }
    }
  } catch (e) {
    console.warn("[meeting-setup] Balance pre-check failed:", e.message);
    // Non-critical — backend will gate if needed
  }

  // Type pills click handler
  $("meetingTypePills").onclick = (e) => {
    const pill = e.target.closest(".type-pill");
    if (!pill) return;
    $("meetingTypePills").querySelectorAll(".type-pill").forEach(p => p.classList.remove("active"));
    pill.classList.add("active");
    selectedMeetingType = pill.dataset.value;
  };

  // Load past meetings for parent selector as dropdown
  const parentSelect = $("parentMeetingSelect");
  try {
    const data = await api("list", null, "GET");
    const meetings = (data.meetings || []).filter(m => (m.phase === "closed" || m.phase === "post") && m.has_summary);
    if (meetings.length) {
      for (const m of meetings.slice(0, 15)) {
        const d = new Date(m.created_at);
        const date = d.toLocaleDateString(lang === "de" ? "de-DE" : lang === "fr" ? "fr-FR" : "en-US", { month: "short", day: "numeric" });
        const time = d.toLocaleTimeString(lang === "de" ? "de-DE" : "en-US", { hour: "2-digit", minute: "2-digit" });
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = `${m.title || m.meeting_type} — ${date}, ${time}`;
        opt.dataset.title = m.title || m.meeting_type;
        parentSelect.appendChild(opt);
      }
    }
  } catch {}

  // Parent select change → prefill title + load context from parent
  parentSelect.onchange = async () => {
    const opt = parentSelect.selectedOptions[0];
    if (opt?.value) {
      selectedParentId = opt.value;
      $("meetingTitle").value = opt.dataset.title || "";
      // Pre-load parent data — store for after createMeeting
      try {
        const parentData = await api("get", { id: opt.value }, "GET");
        const contexts = parentData.context || [];
        const parentParticipants = contexts.find(c => c.context_type === "participants");
        const summary = parentData.summary;

        window.__parentPrefill = {};

        if (parentParticipants?.content) {
          window.__parentPrefill.participants = parentParticipants.content;
        }

        // Build agenda from structured summary (action_items, open_points)
        if (summary) {
          const items = [];
          const extract = (arr) => (arr || []).forEach(a => {
            let text = typeof a === "string" ? a : (a.text || "");
            text = text.trim().split(/[.!?]/)[0].trim();
            if (text.length > 60) text = text.slice(0, 57) + "…";
            if (text) items.push("• " + text);
          });
          extract(summary.action_items);
          extract(summary.open_points);
          if (items.length) window.__parentPrefill.agenda = items.join("\n");
        }
      } catch (e) {
        console.log("Could not load parent meeting data:", e);
      }
    } else {
      selectedParentId = null;
      $("meetingTitle").value = "";
      window.__parentPrefill = null;
    }
  };
}

async function createMeeting() {
  const btn = $("createBtn");
  btn.disabled = true;

  // Idempotency key: unique per user action, stable on retry
  const idempotencyKey = `meeting_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

  try {
    const data = await api("create", {
      meeting_type: selectedMeetingType,
      sophie_role: "co-think",
      title: $("meetingTitle").value.trim() || null,
      parent_meeting_id: selectedParentId,
      idempotency_key: idempotencyKey,
    });

    meetingId = data.meeting.id;
    window.history.replaceState({}, "", `/meeting/?id=${meetingId}`);
    await loadMeeting(meetingId);
  } catch (e) {
    if (e.status === 402) {
      const msg = lang === "de"
        ? "Nicht genug Guthaben für ein Meeting. Lade Tokens auf oder wähle ein Abo."

        : "Not enough tokens for a meeting. Top up or choose a subscription.";

// ---------------------------------------------------------------------------
// Load meeting
// ---------------------------------------------------------------------------
async function loadMeeting(id) {
  // Reset all transcript state from previous meetings
  speechTranscript.length = 0;
  voiceTranscript.length = 0;
  chatMessages.length = 0;
  userTranscriptBuffer.clear();
  partialAssistant = "";
  lastAssistantFinal = "";
  audioChunks = [];

  setupScreen.classList.add("hidden");
  historyScreen.classList.add("hidden");
  meetingArea.classList.add("active");

  try {
    const data = await api("get", { id }, "GET");
    meetingId = id;
    meetingData = data.meeting;
    chatMessages = [];

    // Update UI
    titleDisplay.textContent = meetingData.title || meetingData.meeting_type;
    updatePhaseUI(meetingData.phase);

    // Load context into fields
    const contexts = data.context || [];
    const agendaCtx = contexts.find(c => c.context_type === "agenda");
    const partCtx = contexts.find(c => c.context_type === "participants");
    const goalCtx = contexts.find(c => c.context_type === "goal");
    if (agendaCtx) $("ctxAgenda").value = agendaCtx.content;
    if (partCtx) $("ctxParticipants").value = partCtx.content;
    if (goalCtx) $("ctxGoal").value = goalCtx.content;

    // Apply parent meeting prefill (stored during setup)
    if (window.__parentPrefill) {
      if (window.__parentPrefill.agenda && !agendaCtx) {
        $("ctxAgenda").value = window.__parentPrefill.agenda;
        autoResizeTextarea($("ctxAgenda"));
      }
      if (window.__parentPrefill.participants && !partCtx) {
        $("ctxParticipants").value = window.__parentPrefill.participants;
        autoResizeTextarea($("ctxParticipants"));
      }
      window.__parentPrefill = null;
    }

    // Load existing uploaded files as document cards
    const fileContexts = contexts.filter(c => c.context_type === "file");
    const fileListEl = $("fileList");
    fileListEl.innerHTML = "";
    fileContexts.forEach(fc => renderDocCard(fc, fileListEl));

    // Load existing notes as system messages
    const notes = data.notes || [];
    notes.forEach(n => {
      if (n.note_type === "silent_hint") return; // Don't show hint internals
      appendSystemMsg(`[${n.note_type.toUpperCase()}] ${n.content}`);
    });

    // Initialize IDB state for this meeting
    meetingPhase = meetingData.phase;
    if (MeetingStore.isAvailable()) {
      try {
        await MeetingStore.saveState(id, {
          meetingTitle: meetingData.title || meetingData.meeting_type,
          meetingStatus: meetingData.phase === "live" ? "recording" : (meetingData.phase === "post" ? "stopped" : "report_completed"),
          localPersistenceAvailable: true
        });
      } catch (_) {}

      // Recovery check: if IDB says report_failed_recoverable, offer retry
      const idbState = await MeetingStore.getState(id).catch(() => null);
      if (idbState?.meetingStatus === "report_failed_recoverable") {
        currentMeetingStatus = "report_failed_recoverable";
        appendSystemMsg(lang === "de"
          ? "📋 Report-Erstellung wurde unterbrochen — du kannst es erneut versuchen."
          : "📋 Report generation was interrupted — you can retry.");
        showRetryButton();
      }
    }

    // Show report card if meeting has a report session
    if (meetingData.session_id && (meetingData.phase === "post" || meetingData.phase === "closed")) {
      meetingReportSessionId = meetingData.session_id;
      $("summaryCard").classList.remove("hidden");
      pollMeetingReport(meetingReportSessionId);
    }

    // Auto-send opener in prep phase — short, no AI call needed
    if (meetingData.phase === "prep" && notes.length === 0) {
      const openerText = lang === "de"
        ? "Wenn du Hilfe brauchst, sag Bescheid. Ich bin da!"
        : lang === "fr"
        ? "Si tu as besoin d'aide, dis-le moi. Je suis là !"
        : "If you need help, just ask. I'm here!";
      appendMsg("assistant", openerText);
    }
  } catch (e) {
    chatArea.innerHTML = `<div class="msg system">Error loading meeting: ${e.message}</div>`;
  }
}

// ---------------------------------------------------------------------------
// Phase UI management
// ---------------------------------------------------------------------------
function updatePhaseUI(phase) {
  phaseBadge.textContent = phase.toUpperCase();
  phaseBadge.dataset.phase = phase;
  meetingArea.dataset.phase = phase;

  // Context panel: only in prep
  contextPanel.classList.toggle("hidden", phase !== "prep");

  // CTA buttons
  ctaLive.classList.toggle("hidden", phase !== "prep");
  ctaPost.classList.toggle("hidden", phase !== "live");
  ctaClose.classList.toggle("hidden", phase !== "post");
  phaseCta.classList.toggle("hidden", phase === "closed");

  // Input bar: disabled in closed, placeholder changes per phase
  $("inputBar").classList.toggle("hidden", phase === "closed");
  const PHASE_PLACEHOLDERS = {
    de: { prep: "Frage Sophie zur Vorbereitung...", live: "Was passiert gerade im Meeting?", post: "Fragen zur Zusammenfassung..." },
    en: { prep: "Ask Sophie about preparation...", live: "What's happening in the meeting?", post: "Questions about the summary..." },
    fr: { prep: "Demande \u00e0 Sophie pour la pr\u00e9paration...", live: "Que se passe-t-il en r\u00e9union ?", post: "Questions sur le r\u00e9sum\u00e9 ?" },
  };
  chatInput.placeholder = (PHASE_PLACEHOLDERS[lang] || PHASE_PLACEHOLDERS.en)[phase] || t("typeHere");

  // Summary card visibility
  if (phase !== "post" && phase !== "closed") {
    summaryCard.classList.add("hidden");
  }

  // Live timer
  if (phase === "live") {
    startLiveTimer();
  } else {
    stopLiveTimer();
  }

  // Mute toggle: visible in live + post phases
  muteToggle.style.display = (phase === "live" || phase === "post") ? "inline-flex" : "none";
  // Pause button: visible in live phase only
  if (meetingPauseBtn) meetingPauseBtn.style.display = (phase === "live") ? "inline-flex" : "none";

  // Participants bar: visible when meeting is loaded
  updateParticipantsBar();

  // Focus: agenda field in prep, chat input in live
  if (phase === "prep") {
    setTimeout(() => $("ctxAgenda")?.focus(), 100);
  } else if (phase === "live") {
    setTimeout(() => chatInput?.focus(), 100);
  }
}

function startLiveTimer() {
  liveStartTime = meetingData?.started_at ? new Date(meetingData.started_at).getTime() : Date.now();
  liveTimerEl.classList.remove("hidden");
  liveTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - liveStartTime) / 1000);
    const m = Math.floor(elapsed / 60).toString().padStart(2, "0");
    const s = (elapsed % 60).toString().padStart(2, "0");
    liveTimerEl.textContent = `🔴 Aufnahme ${m}:${s}`;
  }, 1000);
}

function stopLiveTimer() {
  clearInterval(liveTimerInterval);
  liveTimerEl.classList.add("hidden");
}

// ---------------------------------------------------------------------------
// Phase transitions
// ---------------------------------------------------------------------------
async function transitionPhase(newPhase, source = "unknown") {
  // Guard: skip if already in this phase
  if (meetingData?.phase === newPhase) {
    console.log(`[meeting] skipping transition — already in phase "${newPhase}"`);
    return;
  }
  console.log(`[meeting] transitionPhase: ${meetingData?.phase} → ${newPhase} (source: ${source})`);
  try {
    // Update UI IMMEDIATELY — don't wait for API
    updatePhaseUI(newPhase);
    meetingData = { ...meetingData, phase: newPhase };
    meetingPhase = newPhase;

    // Track phase in IDB
    const statusMap = { live: "recording", post: "stopped", closed: "report_completed" };
    if (statusMap[newPhase]) {
      currentMeetingStatus = statusMap[newPhase];
      MeetingStore.saveState(meetingId, { meetingStatus: statusMap[newPhase] }).catch(() => {});
    }

    // API call in background (non-blocking for UI)
    api("phase", { meeting_id: meetingId, phase: newPhase, source })
      .then(data => { meetingData = { ...meetingData, ...data.meeting }; })
      .catch(e => console.error("[meeting] phase API error:", e.message));
    // Phase info messages
    const PHASE_INFO = {
      de: {
        live: "🟢 LIVE — Schreib mir was im Meeting passiert. Ich höre mit, strukturiere mit und gebe dir Hinweise wenn nötig.",
        post: "📝 NACHBEREITUNG — Ich erstelle jetzt die Zusammenfassung...",
        closed: "✅ Meeting abgeschlossen.",
      },
      en: {
        live: "🟢 LIVE — Tell me what's happening in the meeting. I'll listen, structure, and give you hints when needed.",
        post: "📝 POST — Generating your meeting summary...",
        closed: "✅ Meeting closed.",
      },
      fr: {
        live: "🟢 LIVE — Dis-moi ce qui se passe en réunion. J'écoute, structure et te donne des indices si nécessaire.",
        post: "📝 POST — Je génère le résumé...",
        closed: "✅ Réunion terminée.",
      },
    };
    const phaseInfo = (PHASE_INFO[lang] || PHASE_INFO.en)[newPhase];
    if (phaseInfo) appendSystemMsg(phaseInfo);

    // Wake lock: acquire when going live, release when leaving
    if (newPhase === "live") {
      await requestWakeLock();
    } else if (newPhase === "post" || newPhase === "closed") {
      releaseWakeLock();
    }

    // When going LIVE: show agenda, start analysis timer, check balance
    if (newPhase === "live") {
      const agenda = $("ctxAgenda")?.value?.trim();
      const goal = $("ctxGoal")?.value?.trim();
      let liveOpener = "";
      if (agenda) {
        liveOpener = agenda;
        if (goal) liveOpener += "\n\n" + (lang === "de" ? "Ziel: " : "Goal: ") + goal;
      } else if (goal) {
        liveOpener = (lang === "de" ? "Ziel: " : "Goal: ") + goal;
      }
      if (liveOpener) appendMsg("assistant", liveOpener);

      // ── Hybrid: Start periodic hint analysis (every 10 min) ──
      liveSegmentIndex = 0;
      liveTranscriptChunks = {};
      consecutiveTranscribeErrors = 0;
      lastAnalyzedSegmentIndex = 0;
      if (analysisInterval) clearInterval(analysisInterval);
      analysisInterval = setInterval(() => runHintAnalysis(), ANALYSIS_INTERVAL_MS);

      // ── Guthabencheck: warn if low balance ──
      checkMeetingBalance();
    }

    // Disconnect Sophie voice + stop audio recording when leaving live phase
    if (newPhase === "post" || newPhase === "closed") {
      stopRecStatusUpdates();
      if (!sophieMuted) {
        const wasBurstAtEnd = isMeetingBurstActive;
        sophieMuted = true;
        isMeetingBurstActive = false;
        clearTimeout(window._burstSilenceTimer);
        muteToggle.classList.remove("active");
        disconnectSophieVoice(true, { wasBurst: wasBurstAtEnd });
      }

      // Stop analysis timer
      if (analysisInterval) { clearInterval(analysisInterval); analysisInterval = null; }
    }

    // Finalize billing when going to closed (if post was skipped or finalize didn't run)
    if (newPhase === "closed") {
      try {
        const billingRes = await api("finalize_billing", { meeting_id: meetingId });
        const b = billingRes?.billing;
        if (b?.status === "finalized" && b?.total_billed_tokens > 0) {
          const msg = lang === "de"
            ? `💰 Meeting-Kosten: ${b.total_billed_tokens} Tokens`
            : `💰 Meeting cost: ${b.total_billed_tokens} tokens`;
          appendSystemMsg(msg);
        }
      } catch (e) {
        console.error("[meeting-closed] finalize_billing error:", e.message);
      }
    }

    // Auto-summarize when entering post phase
    if (newPhase === "post") {
      // ── Hybrid: Stop analysis timer ──
      if (analysisInterval) { clearInterval(analysisInterval); analysisInterval = null; }

      // ── Hybrid: Flush pending burst messages ──
      await flushPendingBurstMessages();

      // ── Hybrid: Run final analysis (guaranteed, waits instead of skip) ──
      await runHintAnalysis(true);

      // 1. Stop recording and get audio segments
      setSophieStatus(lang === "de" ? "Sophie erstellt den Report …" : "Sophie is creating the report …");
      const segments = await stopAudioRecording();
      cleanupMicStream();

      // 2. Build canonical transcript (Server + IDB + Memory merged)
      //    This is the single source of truth — NOT liveTranscriptChunks alone
      const canonicalInput = await prepareSummaryInput(meetingId);
      if (canonicalInput.hasContent) {
        speechTranscript.push(canonicalInput.transcriptText);
        console.log(`[meeting-post] Canonical transcript: ${canonicalInput.transcriptText.length} chars`);
      } else if (segments && segments.length > 0) {
        // Fallback: batch transcribe remaining untranscribed segments
        appendSystemMsg(lang === "de"
          ? "🔄 Transkribiere Audio..."
          : "🔄 Transcribing audio...");
        const whisperText = await transcribeMeetingBatch(segments);
        if (whisperText) speechTranscript.push(whisperText);
      }

      // TEST MODE: inject fake data
      if (window.__testMode) {
        appendSystemMsg("🧪 TEST-MODUS: Fake Voice-Daten injiziert");
        if (speechTranscript.length === 0) {
          speechTranscript.push(
            "Wir müssen die Markteinführung von MeetSophie besprechen.",
            "Der Launch soll nächste Woche Dienstag stattfinden.",
            "LinkedIn ist der wichtigste Kanal für uns.",
          );
        }
        voiceTranscript.push(
          { role: "user", text: "Sophie, welcher Social Media Kanal passt am besten für B2B SaaS?" },
          { role: "assistant", text: "Für MeetSophie empfehle ich LinkedIn als primären Kanal. Twitter/X als Zweitkanal." },
          { role: "user", text: "Gut, dann nehmen wir LinkedIn." },
          { role: "assistant", text: "Beschluss festgehalten: LinkedIn als primärer Kanal für die Markteinführung." },
        );
      }

      // 3. Generate summary + report
      try {
        await generateSummary();
      } catch (e) {
        console.error("[meeting-post] generateSummary error:", e.message);
        appendMsg("assistant", lang === "de"
          ? `⚠️ Report-Fehler: ${e.message}`
          : `⚠️ Report error: ${e.message}`);
      }

      setSophieStatus("");

      // 4. Finalize billing — ALWAYS runs, even if summary/report failed
      try {
        const billingRes = await api("finalize_billing", { meeting_id: meetingId });
        const b = billingRes?.billing;
        if (b?.total_billed_tokens != null) {
          const msg = lang === "de"
            ? `💰 Meeting-Kosten: ${b.total_billed_tokens} Tokens ($${Number(b.total_cost_usd || 0).toFixed(3)})`
            : `💰 Meeting cost: ${b.total_billed_tokens} tokens ($${Number(b.total_cost_usd || 0).toFixed(3)})`;
          appendSystemMsg(msg);
        }
      } catch (e) {
        console.error("[meeting-post] finalize_billing error:", e.message);
      }
    }
  } catch (e) {
    setSophieStatus("");
    alert("Error: " + e.message);
  }
}

// ---------------------------------------------------------------------------
// Chat
// ---------------------------------------------------------------------------
function appendMsg(role, content) {
  const div = document.createElement("div");
  const isHint = role === "assistant" && content.trim().startsWith("💡");
  div.className = `msg ${role}${isHint ? " hint" : ""}`;
  // Render bullet points as list, preserve line breaks
  const escaped = content.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines = escaped.split("\n");
  const hasBullets = lines.some(l => l.trim().startsWith("•") || l.trim().startsWith("-"));
  if (hasBullets) {
    let html = "";
    let inList = false;
    for (const line of lines) {
      const trimmed = line.trim();
      if (trimmed.startsWith("•") || trimmed.startsWith("- ")) {
        if (!inList) { html += "<ul style='margin:4px 0;padding-left:18px'>"; inList = true; }
        html += `<li style="margin:2px 0">${trimmed.replace(/^[•\-]\s*/, "")}</li>`;
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        if (trimmed) html += `<div>${trimmed}</div>`;
      }
    }
    if (inList) html += "</ul>";
    div.innerHTML = html;
  } else {
    div.innerHTML = escaped.replace(/\n/g, "<br>");
  }
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function appendSystemMsg(text) {
  console.log("[meeting-system]", text);
  // Show warnings/errors in UI so users see what's happening
  if (text.includes("⚠️") || text.includes("❌")) {
    appendMsg("assistant", text);
  }
}

function autoResizeTextarea(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 300) + "px";
}
// Auto-resize all context textareas on input
["ctxAgenda", "ctxParticipants", "ctxGoal"].forEach(id => {
  const el = $(id);
  if (el) el.addEventListener("input", () => autoResizeTextarea(el));
});

function setSophieStatus(text) {
  const el = $("sophieStatus");
  if (!text) {
    el.style.display = "none";
    el.textContent = "";
  } else {
    el.textContent = text;
    el.style.display = "block";
  }
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.id = "typingIndicator";
  div.innerHTML = '<span class="typing-dots"></span>';
  chatArea.appendChild(div);

function removeTyping() {

  if (el) el.remove();
}

// Hint throttle state
const HINT_MIN_INTERVAL = 3 * 60 * 1000; // 3 min
const HINT_MAX_PER_MEETING = 8;
let lastHintAt = null;
let hintCount = 0;

function shouldShowHint() {
  if (hintCount >= HINT_MAX_PER_MEETING) return false;
  if (lastHintAt && Date.now() - lastHintAt < HINT_MIN_INTERVAL) return false;
  return true;
}

// Check if user is directly addressing Sophie
function isAddressingSophie(text) {
  const lower = text.toLowerCase();
  return /\bsophie\b/.test(lower) || /^@sophie/i.test(lower) || lower.startsWith("hey sophie") || lower.startsWith("sophie,");
}

async function sendMessage(text, isAutoOpener = false) {
  if (isLoading || !text.trim()) return;
  isLoading = true;
  sendBtn.disabled = true;

  if (!isAutoOpener) {
    appendMsg("user", text);
  }
  chatMessages.push({ role: "user", content: text });

  // Chat is always active — Sophie responds to every chat message.
  // Mute only affects voice (future feature), not the chat channel.

  showTyping();
  setSophieStatus(lang === "de" ? "Sophie denkt nach …" : "Sophie is thinking …");

  try {
    const data = await api("message", {
      meeting_id: meetingId,
      messages: chatMessages,
    });

    removeTyping();
    setSophieStatus("");

    let reply = data.reply;

    // Handle hint throttle: if reply contains a hint but throttle says no, strip it
    if (data.hint && reply.includes("\ud83d\udca1")) {
      if (!shouldShowHint()) {
        reply = reply.replace(/\ud83d\udca1[^\n]*/g, "").trim();
      } else {
        lastHintAt = Date.now();
        hintCount++;
      }
    }

    if (reply) {
      appendMsg("assistant", reply);
      chatMessages.push({ role: "assistant", content: reply });
    }

  } catch (e) {
    removeTyping();
    setSophieStatus("");
    console.error("Chat error:", e);
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    // Only auto-focus chat input during live phase; in prep, agenda field is more relevant
    if (meetingData?.phase === "live") chatInput.focus();
  }
}

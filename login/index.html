<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  <script>if("serviceWorker"in navigator){navigator.serviceWorker.register("/sw.js");navigator.serviceWorker.addEventListener("message",e=>{if(e.data?.type==="SW_UPDATED")location.reload()})}</script>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Meet Sophie – Login</title>

  <style>
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body {
      height: 100%;
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f14;
      position: relative;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: url("/sophie-opt.jpg") center/cover no-repeat;
      background: image-set(url("/sophie.webp") type("image/webp"), url("/sophie-opt.jpg") type("image/jpeg")) center/cover no-repeat;
      opacity: 1;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.60);
      z-index: 1;
    }

    .wrap {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 380px;
    }

    h2 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: -.01em;
    }

    .sub {
      font-size: 15px;
      color: rgba(255,255,255,.65);
      margin: 0 0 28px;
    }

    input[type="email"] {
      width: 100%;
      padding: 15px 16px;
      font-size: 16px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      color: white;
      outline: none;
      margin-bottom: 12px;
      transition: border-color .2s;
    }

    input[type="email"]::placeholder { color: rgba(255,255,255,.4); }
    input[type="email"]:focus { border-color: rgba(255,255,255,.5); }

    button {
      width: 100%;
      padding: 15px;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: white;
      color: #0b0f14;
      cursor: pointer;
      transition: opacity .2s;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    #status {
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
      color: rgba(255,255,255,.75);
    }

    #status.err { color: #ff7070; }

    .back {
      position: fixed;
      top: 18px;
      left: 16px;
      z-index: 3;
      color: rgba(255,255,255,.8);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="overlay"></div>

  <a class="back" href="/" id="backLink">← Back</a>

  <div class="wrap">
    <h2 id="loginHeading">Sophie is waiting.</h2>
    <p class="sub" id="loginSub">Enter your email to get a login link.</p>

    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
    <button id="magicLinkBtn" type="button">Send login link</button>
    <p id="status"></p>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    import { sendAuthEmail, verifyOTP, shouldUseOTP } from "/lib/sophie-auth-helper.js";
    import { SophieTabManager } from "/lib/sophie-tab-manager.js";

    const SUPABASE_URL = "https://ohzfojsbmzinpxhcynpt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oemZvanNibXppbnB4aGN5bnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mzc1MjcsImV4cCI6MjA4NzAxMzUyN30.7eGSeEvOCj9vMqFJj9C0SR8DiiYygbFUvpQ8rIVEc0I";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let authHandled = false;

    const LANG = (navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en";
    const T = {
      de: {
        back: "← Zurück",
        heading: "Sophie wartet auf dich.",
        sub: "Meld dich kurz an — dann geht's sofort los.",
        btn: "Login-Link senden",
        btnOtp: "Code senden",
        empty: "Bitte gib deine E-Mail ein.",
        sending: "Login-Link wird gesendet…",
        sendingOtp: "Code wird gesendet…",
        sent: "Prüfe deine E-Mails und klick auf den Login-Link.",
        sentOtp: "Prüfe deine E-Mails — gib den Code unten ein.",
        codePlaceholder: "Code",
        verifyBtn: "Bestätigen",
        verifying: "Wird geprüft…",
        wrongCode: "Falscher Code. Nochmal versuchen.",
        resend: "Code erneut senden",
      },
      en: {
        back: "← Back",
        heading: "Sophie is waiting for you.",
        sub: "Sign in quickly — then you're good to go.",
        btn: "Send login link",
        btnOtp: "Send code",
        empty: "Please enter your email.",
        sending: "Sending login link…",
        sendingOtp: "Sending code…",
        sent: "Check your email and click the login link.",
        sentOtp: "Check your email — enter the code below.",
        codePlaceholder: "Code",
        verifyBtn: "Verify",
        verifying: "Verifying…",
        wrongCode: "Wrong code. Try again.",
        resend: "Resend code",
      }
    };
    const t = T[LANG];
    const useOTP = shouldUseOTP();
    document.getElementById("backLink").textContent = t.back;
    document.getElementById("loginHeading").textContent = t.heading;
    document.getElementById("loginSub").textContent = t.sub;
    document.getElementById("magicLinkBtn").textContent = useOTP ? t.btnOtp : t.btn;

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("magicLinkBtn");

    function setStatus(msg, isErr = false) {
      statusEl.textContent = msg;
      statusEl.className = isErr ? "err" : "";
    }

    async function ensureUserUsageRow(userId) {
      const { data } = await supabase
        .from("user_usage")
        .select("user_id")
        .eq("user_id", userId)
        .maybeSingle();

      if (!data) {
        await supabase.from("user_usage").insert({
          user_id: userId,
          free_tokens_total: 50,
          free_tokens_used: 0
        });
      }
    }

    async function ensureUserRelationshipRow(userId) {
      const { data } = await supabase
        .from("user_relationship")
        .select("user_id")
        .eq("user_id", userId)
        .maybeSingle();

      if (!data) {
        await supabase.from("user_relationship").insert({
          user_id: userId,
          tone_baseline: "",
          openness_level: "",
          emotional_patterns: "",
          last_interaction_summary: "",
          updated_at: new Date().toISOString(),
        });
      }
    }

    async function handleSuccessfulAuth() {
      if (authHandled) return;

      // Wait for Supabase session to sync from callback tab (localStorage propagation)
      let user = null;
      for (let i = 0; i < 15; i++) {
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) { user = session.user; break; }
        await new Promise(r => setTimeout(r, 200));
      }
      if (!user) return;

      authHandled = true;

      await ensureUserUsageRow(user.id);
      await ensureUserRelationshipRow(user.id);

      const params = new URLSearchParams(window.location.search);
      const redirect = params.get("redirect");
      let target = "/";
      if (redirect) {
        try {
          const url = new URL(redirect, window.location.origin);
          const safePaths = ["/pricing", "/talk", "/settings", "/meeting", "/"];
          if (url.origin === window.location.origin && safePaths.some(p => url.pathname.startsWith(p))) {
            target = url.pathname + url.search;
          }
        } catch (_) {}
      }
      window.location.href = target;
    }

    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
      await handleSuccessfulAuth();
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "INITIAL_SESSION" && session?.user) handleSuccessfulAuth();
      // Also handle SIGNED_IN from OTP verification in this tab
      if (event === "SIGNED_IN" && session?.user) handleSuccessfulAuth();
    });

    // Listen for AUTH_COMPLETED from callback tab (magic link opened in new tab)
    const tabManager = new SophieTabManager({
      onAuthCompleted: () => handleSuccessfulAuth(),
    });
    tabManager.init().catch(() => {});

    // Also detect auth via localStorage event (fallback for cross-tab communication)
    window.addEventListener("storage", (e) => {
      if (e.key === "sophie-auth-event" && e.newValue) {
        try {
          const data = JSON.parse(e.newValue);
          if (data.type === "AUTH_COMPLETED") handleSuccessfulAuth();
        } catch (_) {}
      }
    });

    // Pre-fill email from last successful login
    const emailInput = document.getElementById("email");
    try { const savedEmail = localStorage.getItem("sophie_login_email"); if (savedEmail && emailInput) emailInput.value = savedEmail; } catch (_) {}

    // Enter key submits email
    if (emailInput) emailInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); btn.click(); }
    });

    // State for OTP code input (shown after email is sent on iOS PWA)
    let pendingOtpEmail = null;

    btn.onclick = async () => {
      const email = emailInput.value.trim();
      if (!email) return setStatus(t.empty, true);

      setStatus(useOTP ? t.sendingOtp : t.sending);
      btn.disabled = true;

      const redirectUrl = window.location.origin + "/auth/callback";
      const { error, method } = await sendAuthEmail(supabase, email, redirectUrl);

      btn.disabled = false;

      if (error) return setStatus(error.message, true);

      // Remember email for next visit
      try { localStorage.setItem("sophie_login_email", email); } catch (_) {}

      if (method === "otp") {
        // iOS PWA: show OTP code input below the email field
        pendingOtpEmail = email;
        setStatus(t.sentOtp);
        showOTPCodeInput(email);
      } else {
        setStatus(t.sent);
      }
    };

    function showOTPCodeInput(email) {
      // Replace the email input + button with code input + verify button
      const wrap = document.querySelector(".wrap");
      const existingOtp = document.getElementById("otpSection");
      if (existingOtp) existingOtp.remove();

      const section = document.createElement("div");
      section.id = "otpSection";
      section.style.marginTop = "16px";
      section.innerHTML = `
        <input id="otpCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="10"
          placeholder="${t.codePlaceholder}"
          style="width:100%;padding:15px 16px;font-size:24px;text-align:center;letter-spacing:8px;
                 border:1px solid rgba(255,255,255,.22);border-radius:12px;
                 background:rgba(255,255,255,.08);color:white;outline:none;margin-bottom:12px" />
        <button id="otpVerifyBtn" type="button"
          style="width:100%;padding:15px;font-size:17px;font-weight:700;border:none;
                 border-radius:12px;background:white;color:#0b0f14;cursor:pointer">${t.verifyBtn}</button>
        <button id="otpResendBtn" type="button"
          style="width:100%;padding:10px;font-size:13px;font-weight:500;border:none;
                 border-radius:8px;background:transparent;color:rgba(255,255,255,.5);
                 cursor:pointer;margin-top:8px">${t.resend}</button>`;
      wrap.appendChild(section);

      const codeInput = document.getElementById("otpCode");
      const verifyBtn = document.getElementById("otpVerifyBtn");
      const resendBtn = document.getElementById("otpResendBtn");
      setTimeout(() => codeInput.focus(), 80);

      codeInput.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); verifyBtn.click(); }
      });

      verifyBtn.onclick = async () => {
        const code = codeInput.value.trim();
        if (!code || code.length < 6) return;
        verifyBtn.disabled = true;
        verifyBtn.textContent = t.verifying;

        const { data, error } = await verifyOTP(supabase, email, code);
        if (error) {
          verifyBtn.disabled = false;
          verifyBtn.textContent = t.verifyBtn;
          setStatus(t.wrongCode, true);
          codeInput.value = "";
          codeInput.focus();
          return;
        }
        // Success — handleSuccessfulAuth will fire via onAuthStateChange
      };

      resendBtn.onclick = async () => {
        resendBtn.disabled = true;
        await sendAuthEmail(supabase, email, "");
        setStatus(t.sentOtp);
        resendBtn.disabled = false;
      };
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meet Sophie – Login</title>

  <style>
    *{ box-sizing:border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f14;
      position: relative;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: url("/sophie.jpg") center/cover no-repeat;
      opacity: 1;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.60);
      z-index: 1;
    }

    .wrap {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 380px;
    }

    h2 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: -.01em;
    }

    .sub {
      font-size: 15px;
      color: rgba(255,255,255,.65);
      margin: 0 0 28px;
    }

    input[type="email"] {
      width: 100%;
      padding: 15px 16px;
      font-size: 16px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      color: white;
      outline: none;
      margin-bottom: 12px;
      transition: border-color .2s;
    }

    input[type="email"]::placeholder { color: rgba(255,255,255,.4); }
    input[type="email"]:focus { border-color: rgba(255,255,255,.5); }

    button {
      width: 100%;
      padding: 15px;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: white;
      color: #0b0f14;
      cursor: pointer;
      transition: opacity .2s;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    #status {
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
      color: rgba(255,255,255,.75);
    }

    #status.err { color: #ff7070; }

    .back {
      position: fixed;
      top: 18px;
      left: 16px;
      z-index: 3;
      color: rgba(255,255,255,.8);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="overlay"></div>

  <a class="back" href="/">← Back</a>

  <div class="wrap">
    <h2>Sophie is waiting.</h2>
    <p class="sub">Enter your email to get a login link.</p>

    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
    <button id="magicLinkBtn" type="button">Send login link</button>
    <p id="status"></p>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://ohzfojsbmzinpxhcynpt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oemZvanNibXppbnB4aGN5bnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mzc1MjcsImV4cCI6MjA4NzAxMzUyN30.7eGSeEvOCj9vMqFJj9C0SR8DiiYygbFUvpQ8rIVEc0I";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let authHandled = false;

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("magicLinkBtn");

    function setStatus(msg, isErr = false) {
      statusEl.textContent = msg;
      statusEl.className = isErr ? "err" : "";
    }

    async function ensureUserMemoryRow(userId) {
      const { data } = await supabase
        .from("user_memory")
        .select("user_id")
        .eq("user_id", userId)
        .maybeSingle();

      if (!data) {
        await supabase.from("user_memory").insert({
          user_id: userId,
          profile_notes: "",
          relationship_summary: ""
        });
      }
    }

    async function ensureUserUsageRow(userId) {
      const { data } = await supabase
        .from("user_usage")
        .select("user_id")
        .eq("user_id", userId)
        .maybeSingle();

      if (!data) {
        await supabase.from("user_usage").insert({
          user_id: userId,
          free_seconds_total: 120,
          free_seconds_used: 0
        });
      }
    }

    async function ensureUserRelationshipRow(userId) {
      const { data } = await supabase
        .from("user_relationship")
        .select("user_id")
        .eq("user_id", userId)
        .maybeSingle();

      if (!data) {
        await supabase.from("user_relationship").insert({
          user_id: userId,
          tone_baseline: "",
          openness_level: "",
          emotional_patterns: "",
          last_interaction_summary: "",
          updated_at: new Date().toISOString(),
        });
      }
    }

    async function handleSuccessfulAuth() {
      if (authHandled) return;
      authHandled = true;

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      await ensureUserMemoryRow(user.id);
      await ensureUserUsageRow(user.id);
      await ensureUserRelationshipRow(user.id);

      window.location.href = "/talk";
    }

    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
      await handleSuccessfulAuth();
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (session?.user) handleSuccessfulAuth();
    });

    btn.onclick = async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) return setStatus("Please enter your email.", true);

      setStatus("Sending login link…");
      btn.disabled = true;

      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: window.location.origin + "/auth/callback"
        }
      });

      btn.disabled = false;

      if (error) return setStatus(error.message, true);
      setStatus("Check your email and click the login link.");
    };
  </script>
</body>
</html>

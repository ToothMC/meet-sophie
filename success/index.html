<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sophie – Danke</title>
  <style>
    *{ box-sizing:border-box; }

    html, body{
      height:100%;
      margin:0;
    }

    body{
      font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color:white;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0b0f14;
      position:relative;
      overflow:hidden;
    }

    .bg{
      position:fixed;
      inset:0;
      background:url("/sophie.jpg") center/cover no-repeat;
      opacity:1;
      z-index:0;
    }

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.62);
      z-index:1;
    }

    .wrap{
      position:relative;
      z-index:2;
      width:90%;
      max-width:400px;
      text-align:center;
    }

    .avatar{
      width:72px;
      height:72px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid rgba(255,255,255,.25);
      margin:0 auto 18px;
      display:block;
    }

    .name{
      font-size:13px;
      font-weight:600;
      letter-spacing:.06em;
      text-transform:uppercase;
      opacity:.6;
      margin:0 0 18px;
    }

    .message{
      font-size:20px;
      font-weight:500;
      line-height:1.55;
      margin:0 0 10px;
      letter-spacing:-.01em;
    }

    .sub{
      font-size:15px;
      color:rgba(255,255,255,.6);
      margin:0 0 32px;
      line-height:1.5;
    }

    .status{
      font-size:13px;
      color:rgba(255,255,255,.5);
      margin:0 0 20px;
      min-height:18px;
    }

    .btn{
      display:inline-block;
      padding:15px 32px;
      border-radius:14px;
      background:white;
      color:#0b0f14;
      text-decoration:none;
      font-weight:700;
      font-size:16px;
      transition:opacity .2s;
    }

    .btn:hover{ opacity:.92; }

    .footer{
      position:fixed;
      bottom:18px;
      left:0; right:0;
      text-align:center;
      font-size:12px;
      color:rgba(255,255,255,.35);
      z-index:2;
    }

    .footer a{
      color:rgba(255,255,255,.45);
      text-decoration:none;
    }

    .footer a:hover{ color:rgba(255,255,255,.7); }

    .lang{
      margin-top:10px;
      font-size:12px;
    }

    .lang a{
      color:rgba(255,255,255,.4);
      text-decoration:none;
      cursor:pointer;
    }

    .lang a:hover{ color:rgba(255,255,255,.7); }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="wrap">
    <img class="avatar" src="/sophie.jpg" alt="Sophie" />
    <p class="name">Sophie</p>

    <p class="message" id="tMessage"></p>
    <p class="sub" id="tSub"></p>

    <p class="status" id="tStatus"></p>
    <a id="go" class="btn" href="/talk/" style="display:none;" id="tBtn"></a>
  </div>

  <div class="footer">
    <div>
      <a href="/impressum.html" target="_blank" rel="noopener">Impressum</a>
      &nbsp;·&nbsp;
      <a href="/privacy.html" target="_blank" rel="noopener">Datenschutz</a>
      &nbsp;·&nbsp;
      <a href="/terms.html" target="_blank" rel="noopener">AGB</a>
      &nbsp;·&nbsp;
      <a href="/withdrawal.html" target="_blank" rel="noopener">Widerruf</a>
      &nbsp;·&nbsp;
      <a href="/pricing" id="tManage"></a>
    </div>
    <div class="lang">
      <a href="#" id="de">DE</a> · <a href="#" id="en">EN</a>
    </div>
  </div>

  <script>
  const TEXT = {
    de: {
      message: "Danke. Ich freue mich, dass du da bist.",
      sub: "Dein Zugang wird gerade aktiviert — ich warte schon auf unser nächstes Gespräch.",
      status: "Einen Moment … wird geprüft.",
      ready: "Bereit.",
      btn: "Weiter zu Sophie",
      manage: "Abo verwalten",
      error: "Die Aktivierung konnte nicht bestätigt werden. Bitte versuche es gleich noch einmal.",
    },
    en: {
      message: "Thank you. I'm glad you're here.",
      sub: "Your access is being activated — I'm already looking forward to our next conversation.",
      status: "One moment… verifying.",
      ready: "Ready.",
      btn: "Continue with Sophie",
      manage: "Manage subscription",
      error: "Activation could not be confirmed yet. Please try again in a moment.",
    }
  };

  let lang = (navigator.language || "").toLowerCase().startsWith("en") ? "en" : "de";

  function setLang(l){
    lang = l;
    document.documentElement.lang = l;
    document.getElementById("tMessage").textContent = TEXT[l].message;
    document.getElementById("tSub").textContent     = TEXT[l].sub;
    document.getElementById("tStatus").textContent  = TEXT[l].status;
    document.getElementById("go").textContent       = TEXT[l].btn;
    document.getElementById("tManage").textContent  = TEXT[l].manage;
  }

  document.getElementById("de").onclick = (e)=>{ e.preventDefault(); setLang("de"); };
  document.getElementById("en").onclick = (e)=>{ e.preventDefault(); setLang("en"); };

  setLang(lang);

  async function confirmCheckout() {
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");

    if (!sessionId) {
      document.getElementById("tStatus").textContent = TEXT[lang].error;
      document.getElementById("go").style.display = "inline-block";
      return;
    }

    try {
      const res = await fetch(`/api/billing?action=confirm&session_id=${encodeURIComponent(sessionId)}`, {
        method: "GET",
        credentials: "same-origin"
      });

      const json = await res.json().catch(() => ({}));

      if (!res.ok) {
        console.error("confirm-checkout failed:", json);
        document.getElementById("tStatus").textContent = TEXT[lang].error;
        document.getElementById("go").style.display = "inline-block";
        return;
      }

      document.getElementById("tStatus").textContent = TEXT[lang].ready;
      window.location.href = "/talk/?paid=1";
    } catch (err) {
      console.error("confirm-checkout error:", err);
      document.getElementById("tStatus").textContent = TEXT[lang].error;
      document.getElementById("go").style.display = "inline-block";
    }
  }

  confirmCheckout();
  </script>
</body>
</html>

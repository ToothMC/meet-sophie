<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sophie – Aktiv</title>
  <style>
    body{
      font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      max-width: 760px;
      margin: 44px auto;
      padding: 0 18px;
      color:#111;
    }
    .card{
      border:1px solid rgba(0,0,0,.12);
      border-radius:16px;
      padding:18px;
      background:#fff;
      box-shadow:0 10px 30px rgba(0,0,0,.06);
    }
    h1{ margin:0 0 8px; font-size:26px; }
    p{ margin:10px 0; line-height:1.55; }
    a{ color:inherit; }
    .btn{
      display:inline-block;
      margin-top:10px;
      padding:12px 14px;
      border-radius:12px;
      background:#111;
      color:#fff;
      text-decoration:none;
      font-weight:700;
    }
    .btn:hover{ opacity:.92; }
    .muted{ opacity:.72; font-size:13px; }
    .links{ margin-top:14px; font-size:13px; opacity:.85; }
    .links a{ text-decoration:none; }
    .links a:hover{ text-decoration:underline; }
    .hr{ height:1px; background:rgba(0,0,0,.10); margin:16px 0; }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="tTitle">Zahlung erfolgreich ✅</h1>
    <p id="tBody">Dein Abonnement ist aktiv. Du kannst jetzt mit Sophie weitermachen.</p>

    <p id="wait" class="muted">Einen Moment… wird aktiviert.</p>
    <p><a id="go" class="btn" href="/talk/" style="display:none;">Weiter zu Sophie</a></p>

    <div class="hr"></div>

    <div class="links">
      <a href="/impressum.html" target="_blank" rel="noopener">Impressum</a>
      &nbsp;·&nbsp;
      <a href="/privacy.html" target="_blank" rel="noopener">Datenschutz</a>
      &nbsp;·&nbsp;
      <a href="/terms.html" target="_blank" rel="noopener">AGB</a>
      &nbsp;·&nbsp;
      <a href="/withdrawal.html" target="_blank" rel="noopener">Widerruf</a>
      &nbsp;·&nbsp;
      <a href="/pricing/" id="tManage">Abo verwalten</a>
    </div>

    <p class="muted" id="tLang" style="margin-top:14px;">
      <a href="#" id="de">DE</a> · <a href="#" id="en">EN</a>
    </p>
  </div>

  <script>
  const TEXT = {
    de: {
      title: "Zahlung erfolgreich ✅",
      body: "Dein Zugang wird jetzt aktiviert.",
      wait: "Einen Moment… wird geprüft.",
      ready: "Bereit.",
      btn: "Weiter zu Sophie",
      manage: "Abo verwalten",
      error: "Die Aktivierung konnte nicht bestätigt werden. Bitte versuche es gleich noch einmal.",
    },
    en: {
      title: "Payment successful ✅",
      body: "Your access is being activated now.",
      wait: "One moment… verifying.",
      ready: "Ready.",
      btn: "Enter the Room",
      manage: "Manage subscription",
      error: "Activation could not be confirmed yet. Please try again in a moment.",
    }
  };

  let lang = (navigator.language || "").toLowerCase().startsWith("en") ? "en" : "de";

  function setLang(l){
    lang = l;
    document.documentElement.lang = l;
    document.getElementById("tTitle").textContent = TEXT[l].title;
    document.getElementById("tBody").textContent  = TEXT[l].body;
    document.getElementById("wait").textContent   = TEXT[l].wait;
    document.getElementById("go").textContent     = TEXT[l].btn;
    document.getElementById("tManage").textContent= TEXT[l].manage;
  }

  document.getElementById("de").onclick = (e)=>{ e.preventDefault(); setLang("de"); };
  document.getElementById("en").onclick = (e)=>{ e.preventDefault(); setLang("en"); };

  setLang(lang);

  async function confirmCheckout() {
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");

    if (!sessionId) {
      document.getElementById("wait").textContent = TEXT[lang].error;
      document.getElementById("go").style.display = "inline-block";
      return;
    }

    try {
      const res = await fetch(`/api/confirm-checkout?session_id=${encodeURIComponent(sessionId)}`, {
        method: "GET",
        credentials: "same-origin"
      });

      const json = await res.json().catch(() => ({}));

      if (!res.ok) {
        console.error("confirm-checkout failed:", json);
        document.getElementById("wait").textContent = TEXT[lang].error;
        document.getElementById("go").style.display = "inline-block";
        return;
      }

      document.getElementById("wait").textContent = TEXT[lang].ready;
      window.location.href = "/talk/?paid=1";
    } catch (err) {
      console.error("confirm-checkout error:", err);
      document.getElementById("wait").textContent = TEXT[lang].error;
      document.getElementById("go").style.display = "inline-block";
    }
  }

  confirmCheckout();
</script>
</body>
</html>

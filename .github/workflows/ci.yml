name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Syntax + Schema Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check (JS/MJS)
        run: node scripts/check-syntax.mjs

      - name: RPC drift check
        run: node scripts/check-rpcs.mjs

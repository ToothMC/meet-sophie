  <script>
    try {
      var s = localStorage.getItem("sb-ohzfojsbmzinpxhcynpt-auth-token");
      if (!s || !JSON.parse(s).access_token) { location.replace("/"); }

  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --line: rgba(0,0,0,.08);
      --accent-blue: #3f8cff;
      --shadow: 0 4px 12px rgba(69,49,27,.05);
      --radius: 18px;
      --max: 640px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      visibility: hidden;
    }
    body.ready { visibility: visible; }
    a { color: inherit; text-decoration: none; }

    /* ── Header ──────────────────────────────────── */
    .header {
      position: sticky; top: 0; z-index: 40;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      background: rgba(235,233,230,.75);
      border-bottom: 1px solid rgba(0,0,0,.06);
    }
    .header-inner {
      display: flex; align-items: center; gap: 12px;
      max-width: var(--max); margin: 0 auto;
      padding: 0 16px; min-height: 56px;
    }
    .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid var(--line); background: var(--card);
      font-size: 18px; cursor: pointer; color: var(--text);
      font-family: inherit;
    }
    .back-btn:hover { background: #f0eeec; }
    .header-title { font-size: 17px; font-weight: 600; }

    /* ── Content ──────────────────────────────────── */
    .content {
      max-width: var(--max); margin: 0 auto;
      padding: 20px 16px 100px;
    }

    /* ── Type Group ───────────────────────────────── */
    .type-group { margin-bottom: 12px; }
    .type-group.empty { display: none; }
    .type-label {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .04em; color: var(--muted);
      margin: 0; padding: 10px 2px;
      cursor: pointer; user-select: none;
    }
    .type-label:hover { color: var(--text); }
    .type-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 6px;
      font-size: 12px; margin-right: 6px;
    }
    .type-count {
      font-size: 11px; font-weight: 500;
      background: rgba(0,0,0,.05); border-radius: 8px;
      padding: 1px 7px; margin-left: 6px;
    }
    .type-chevron {
      font-size: 14px; transition: transform .2s;
      margin-left: auto; padding-left: 8px;
    }
    .type-group.collapsed .type-chevron { transform: rotate(-90deg); }
    .type-group.collapsed .type-list,
    .type-group.collapsed .load-more { display: none; }

    /* ── Entry Card (Rich) ────────────────────────── */
    .entry {
      display: flex; gap: 12px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: background .12s;
    }
    .entry:hover { background: #f5f5f5; }
    .entry:active { background: #f0eeec; }
    .entry-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .entry-info { flex: 1; min-width: 0; }
    .entry-top {
      display: flex; align-items: center; gap: 6px;
    }
    .entry-title {
      font-size: 14px; font-weight: 600; color: var(--text);
      margin: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      flex: 1;
    }
    .entry-date {
      font-size: 11px; color: var(--muted); flex-shrink: 0;
    }
    .entry-summary {
      font-size: 12px; color: var(--muted); margin-top: 3px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .entry-bottom {
      display: flex; align-items: center; gap: 6px; margin-top: 6px;
    }
    .entry-badge {
      display: inline-block;
      font-size: 10px; font-weight: 600;
      padding: 2px 8px; border-radius: 6px;
    }
    .badge-type {
      border: 1px solid currentColor; opacity: .7;
    }
    .badge-open { background: rgba(52,196,122,.12); color: #1e9957; }
    .entry-arrow {
      color: var(--muted); font-size: 16px; flex-shrink: 0; opacity: .3;
      align-self: center;
    }

    /* ── Title Group (same title merged) ────────── */
    .title-group {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
    }
    .title-group-header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px;
      background: var(--card);
      cursor: pointer; user-select: none;
      font-size: 15px; font-weight: 500; color: var(--text);
    }
    .title-group-header:hover { background: #f5f5f5; }
    .title-group-count {
      font-size: 11px; color: var(--muted); margin-left: auto;
    }
    .title-group-chevron {
      font-size: 12px; color: var(--muted);
      transition: transform .2s;
      transform: rotate(-90deg);
    }
    .title-group-list { padding: 0 8px 8px; background: var(--card); }
    .title-group-list .entry {
      margin-bottom: 4px;
      border: 1px solid rgba(0,0,0,.04);
      box-shadow: none;
    }

    /* ── Delete Button ────────────────────────────── */
    .entry-delete {
      width: 28px; height: 28px; border-radius: 50%;
      border: none; background: transparent;
      color: var(--muted); font-size: 16px;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s;
      opacity: .4;
    }
    .entry-delete:hover { background: rgba(239,68,68,.10); color: #dc2626; opacity: 1; }

    /* ── Load More ────────────────────────────────── */
    .load-more {
      display: block; width: 100%;
      padding: 10px; margin-top: 4px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: transparent; color: var(--muted);
      font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      text-align: center;
    }
    .load-more:hover { background: rgba(0,0,0,.02); color: var(--text); }

    /* ── Skeleton ─────────────────────────────────── */
    .skeleton-entry {
      height: 56px; border-radius: 14px;
      background: rgba(0,0,0,.04); margin-bottom: 8px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:.7;} }

    /* ── Empty State ──────────────────────────────── */
    .empty-state {
      text-align: center; padding: 48px 20px;
      color: var(--muted); font-size: 15px;
    }

    /* ── Bottom Nav ───────────────────────────────── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: rgba(235,233,230,.75);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(0,0,0,.06);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav-inner {
      display: flex; justify-content: center; gap: 48px;
      padding: 8px 0; max-width: var(--max); margin: 0 auto;
    }
    .nav-tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none;
      color: var(--muted); font-size: 10px; font-weight: 600;
      font-family: inherit; cursor: pointer; padding: 4px 12px;
    }
    .nav-tab .tab-icon { font-size: 20px; }
    .nav-tab.active { color: var(--accent-blue); }

    @media (min-width: 641px) { .bottom-nav { max-width: 640px; left: 50%; transform: translateX(-50%); border-radius: 18px 18px 0 0; } }
  </style>
</head>
<body>

    <div class="header-inner">
      <button class="back-btn" id="backBtn">&lsaquo;</button>
      <span class="header-title" id="headerTitle">Reports</span>
    </div>
  </header>

  <div class="content" id="content">
    <!-- Skeleton while loading -->
    <div class="type-group" id="skeletonGroup">
      <div class="skeleton-entry"></div>
      <div class="skeleton-entry"></div>
      <div class="skeleton-entry"></div>
      <div class="skeleton-entry"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a class="nav-tab" href="/app">
        <span class="tab-icon">&#9679;</span>

      <button class="nav-tab active" data-tab="history">
        <span class="tab-icon">&#9776;</span>
        <span>Verlauf</span>

  <script src="/lib/sophie-export.js"></script>
  <script src="/lib/sophie-report-overlay.js"></script>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    import { getSessionOrNull } from "/lib/sophie-auth-helper.js";

    const SUPABASE_URL = "https://ohzfojsbmzinpxhcynpt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oemZvanNibXppbnB4aGN5bnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mzc1MjcsImV4cCI6MjA4NzAxMzUyN30.7eGSeEvOCj9vMqFJj9C0SR8DiiYygbFUvpQ8rIVEc0I";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const lang = localStorage.getItem("preferredLanguage") || "en";

    const session = await getSessionOrNull(supabase);
    if (!session) { location.replace("/"); throw new Error("no session"); }
    document.body.classList.add("ready");

    const userId = session.user.id;
    const content = document.getElementById("content");

    document.getElementById("backBtn").addEventListener("click", () => {
      location.href = "/app";
    });

    // ── i18n ──────────────────────────────────────
    const L = {
      en: {
        title: "History",
        talks: "Conversations",
        brainstorms: "Brainstorming",
        meetings: "Meetings",
        pitches: "Sales Pitches",
        chats: "Chats",
        load_more: "Load more",
        empty: "No sessions yet",
        resume: "Continue",
        turns: (n) => `${n} turn${n !== 1 ? "s" : ""}`,
        ago: (s) => s,
      },
      de: {
        title: "Verlauf",
        talks: "Gespräche",
        brainstorms: "Brainstorming",
        meetings: "Meetings",
        pitches: "Sales Pitches",
        chats: "Chats",
        load_more: "Mehr laden",
        empty: "Noch keine Sessions",
        resume: "Fortsetzen",
        turns: (n) => `${n} Nachricht${n !== 1 ? "en" : ""}`,
        ago: (s) => s,
      },
      fr: {
        title: "Historique",
        talks: "Conversations",
        brainstorms: "Brainstorming",
        meetings: "Réunions",
        pitches: "Sales Pitches",
        chats: "Chats",
        load_more: "Charger plus",
        empty: "Pas encore de sessions",
        resume: "Continuer",
        turns: (n) => `${n} message${n !== 1 ? "s" : ""}`,
        ago: (s) => s,
      },
    };
    const t = (k) => (L[lang] || L.en)[k] || (L.en)[k] || k;

    document.getElementById("headerTitle").textContent = t("title");

    // ── Date formatting ──────────────────────────
    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const now = new Date();
      const diff = now - d;
      const mins = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);

      if (mins < 2) return lang === "de" ? "gerade eben" : lang === "fr" ? "à l'instant" : "just now";
      if (mins < 60) return lang === "de" ? `vor ${mins} Min.` : lang === "fr" ? `il y a ${mins} min` : `${mins}m ago`;
      if (hours < 24) return lang === "de" ? `vor ${hours} Std.` : lang === "fr" ? `il y a ${hours}h` : `${hours}h ago`;
      if (days < 7) return lang === "de" ? `vor ${days} Tag${days > 1 ? "en" : ""}` : lang === "fr" ? `il y a ${days}j` : `${days}d ago`;
      return d.toLocaleDateString(lang === "de" ? "de-DE" : lang === "fr" ? "fr-FR" : "en-US", { day: "numeric", month: "short" });
    }

    function escHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    // ── Type config ──────────────────────────────
    const TYPES = [
      { key: "talks",       icon: "&#9679;", label: t("talks"),       color: "#3f8cff" },
      { key: "brainstorms", icon: "&#10022;", label: t("brainstorms"), color: "#d4a017" },
      { key: "meetings",    icon: "&#9673;", label: t("meetings"),     color: "#1e9957" },
      { key: "pitches",     icon: "&#9650;", label: t("pitches"),      color: "#c62828" },
      { key: "chats",       icon: "&#9998;", label: t("chats"),        color: "#6b7280" },
    ];

    const PAGE_SIZE = 20;
    const state = {};
    TYPES.forEach(tp => { state[tp.key] = { items: [], offset: 0, hasMore: true }; });

    // ── Fetch data ───────────────────────────────
    async function fetchGroup(key, offset) {
      if (key === "meetings") {
        const { data } = await supabase
          .from("meetings")
          .select("id, title, meeting_type, phase, started_at, ended_at")
          .eq("user_id", userId)
          .order("started_at", { ascending: false })
          .range(offset, offset + PAGE_SIZE - 1);
        return (data || []).map(m => ({
          id: m.id, title: m.title || "Meeting", type: "meeting",
          date: m.started_at, status: m.phase,
          continuable: ["prep", "live"].includes(m.phase),
        }));
      }
      if (key === "chats") {
        // Chats-Tab zeigt zwei Quellen:
        //   (1) native Chat-Sessions (session_type='chat', turn_count > 0)
        //   (2) Voice-Sessions (talk/brainstorm/sales_pitch/voice), die über send_chat_note
        //       Einträge in conversation_messages erzeugt haben — !inner filtert auf "hat Notes".
        //   Gespräch bleibt Primary im Talks-Tab, der Chat hier ist die zusätzliche Sicht.
        const [chatNativeRes, voiceWithNotesRes] = await Promise.all([
          supabase
            .from("user_sessions")
            .select("id, title, status, turn_count, started_at, last_message_at, session_date, short_summary, session_type")
            .eq("user_id", userId)
            .eq("session_type", "chat")
            .gt("turn_count", 0)
            .order("last_message_at", { ascending: false })
            .range(offset, offset + PAGE_SIZE - 1),
          supabase
            .from("user_sessions")
            .select("id, title, status, turn_count, started_at, last_message_at, session_date, short_summary, session_type, conversation_messages!inner(session_id)")
            .eq("user_id", userId)
            .in("session_type", ["talk", "brainstorm", "sales_pitch", "voice"])
            .order("session_date", { ascending: false })
            .range(offset, offset + PAGE_SIZE - 1),
        ]);

        // De-dupe (safety) and merge
        const seen = new Set();
        const merged = [];
        for (const row of [...(chatNativeRes.data || []), ...(voiceWithNotesRes.data || [])]) {
          if (seen.has(row.id)) continue;
          seen.add(row.id);
          merged.push(row);
        }

        merged.sort((a, b) => {
          const da = a.last_message_at || a.session_date || a.started_at || 0;
          const db = b.last_message_at || b.session_date || b.started_at || 0;
          return new Date(db) - new Date(da);
        });

        return merged.map(c => {
          const dateVal = c.last_message_at || c.session_date || c.started_at;
          const fallbackTitle = dateVal
            ? new Date(dateVal).toLocaleDateString(lang || "en", { day: "2-digit", month: "2-digit" })
            : "Chat";
          return {
            id: c.id,
            title: c.title || c.short_summary || (c.turn_count ? `Chat (${t("turns")(c.turn_count)})` : fallbackTitle),
            type: "chat",
            date: dateVal,
            status: c.status,
            continuable: ["active", "paused"].includes(c.status),
            turnCount: c.turn_count,
            // For voice-based rows the "chat" view is read-only — no resume to /chat,
            // since the parent session lives in Talks. Click opens Chat-panel with notes.
            sourceType: c.session_type,
          };
        });
      }
      // talks, brainstorms, pitches — all from user_sessions via session_type.
      // Verlauf = alle Sessions mit oder ohne Report. Verlauf ist der Verlauf.
      const typeMap = { talks: "talk", brainstorms: "brainstorm", pitches: "sales_pitch" };
      const sessionType = typeMap[key];
      // Legacy: 7 Rows mit session_type='voice' existieren aus der Zeit, als chat_note
      // die Row mit 'voice' anlegte und memory-update den Typ nicht korrigierte.
      // Ab jetzt werden neue Sessions korrekt als 'talk' geschrieben; die alten zählen
      // als Talks.
      const typeFilter = sessionType === "talk" ? ["talk", "voice"] : [sessionType];
      // Join conversation_outputs for correct-language title/summary
      let query = supabase
        .from("user_sessions")
        .select("id, title, session_type, status, started_at, session_date, short_summary, duration_seconds, has_output, conversation_outputs(title, short_summary)")
        .eq("user_id", userId)
        .in("session_type", typeFilter)
        .order("session_date", { ascending: false })
        .range(offset, offset + PAGE_SIZE - 1);

      const { data } = await query;
      return (data || []).map(s => {
        const co = Array.isArray(s.conversation_outputs) ? s.conversation_outputs[0] : s.conversation_outputs;
        const dateVal = s.started_at || s.session_date;
        const fallbackTitle = dateVal
          ? new Date(dateVal).toLocaleDateString(lang || "en", { day: "2-digit", month: "2-digit" })
          : key.slice(0, -1);
        // Legacy 'voice' rows als 'talk' verbuchen (damit Resume-Logic greift)
        const normalizedType = s.session_type === "voice" ? "talk" : s.session_type;
        return {
        id: s.id, title: co?.title || s.title || fallbackTitle, type: normalizedType,
        summary: co?.short_summary || s.short_summary || "",
        date: dateVal, status: s.status,
        continuable: ["active", "paused", "draft"].includes(s.status),
        duration: s.duration_seconds,
        hasOutput: !!s.has_output,
      }; });
    }

    // ── Render ────────────────────────────────────
    function cleanTitle(t) { return (t || "").replace(/_\d+$/, "").trim(); }

    const TYPE_COLORS = {
      talk: { bg: "rgba(63,140,255,.10)", fg: "#3f8cff", icon: "&#9679;" },
      chat: { bg: "rgba(107,114,128,.10)", fg: "#6b7280", icon: "&#9998;" },
      brainstorm: { bg: "rgba(212,160,23,.10)", fg: "#d4a017", icon: "&#10022;" },
      meeting: { bg: "rgba(30,153,87,.10)", fg: "#1e9957", icon: "&#9673;" },
      sales_pitch: { bg: "rgba(198,40,40,.10)", fg: "#c62828", icon: "&#9650;" },
    };
    const TYPE_BADGE_LABELS = {
      en: { talk: "Talk", chat: "Chat", brainstorm: "Brainstorm", meeting: "Meeting", sales_pitch: "Pitch" },
      de: { talk: "Gespräch", chat: "Chat", brainstorm: "Brainstorm", meeting: "Meeting", sales_pitch: "Pitch" },
      fr: { talk: "Conversation", chat: "Chat", brainstorm: "Brainstorm", meeting: "Meeting", sales_pitch: "Pitch" },
    };

    function formatDuration(sec) {
      if (!sec || sec < 10) return "";
      if (sec < 60) return `${sec}s`;
      const m = Math.floor(sec / 60);
      return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`;
    }

    function renderEntry(item) {
      const div = document.createElement("div");
      div.className = "entry";
      const tc = TYPE_COLORS[item.type] || TYPE_COLORS.talk;
      const badgeLabel = (TYPE_BADGE_LABELS[lang] || TYPE_BADGE_LABELS.en)[item.type] || item.type;
      const durStr = formatDuration(item.duration);
      const resumeBadge = item.continuable
        ? `<span class="entry-badge badge-open">${t("resume")}</span>`
        : "";
      const summaryHtml = item.summary
        ? `<div class="entry-summary">${escHtml(item.summary)}</div>`
        : "";
      div.innerHTML = `
        <div class="entry-icon" style="background:${tc.bg};color:${tc.fg}">${tc.icon}</div>
        <div class="entry-info">
          <div class="entry-top">
            <p class="entry-title">${escHtml(item.title)}</p>
            <span class="entry-date">${formatDate(item.date)}</span>
          </div>
          ${summaryHtml}
          <div class="entry-bottom">
            <span class="entry-badge badge-type" style="color:${tc.fg}">${badgeLabel}</span>
            ${durStr ? `<span class="entry-badge" style="background:rgba(0,0,0,.04);color:var(--muted)">${durStr}</span>` : ""}
            ${resumeBadge}
          </div>
        </div>
        <button class="entry-delete" title="${lang === "de" ? "Löschen" : "Delete"}">&times;</button>
        <span class="entry-arrow">&rsaquo;</span>
      `;
      div.querySelector(".entry-delete").addEventListener("click", async (e) => {
        e.stopPropagation();
        const msg = lang === "de" ? "Diesen Eintrag löschen?" : "Delete this entry?";
        if (!confirm(msg)) return;
        await deleteEntry(item);
        // Save references BEFORE removing from DOM
        const titleGroupEl = div.closest(".title-group");
        const typeGroupEl = div.closest(".type-group") || titleGroupEl?.closest(".type-group");
        div.remove();
        // Clean up empty title-group wrapper
        if (titleGroupEl) {
          const subList = titleGroupEl.querySelector(".title-group-list");
          if (!subList || subList.children.length === 0) titleGroupEl.remove();
          else {
            const countEl = titleGroupEl.querySelector(".title-group-count");
            if (countEl) countEl.textContent = subList.children.length + "×";
          }
        }
        // Clean up empty type-group
        if (typeGroupEl) {
          const listEl = typeGroupEl.querySelector(".type-list");
          const countEl = typeGroupEl.querySelector(".type-count");
          if (listEl && listEl.children.length === 0) typeGroupEl.remove();
          else if (countEl && listEl) countEl.textContent = listEl.querySelectorAll(".entry").length;
        }
      });
      div.querySelector(".entry-info").addEventListener("click", () => resumeEntry(item));
      div.querySelector(".entry-icon")?.addEventListener("click", () => resumeEntry(item));
      div.querySelector(".entry-arrow")?.addEventListener("click", () => resumeEntry(item));
      return div;
    }

    function renderTitleGroup(title, items) {
      if (items.length === 1) return renderEntry(items[0]);
      const wrap = document.createElement("div");
      wrap.className = "title-group";
      const header = document.createElement("div");
      header.className = "title-group-header";
      header.innerHTML = `<span>${escHtml(title)}</span><span class="title-group-count">${items.length}&times;</span><span class="title-group-chevron">&#9662;</span>`;
      const sub = document.createElement("div");
      sub.className = "title-group-list";
      sub.style.display = "none";
      items.forEach(item => sub.appendChild(renderEntry(item)));
      header.addEventListener("click", () => {
        const open = sub.style.display !== "none";
        sub.style.display = open ? "none" : "block";
        header.querySelector(".title-group-chevron").style.transform = open ? "rotate(-90deg)" : "";
      });
      wrap.appendChild(header);
      wrap.appendChild(sub);
      return wrap;
    }

    function renderGroup(typeConf) {
      const st = state[typeConf.key];
      if (st.items.length === 0 && !st.hasMore) return null;

      const group = document.createElement("div");
      group.className = "type-group collapsed"; // collapsed by default
      group.id = `group-${typeConf.key}`;

      const label = document.createElement("p");
      label.className = "type-label";
      const tc = TYPE_COLORS[typeConf.key === "talks" ? "talk" : typeConf.key === "brainstorms" ? "brainstorm" : typeConf.key === "pitches" ? "sales_pitch" : typeConf.key === "chats" ? "chat" : "meeting"] || TYPE_COLORS.talk;
      label.innerHTML = `<span style="display:flex;align-items:center;gap:8px"><span class="type-icon" style="background:${tc.bg};color:${tc.fg}">${typeConf.icon}</span> ${typeConf.label}<span class="type-count">${st.items.length}</span></span><span class="type-chevron">&#9662;</span>`;
      label.addEventListener("click", () => group.classList.toggle("collapsed"));
      group.appendChild(label);

      const list = document.createElement("div");
      list.className = "type-list";
      list.id = `list-${typeConf.key}`;
      // Group by title (like Settings page)
      const titleGroups = {};
      for (const item of st.items) {
        const key2 = cleanTitle(item.title);
        if (!titleGroups[key2]) titleGroups[key2] = [];
        titleGroups[key2].push(item);
      }
      for (const [title, items] of Object.entries(titleGroups)) {
        list.appendChild(renderTitleGroup(title, items));
      }
      group.appendChild(list);

      if (st.hasMore && st.items.length >= PAGE_SIZE) {
        const btn = document.createElement("button");
        btn.className = "load-more";
        btn.textContent = t("load_more");
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          btn.textContent = "...";
          const more = await fetchGroup(typeConf.key, st.offset);
          if (more.length < PAGE_SIZE) st.hasMore = false;
          st.items.push(...more);
          st.offset += more.length;
          more.forEach(item => list.appendChild(renderEntry(item, typeConf)));
          label.querySelector(".type-count").textContent = st.items.length;
          if (!st.hasMore || more.length === 0) btn.remove();
          else btn.textContent = t("load_more");
        });
        group.appendChild(btn);
      }

      if (st.items.length === 0) {
        group.classList.add("empty");
      }

      return group;
    }

    // ── Resume logic ─────────────────────────────
    async function resumeEntry(item) {
      // Chat items (native oder Voice-mit-Notes) öffnen direkt das Chat-Panel.
      // Das Report-Overlay wäre hier falsch: bei Voice-mit-Notes würde es den
      // Talk-Report zeigen statt die Chat-Notes.
      if (item.type === "chat") {
        _navigateToResume(item);
        return;
      }
      // Report laden und im Overlay anzeigen
      if (window.SophieReportOverlay) {
        try {
          const token = (await supabase.auth.getSession()).data?.session?.access_token;
          const source = item.type === "meeting" ? "meeting" : "talk";
          const res = await fetch(`/api/settings?action=report-detail&session_id=${encodeURIComponent(item.id)}&source=${source}`, {
            headers: token ? { "Authorization": `Bearer ${token}` } : {},
          });
          if (!res.ok) throw new Error("Fetch failed");
          const data = await res.json();

          // Typ-Mapping
          const typeMap = { talk: "talk", brainstorm: "brainstorm", sales_pitch: "salespitch", meeting: "meeting", chat: "chat" };
          const type = typeMap[item.type] || "talk";

          // Fallback HTML für Meetings ohne report_html
          let htmlContent = data.report_html || "";
          if (!htmlContent && data.short_summary) {
            htmlContent = `<p style="margin:0 0 16px;color:#3a3028;line-height:1.7">${data.short_summary}</p>`;
            if (data.action_items?.length) {
              htmlContent += `<div style="margin-bottom:14px"><h4 style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#a09080;margin:0 0 8px">Action Items</h4>` +
                data.action_items.map(i => `<div style="padding:6px 0;border-bottom:1px solid #f0ece6;font-size:13px">${typeof i === 'string' ? i : i.text || i}</div>`).join('') + '</div>';
            }
          }

          const reportData = {
            id: item.id,
            type,
            source: "reports",
            title: data.title || item.title || "Report",
            createdAt: item.date || data.created_at || new Date().toISOString(),
            html: htmlContent,
            plainText: null,
            hasTranscript: false,
            transcriptHtml: null,
            continuePayload: {
              sourceType: type,
              sourceId: item.id,
              resumeSessionId: item.id,
              targetMode: type === "meeting" ? "meeting" : (type === "talk" ? null : type),
            },
          };

          SophieReportOverlay.open(reportData, {
            lang: "de",
            onContinue: (payload) => {
              // Direkte Navigation als Fortführen
              _navigateToResume(item);
            },
            onDelete: async (rd) => {
              await deleteEntry(item);
              SophieReportOverlay.close();
              loadAll();
            },
          });
        } catch (e) {
          console.error("[resumeEntry]", e);
          // Fallback: direkte Navigation
          _navigateToResume(item);
        }
      } else {
        // Ohne Modul: direkte Navigation
        _navigateToResume(item);
      }
    }

    function _navigateToResume(item) {
      switch (item.type) {
        case "talk":
          sessionStorage.setItem("sophie_resume_session_id", item.id);
          location.href = "/talk";
          break;
        case "brainstorm":
          sessionStorage.setItem("sophie_resume_session_id", item.id);
          localStorage.setItem("sophie_session_mode", "brainstorm");
          location.href = "/talk";
          break;
        case "meeting":
          location.href = `/meeting/?id=${item.id}`;
          break;
        case "sales_pitch":
          sessionStorage.setItem("sophie_resume_session_id", item.id);
          localStorage.setItem("sophie_session_mode", "salespitch");
          location.href = "/talk";
          break;
        case "chat":
          sessionStorage.setItem("sophie_resume_chat", item.id);
          location.href = "/app";
          break;
      }
    }

    // ── Delete logic — uses Settings API (service role, bypasses RLS) ──
    async function deleteEntry(item) {
      try {
        const token = (await supabase.auth.getSession()).data?.session?.access_token;
        if (!token) { console.error("No auth token"); return; }
        const source = item.type === "meeting" ? "meeting" : "talk";
        const res = await fetch("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ action: "delete-report", session_id: item.id, source }),
        });
        if (!res.ok) console.error("Delete failed:", await res.text());
      } catch (e) {
        console.error("Delete failed:", e);
      }
    }

    // ── Load all ─────────────────────────────────
    async function loadAll() {
      const results = await Promise.all(
        TYPES.map(async (tp) => {
          const items = await fetchGroup(tp.key, 0);
          state[tp.key].items = items;
          state[tp.key].offset = items.length;
          if (items.length < PAGE_SIZE) state[tp.key].hasMore = false;
          return tp;
        })
      );

      content.innerHTML = "";

      let anyEntries = false;
      results.forEach(tp => {
        const group = renderGroup(tp);
        if (group && !group.classList.contains("empty")) {
          content.appendChild(group);
          anyEntries = true;
        }
      });

      if (!anyEntries) {
        content.innerHTML = `<div class="empty-state">${t("empty")}</div>`;
      }
    }

    loadAll();
  </script>
</body>

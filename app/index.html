<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://ohzfojsbmzinpxhcynpt.supabase.co" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f9f7f5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Sophie</title>

  <!-- Anti-flash: redirect anonymous users before anything renders -->
  <script>
    try {
      var s = localStorage.getItem("sb-ohzfojsbmzinpxhcynpt-auth-token");
      if (!s || !JSON.parse(s).access_token) { location.replace("/"); }
    } catch { location.replace("/"); }
  </script>

  <style>
    :root {
      --bg: #f9f7f5;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --line: rgba(0,0,0,.08);
      --accent-blue: #3f8cff;
      --shadow: 0 4px 24px rgba(0,0,0,.06);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.10);
      --radius: 18px;
      --max: 600px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      visibility: hidden;
    }
    body.ready { visibility: visible; }

    a { color: inherit; text-decoration: none; }

    .wrap { width: min(calc(100% - 32px), var(--max)); margin: 0 auto; }

    /* ── Header ─────────────────────────────────────────────── */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(16px);
      background: rgba(249,247,245,.85);
      border-bottom: 1px solid var(--line);
    }
    .app-header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--text);
    }
    .brand-icon {
      border-radius: 8px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Language Dropdown ───────────────────────────────────── */
    .lang-dropdown { position: relative; }
    .lang-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--card);
      cursor: pointer;
      line-height: 1;
      font-family: inherit;
      box-shadow: var(--shadow);
    }
    .lang-btn:hover {
      background: #f0eeec;
      border-color: rgba(0,0,0,.12);
    }
    .lang-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 150px;
      padding: 6px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-lg);
      display: none;
      z-index: 100;
    }
    .lang-menu.open { display: block; }
    .lang-menu button {
      width: 100%;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
    }
    .lang-menu button:hover { background: rgba(0,0,0,.04); }

    /* ── Profile Button ─────────────────────────────────────── */
    .profile-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--card);
      line-height: 1;
      font-family: inherit;
      box-shadow: var(--shadow);
    }
    .profile-btn:hover {
      background: #f0eeec;
    }

    /* ── Main Content ───────────────────────────────────────── */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 120px;
    }
    .app-content {
      width: 100%;
      max-width: var(--max);
    }

    /* ── Greeting ────────────────────────────────────────────── */
    .greeting {
      font-family: 'DM Sans', sans-serif;
      font-size: 26px;
      font-weight: 500;
      color: var(--text);
      margin: 0 0 28px;
      min-height: 38px;
    }
    .greeting .skeleton {
      display: inline-block;
      width: 240px;
      height: 26px;
      background: rgba(0,0,0,.06);
      border-radius: 8px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .4; }
      50% { opacity: .8; }
    }

    /* ── Primary CTA ─────────────────────────────────────────── */
    .cta-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 54px;
      padding: 0 32px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(180deg, #3f8cff 0%, #2167db 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
      box-shadow: 0 6px 20px rgba(33,103,219,.25);
      margin-bottom: 16px;
      touch-action: manipulation;
      user-select: none;
    }
    .cta-primary:hover {
      transform: translateY(-2px);
    }
    /* Mode colors — from landing page */
    .cta-primary.mode-brainstorm {
      background: linear-gradient(180deg, #f5c842 0%, #d4a017 100%);
      color: #1a1200;
      box-shadow: 0 6px 20px rgba(212,160,23,.25);
    }
    .cta-primary.mode-meeting {
      background: linear-gradient(180deg, #34c47a 0%, #1e9957 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(30,153,87,.25);
    }
    .cta-primary.mode-salespitch {
      background: linear-gradient(180deg, #ff5252 0%, #c62828 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(198,40,40,.25);
    }

    /* ── Mode Bar ────────────────────────────────────────────── */
    .mode-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .mode-pill {
      font-size: 13px;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
      letter-spacing: .01em;
      font-family: inherit;
      box-shadow: var(--shadow);
    }
    .mode-pill:hover {
      border-color: rgba(0,0,0,.15);
      color: var(--text);
    }
    /* Mode-specific active colors */
    .mode-pill[data-mode="brainstorm"].active {
      background: rgba(245,200,66,.12);
      border-color: rgba(245,200,66,.5);
      color: #b8860b;
    }
    .mode-pill[data-mode="meeting"].active {
      background: rgba(52,196,122,.10);
      border-color: rgba(52,196,122,.45);
      color: #1e9957;
    }
    .mode-pill[data-mode="salespitch"].active {
      background: rgba(255,82,82,.10);
      border-color: rgba(255,82,82,.45);
      color: #c62828;
    }

    /* ── Brainstorm Solo/Team Segment ────────────────────────── */
    .bs-pill-wrap {
      display: inline-flex;
      min-width: 114px;
      justify-content: center;
    }
    .bs-seg {
      display: inline-flex;
      border: 1px solid rgba(245,200,66,.45);
      border-radius: 20px;
      overflow: hidden;
      height: 32px;
      align-items: stretch;
      box-shadow: var(--shadow);
      background: var(--card);
    }
    .bs-seg-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 0 14px;
      cursor: pointer;
      transition: all .15s;
      position: relative;
    }
    .bs-seg-btn:first-child::after {
      content: "";
      position: absolute;
      right: 0;
      top: 20%;
      height: 60%;
      width: 1px;
      background: rgba(245,200,66,.25);
    }
    .bs-seg-btn:hover { color: var(--text); }
    .bs-seg-btn.active {
      background: rgba(245,200,66,.15);
      color: #b8860b;
    }
    /* ── Section Label ───────────────────────────────────────── */
    .section-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 10px;
    }

    /* ── Session Card ────────────────────────────────────────── */
    .session-card {
      border: 1.5px solid rgba(63,140,255,.25);
      border-radius: var(--radius);
      padding: 18px 20px;
      background: var(--card);
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .session-info {
      flex: 1;
      min-width: 0;
    }
    .session-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .session-meta .mode-icon { font-size: 14px; }
    .session-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-cta {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      padding: 9px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, #3f8cff 0%, #2167db 100%);
      cursor: pointer;
      font-family: inherit;
      transition: transform .15s;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(33,103,219,.20);
    }
    .session-cta:hover { transform: translateY(-1px); }
    .session-card.empty {
      text-align: center;
      padding: 28px 20px;
      justify-content: center;
      border-color: var(--line);
    }
    .session-card.empty .empty-text {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }
    .session-card .skeleton-line {
      height: 14px;
      background: rgba(0,0,0,.06);
      border-radius: 6px;
      animation: pulse 1.8s ease-in-out infinite;
      margin-bottom: 8px;
    }
    .session-card .skeleton-line:first-child { width: 40%; }
    .session-card .skeleton-line:nth-child(2) { width: 70%; }

    /* ── Secondary CTA ───────────────────────────────────────── */
    .cta-secondary {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
      box-shadow: var(--shadow);
    }
    .cta-secondary:hover {
      background: #f0eeec;
      color: var(--text);
      border-color: rgba(0,0,0,.12);
    }
    .cta-secondary .icon { font-size: 16px; }
    .cta-secondary .arrow { margin-left: auto; opacity: .4; }

    /* ── Bottom Nav ──────────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(249,247,245,.9);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav-inner {
      display: flex;
      justify-content: center;
      gap: 48px;
      padding: 8px 0;
      max-width: var(--max);
      margin: 0 auto;
    }
    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      padding: 4px 12px;
      transition: color .15s;
    }
    .nav-tab .tab-icon { font-size: 20px; }
    .nav-tab.active { color: var(--accent-blue); }
    .nav-tab:hover { color: var(--accent-blue); }
    .nav-tab.disabled {
      opacity: .35;
      cursor: default;
      pointer-events: none;
    }

    /* ── Chat Overlay ────────────────────────────────────────── */
    .chat-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 200;
      touch-action: none;
    }
    .chat-backdrop.open { display: block; }
    .chat-overlay {
      display: none;
      position: fixed;
      z-index: 210;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
      /* Desktop: centered card */
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      max-height: calc(100vh - 80px);
      min-height: 400px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.20);
    }
    .chat-overlay.open { display: flex; }
    body.chat-open { overflow: hidden; }

    .chat-overlay-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px 12px;
      background: #ffffff;
      border-bottom: 1px solid rgba(0,0,0,.08);
      flex-shrink: 0;
    }
    .chat-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(0,0,0,.03);
      color: #1a1a1a;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      font-family: inherit;
    }
    .chat-back:hover { background: rgba(0,0,0,.06); }
    .chat-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,.08);
      object-fit: cover;
    }
    .chat-header-name {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #ffffff;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .chat-msg { display: flex; flex-direction: column; max-width: 85%; }
    .chat-msg.sophie { align-self: flex-start; }
    .chat-msg.user { align-self: flex-end; }
    .chat-msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-msg.sophie .chat-msg-bubble {
      background: #f0f0f0;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }
    .chat-msg.user .chat-msg-bubble {
      background: linear-gradient(135deg, #4a5ebd, #5b4db8);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .chat-typing {
      align-self: flex-start;
      display: none;
      align-items: center;
      gap: 4px;
      padding: 8px 14px;
      background: #f0f0f0;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
    }
    .chat-typing.visible { display: flex; }
    .chat-typing span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(0,0,0,.3);
      animation: typingDot 1.4s infinite;
    }
    .chat-typing span:nth-child(2) { animation-delay: .2s; }
    .chat-typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes typingDot {
      0%, 60%, 100% { opacity: .3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    .chat-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 8px));
      background: #ffffff;
      border-top: 1px solid rgba(0,0,0,.08);
      flex-shrink: 0;
    }
    .chat-footer textarea {
      flex: 1;
      background: #f5f5f5;
      border: 1px solid rgba(0,0,0,.10);
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 16px;
      color: #1a1a1a;
      outline: none;
      resize: none;
      font-family: inherit;
      line-height: 1.4;
      min-height: 42px;
      max-height: 100px;
      overflow-y: auto;
    }
    .chat-footer textarea::placeholder { color: rgba(0,0,0,.40); }
    .chat-footer textarea:focus { border-color: rgba(90,77,184,.40); }
    .chat-send {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffffff 0%, #eef2f8 100%);
      border: none;
      color: #111827;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      flex-shrink: 0;
      transition: transform .15s;
    }
    .chat-send:hover:not(:disabled) { transform: translateY(-1px); }
    .chat-send:disabled { opacity: .35; cursor: not-allowed; }

    /* ── Mobile: chat fullscreen ─────────────────────────────── */
    @media (max-width: 640px) {
      .chat-overlay {
        top: 0; left: 0; right: 0; bottom: 0;
        transform: none;
        width: 100%; height: 100%;
        min-height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }
      .chat-backdrop.open { display: none; }
    }

    /* ── Desktop ─────────────────────────────────────────────── */
    @media (min-width: 641px) {
      .app-main { padding-top: 48px; }
      .greeting { font-size: 30px; }
      .bottom-nav { display: none; }
    }

    /* ── Mobile ──────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .app-header .wrap { min-height: 52px; }
      .greeting { font-size: 22px; margin-bottom: 22px; }
      .app-main { padding: 20px 16px 100px; }
    }
  </style>
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────── -->
  <header class="app-header">
    <div class="wrap">
      <a class="brand" href="/app">
        <img class="brand-icon" src="/apple-touch-icon.png" alt="" width="32" height="32" />
        SOPHIE
      </a>
      <div class="header-right">
        <div class="lang-dropdown">
          <button class="lang-btn" id="langToggle" aria-expanded="false" aria-haspopup="true">
            <span id="lang-label">EN</span>
          </button>
          <div class="lang-menu" id="langMenu">
            <button type="button" data-lang="en">&#127468;&#127463; English</button>
            <button type="button" data-lang="de">&#127465;&#127466; Deutsch</button>
            <button type="button" data-lang="fr">&#127467;&#127479; Fran&ccedil;ais</button>
          </div>
        </div>
        <a class="profile-btn" href="/settings/" id="profileBtn">...</a>
      </div>
    </div>
  </header>

  <!-- ── Main Content ────────────────────────────────────── -->
  <main class="app-main">
    <div class="app-content">

      <!-- Greeting -->
      <h1 class="greeting" id="greeting">
        <span class="skeleton"></span>
      </h1>

      <!-- Primary CTA -->
      <button class="cta-primary" id="startTalkBtn">
        <span id="ctaLabel" data-i18n="start_talk">Start a conversation</span>
        <span>&rarr;</span>
      </button>

      <!-- Mode Bar -->
      <div class="mode-bar" id="modeBar">
        <div class="bs-pill-wrap">
          <button class="mode-pill" data-mode="brainstorm" id="bsPillMain">Brainstorm</button>
          <div class="bs-seg" id="bsSeg" style="display:none">
            <button class="bs-seg-btn active" data-bs="solo">Solo</button>
            <button class="bs-seg-btn" data-bs="group">Team</button>
          </div>
        </div>
        <button class="mode-pill" data-mode="meeting">Meeting</button>
        <button class="mode-pill" data-mode="salespitch">Sales Pitch</button>
      </div>

      <!-- Last Session -->
      <p class="section-label" data-i18n="last_session_label">Last session</p>
      <div class="session-card" id="sessionCard">
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
      </div>

      <!-- Secondary: Chat -->
      <button class="cta-secondary" id="startChatBtn">
        <span class="icon">&#9998;</span>
        <span data-i18n="write_with_sophie">Write with Sophie</span>
        <span class="arrow">&rarr;</span>
      </button>

    </div>
  </main>

  <!-- ── Bottom Nav ──────────────────────────────────────── -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-tab active" data-tab="home">
        <span class="tab-icon">&#9679;</span>

      <button class="nav-tab disabled" data-tab="reports">

  <!-- ── Chat Overlay ─────────────────────────────────────── -->
  <div class="chat-backdrop" id="chatBackdrop"></div>
  <div class="chat-overlay" id="chatOverlay">
    <div class="chat-overlay-header">
      <button class="chat-back" id="chatCloseBtn">&lsaquo;</button>
      <picture>
        <source srcset="/sophie-480w.webp" type="image/webp">

      <div class="chat-header-name" id="chatHeaderLabel">Nachricht an Sophie</div>
    </div>

      <textarea id="chatInput" placeholder="Schreib eine Nachricht..." rows="1"></textarea>

  <!-- ── Script ──────────────────────────────────────────── -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    import { getSessionOrNull, redirectIfAnonymous } from "/lib/sophie-auth-helper.js";

    const SUPABASE_URL = "https://ohzfojsbmzinpxhcynpt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oemZvanNibXppbnB4aGN5bnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mzc1MjcsImV4cCI6MjA4NzAxMzUyN30.7eGSeEvOCj9vMqFJj9C0SR8DiiYygbFUvpQ8rIVEc0I";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentLang = localStorage.getItem("preferredLanguage") || "en";

    // ── i18n ──────────────────────────────────────────────
    const I18N = {
      en: {
        start_talk: "Talk to Sophie",
        write_with_sophie: "Write with Sophie...",
        last_session_label: "Last session",
        greeting: (name) => name ? `Welcome back, ${name}` : "Welcome back",
        no_session: "No session yet — Start your first conversation with Sophie",
        continue: "Continue",
        reopen: "Open again",
        nav_home: "Start",
        nav_reports: "Reports",
      },
      de: {
        start_talk: "Mit Sophie sprechen",
        write_with_sophie: "Mit Sophie schreiben...",
        last_session_label: "Letzte Session",
        greeting: (name) => name ? `Willkommen zurück, ${name}` : "Willkommen zurück",
        no_session: "Noch keine Session — Starte dein erstes Gespräch mit Sophie",
        continue: "Fortsetzen",
        reopen: "Erneut öffnen",
        nav_home: "Start",
        nav_reports: "Reports",
      },
      fr: {
        start_talk: "Parler avec Sophie",
        write_with_sophie: "Écrire avec Sophie...",
        last_session_label: "Dernière session",
        greeting: (name) => name ? `Bon retour, ${name}` : "Bon retour",
        no_session: "Pas encore de session — Démarre ta première conversation avec Sophie",
        continue: "Continuer",
        reopen: "Rouvrir",
        nav_home: "Accueil",
        nav_reports: "Rapports",
      }
    };

    // Mode-specific CTA labels (from landing page)
    const CTA_MODE_LABELS = {
      en: { brainstorm: "Start Brainstorming", meeting: "Start Meeting", salespitch: "Start Sales Pitch" },
      de: { brainstorm: "Brainstorming starten", meeting: "Meeting starten", salespitch: "Pitch starten" },
      fr: { brainstorm: "Lancer le brainstorming", meeting: "Lancer la réunion", salespitch: "Lancer le pitch" },
    };

    function t(key) {
      return (I18N[currentLang] || I18N.en)[key] || (I18N.en)[key] || key;
    }

    function applyI18n() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        const val = t(key);
        if (typeof val === "string") el.textContent = val;
      });
    }

    // ── Mode icons ───────────────────────────────────────
    const MODE_ICONS = {
      talk: "&#9679;",
      brainstorm: "&#10022;",
      meeting: "&#9673;",
      salespitch: "&#9650;",
    };
    const MODE_LABELS = {
      en: { talk: "Conversation", brainstorm: "Brainstorm", meeting: "Meeting", salespitch: "Sales Pitch" },
      de: { talk: "Gespräch", brainstorm: "Brainstorm", meeting: "Meeting", salespitch: "Sales Pitch" },
      fr: { talk: "Conversation", brainstorm: "Brainstorm", meeting: "Meeting", salespitch: "Sales Pitch" },
    };

    // ── Auth guard (authoritative) ───────────────────────
    const session = await getSessionOrNull(supabase);
    if (!session) { location.replace("/"); throw new Error("no session"); }
    // Auth confirmed — show the app
    document.body.classList.add("ready");

    // ── Profile button ───────────────────────────────────
    const profileBtn = document.getElementById("profileBtn");
    const userEmail = session.user?.email || "";
    profileBtn.textContent = userEmail.split("@")[0] || "Account";

    // ── Listen for auth changes ──────────────────────────
    supabase.auth.onAuthStateChange((event, sess) => {
      if (!sess?.access_token) { location.replace("/"); }
    });

    // ── Language dropdown ────────────────────────────────
    const langToggle = document.getElementById("langToggle");
    const langMenu = document.getElementById("langMenu");
    const langLabel = document.getElementById("lang-label");

    function updateLangLabel() {
      const labels = { en: "\u{1F1EC}\u{1F1E7} EN", de: "\u{1F1E9}\u{1F1EA} DE", fr: "\u{1F1EB}\u{1F1F7} FR" };
      langLabel.textContent = labels[currentLang] || "\u{1F1EC}\u{1F1E7} EN";
    }
    updateLangLabel();

    langToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      langMenu.classList.toggle("open");
      langToggle.setAttribute("aria-expanded", langMenu.classList.contains("open"));
    });
    document.addEventListener("click", () => {
      langMenu.classList.remove("open");
      langToggle.setAttribute("aria-expanded", "false");
    });
    langMenu.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        currentLang = btn.dataset.lang;
        localStorage.setItem("preferredLanguage", currentLang);
        updateLangLabel();
        applyI18n();
        langMenu.classList.remove("open");
        applyHeroMode(selectedMode); // refresh CTA label
        loadAndRender();
      });
    });

    // ── Mode bar + CTA sync ─────────────────────────────
    // Clear mode on return to /app — session already started, mode was consumed
    localStorage.removeItem("sophie_session_mode");
    let selectedMode = "";
    const modeBar = document.getElementById("modeBar");
    const ctaBtn = document.getElementById("startTalkBtn");
    const ctaLabel = document.getElementById("ctaLabel");

    const bsPillMain = document.getElementById("bsPillMain");
    const bsSeg = document.getElementById("bsSeg");

    function applyHeroMode(mode) {
      // Update CTA button class + text
      ctaBtn.classList.remove("mode-brainstorm", "mode-meeting", "mode-salespitch");
      if (mode) ctaBtn.classList.add("mode-" + mode);
      const labels = CTA_MODE_LABELS[currentLang] || CTA_MODE_LABELS.en;
      ctaLabel.textContent = mode ? (labels[mode] || t("start_talk")) : t("start_talk");

      // Update pills
      modeBar.querySelectorAll(".mode-pill").forEach(pill => {
        pill.classList.toggle("active", pill.dataset.mode === mode);
      });

      // Brainstorm Solo/Team toggle
      if (mode === "brainstorm") {
        bsPillMain.style.display = "none";
        bsSeg.style.display = "inline-flex";
      } else {
        bsPillMain.style.display = "";
        bsSeg.style.display = "none";
      }
    }

    // Solo/Team segment clicks
    function deselectMode() {
      selectedMode = "";
      localStorage.removeItem("sophie_session_mode");
      applyHeroMode(selectedMode);
    }

    bsSeg.addEventListener("click", (e) => {
      const btn = e.target.closest(".bs-seg-btn");
      if (!btn) return;
      bsSeg.querySelectorAll(".bs-seg-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      localStorage.setItem("sophie_brainstorm_type", btn.dataset.bs);
    });
    applyHeroMode(selectedMode);

    modeBar.addEventListener("click", (e) => {
      // Handle segment button clicks (don't treat as pill)
      if (e.target.closest(".bs-seg-btn")) return;
      const pill = e.target.closest(".mode-pill");
      if (!pill) return;
      const mode = pill.dataset.mode;
      if (selectedMode === mode) {
        selectedMode = "";
        localStorage.removeItem("sophie_session_mode");
      } else {
        selectedMode = mode;
        localStorage.setItem("sophie_session_mode", mode);
      }
      applyHeroMode(selectedMode);
    });

    // ── Click outside pills → deselect mode (1:1 landing page) ──
    document.addEventListener("click", (e) => {
      if (!selectedMode) return;
      if (e.target.closest("#modeBar") || e.target.closest("#startTalkBtn") || e.target.closest("#chatOverlay")) return;
      deselectMode();
    });

    // ── Navigation ───────────────────────────────────────
    ctaBtn.addEventListener("click", () => {
      if (selectedMode === "meeting") {
        location.href = "/meeting/";
      } else {
        if (selectedMode) localStorage.setItem("sophie_session_mode", selectedMode);
        location.href = "/talk";
      }
    });

    document.getElementById("startChatBtn").addEventListener("click", () => {
      openChat();
    });

    // ── Chat Overlay ─────────────────────────────────────
    const chatOverlay = document.getElementById("chatOverlay");
    const chatBackdrop = document.getElementById("chatBackdrop");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const chatSendBtn = document.getElementById("chatSendBtn");
    const chatTyping = document.getElementById("chatTyping");
    const chatHeaderLabel = document.getElementById("chatHeaderLabel");

    const CHAT_HEADER_LABELS = {
      en: "Message to Sophie",
      de: "Nachricht an Sophie",
      fr: "Message à Sophie",
    };
    const CHAT_PLACEHOLDERS = {
      en: "Write a message...",
      de: "Schreib eine Nachricht...",
      fr: "Écris un message...",
    };

    let chatHistory = [];
    let chatSessionId = null;
    let chatSending = false;

    function openChat() {
      chatOverlay.classList.add("open");
      chatBackdrop.classList.add("open");
      document.body.classList.add("chat-open");
      chatHeaderLabel.textContent = CHAT_HEADER_LABELS[currentLang] || CHAT_HEADER_LABELS.en;
      chatInput.placeholder = CHAT_PLACEHOLDERS[currentLang] || CHAT_PLACEHOLDERS.en;
      setTimeout(() => chatInput.focus(), 200);
    }

    function closeChat() {
      chatOverlay.classList.remove("open");
      chatBackdrop.classList.remove("open");
      document.body.classList.remove("chat-open");
    }

    document.getElementById("chatCloseBtn").addEventListener("click", closeChat);
    chatBackdrop.addEventListener("click", closeChat);

    // Auto-resize textarea
    chatInput.addEventListener("input", () => {
      chatInput.style.height = "auto";
      chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + "px";
    });

    // Send on Enter (not Shift+Enter)
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    chatSendBtn.addEventListener("click", sendMessage);

    function appendBubble(role, text) {
      const wrap = document.createElement("div");
      wrap.className = `chat-msg ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "chat-msg-bubble";
      bubble.textContent = text || "";
      wrap.appendChild(bubble);
      chatMessages.appendChild(wrap);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return bubble;
    }

    async function getToken() {
      const { data: { session: s } } = await supabase.auth.getSession();
      return s?.access_token || null;
    }

    async function startChatSession() {
      if (chatSessionId) return;
      const token = await getToken();
      const headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = `Bearer ${token}`;
      const res = await fetch("/api/chat?action=start", {
        method: "POST",
        headers,
        body: JSON.stringify({ language: currentLang }),
      });
      if (!res.ok) throw new Error("Failed to start session");
      const data = await res.json();
      chatSessionId = data.session_id;
      // Show Sophie's opener if present
      if (data.opener) {
        appendBubble("sophie", data.opener);
        chatHistory.push({ role: "assistant", content: data.opener });
      }
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || chatSending) return;
      chatSending = true;
      chatSendBtn.disabled = true;

      // Show user bubble
      appendBubble("user", text);
      chatHistory.push({ role: "user", content: text });
      chatInput.value = "";
      chatInput.style.height = "auto";

      // Show typing
      chatTyping.classList.add("visible");
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        // Ensure session exists
        await startChatSession();

        const token = await getToken();
        const headers = { "Content-Type": "application/json" };
        if (token) headers["Authorization"] = `Bearer ${token}`;

        const res = await fetch("/api/chat?action=message&stream=1", {
          method: "POST",
          headers,
          body: JSON.stringify({
            session_id: chatSessionId,
            messages: chatHistory.slice(-20),
            language: currentLang,
          }),
        });

        if (!res.ok) throw new Error("Chat request failed");

        // Parse SSE stream
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let result = null;

        function processEvents() {
          let boundary;
          while ((boundary = buffer.indexOf("\n\n")) !== -1) {
            const block = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            if (!block.trim()) continue;
            let eventType = "message", data = "";
            for (const line of block.split("\n")) {
              if (line.startsWith("event: ")) eventType = line.slice(7).trim();
              else if (line.startsWith("data: ")) data += line.slice(6);
            }
            if (!data) continue;
            try {
              const parsed = JSON.parse(data);
              if (eventType === "done") result = parsed;
            } catch {}
          }
        }

        await new Promise((resolve, reject) => {
          function pump() {
            reader.read().then(({ done, value }) => {
              if (done) {
                if (buffer.trim()) { buffer += "\n\n"; processEvents(); }
                resolve();
                return;
              }
              buffer += decoder.decode(value, { stream: true });
              processEvents();
              pump();
            }).catch(reject);
          }
          pump();
        });

        chatTyping.classList.remove("visible");

        if (result?.reply) {
          appendBubble("sophie", result.reply);
          chatHistory.push({ role: "assistant", content: result.reply });
          if (result.session_id) chatSessionId = result.session_id;
        }
      } catch (err) {
        chatTyping.classList.remove("visible");
        appendBubble("sophie", "Sorry, something went wrong. Please try again.");
      }

      chatSending = false;
      chatSendBtn.disabled = false;
      chatInput.focus();
    }

    // ── Load profile + last session ──────────────────────
    async function loadAndRender() {
      const userId = session.user.id;

      // Greeting
      const greetingEl = document.getElementById("greeting");
      try {
        const { data: profile } = await supabase
          .from("user_profile")
          .select("first_name, preferred_name, preferred_language")
          .eq("user_id", userId)
          .maybeSingle();

        const name = profile?.preferred_name || profile?.first_name || "";
        greetingEl.textContent = t("greeting")(name);

        // Use profile language if set and user hasn't explicitly chosen one
        if (profile?.preferred_language && !localStorage.getItem("preferredLanguage")) {
          currentLang = profile.preferred_language;
          localStorage.setItem("preferredLanguage", currentLang);
          updateLangLabel();
          applyI18n();
          applyHeroMode(selectedMode);
        }
      } catch {
        greetingEl.textContent = t("greeting")("");
      }

      // Last session
      const sessionCard = document.getElementById("sessionCard");
      try {
        const { data: lastSession } = await supabase
          .from("user_sessions")
          .select("id, title, session_mode, status, started_at, short_summary")
          .eq("user_id", userId)
          .order("started_at", { ascending: false })
          .limit(1)
          .maybeSingle();
        if (lastSession) {
          const mode = lastSession.session_mode || "talk";
          const modeLabel = (MODE_LABELS[currentLang] || MODE_LABELS.en)[mode] || mode;
          const icon = MODE_ICONS[mode] || MODE_ICONS.talk;
          const title = lastSession.title || modeLabel;
          const continuable = ["paused", "draft", "open"].includes(lastSession.status);

          sessionCard.classList.remove("empty");
          sessionCard.innerHTML = `
            <div class="session-info">
              <div class="session-meta">
                <span class="mode-icon">${icon}</span>
                <span>${modeLabel}</span>
              </div>
              <p class="session-title">${escHtml(title)}</p>
            </div>
            ${continuable
              ? `<button class="session-cta" data-session-id="${lastSession.id}">${t("continue")}</button>`
              : `<button class="session-cta" data-session-id="${lastSession.id}">${t("reopen")}</button>`
            }
          `;

          sessionCard.querySelector(".session-cta")?.addEventListener("click", () => {
            if (mode === "meeting") {
              location.href = "/meeting/";
            } else {
              if (mode && mode !== "talk") localStorage.setItem("sophie_session_mode", mode);
              location.href = "/talk";
            }
          });
        } else {
          sessionCard.classList.add("empty");
          sessionCard.innerHTML = `<p class="empty-text">${t("no_session")}</p>`;
        }
      } catch {
        sessionCard.classList.add("empty");
        sessionCard.innerHTML = `<p class="empty-text">${t("no_session")}</p>`;
      }

      applyI18n();
    }

    function escHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    loadAndRender();
  </script>

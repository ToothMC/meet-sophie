<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/app/sophie-apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/app/sophie-favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/app/sophie-favicon-16x16.png" />
  <link rel="icon" href="/app/sophie-favicon.ico" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://ohzfojsbmzinpxhcynpt.supabase.co" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Sophie</title>

  <!-- Anti-flash: redirect anonymous users before anything renders -->
  <script>
    try {
      var s = localStorage.getItem("sb-ohzfojsbmzinpxhcynpt-auth-token");
      if (!s || !JSON.parse(s).access_token) {
        localStorage.removeItem("sb-ohzfojsbmzinpxhcynpt-auth-token");
        location.replace("/");
      }
    } catch {
      localStorage.removeItem("sb-ohzfojsbmzinpxhcynpt-auth-token");
      location.replace("/");
    }
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --line: rgba(0,0,0,.08);
      --accent-blue: #3f8cff;
      --shadow: 0 4px 24px rgba(0,0,0,.06);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.10);
      --radius: 18px;
      --max: 600px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      visibility: hidden;
    }
    body.ready { visibility: visible; }

    /* ── Locked-State Overlay (no active subscription) ──── */
    .locked-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      justify-content: center; align-items: center;
      padding: 24px;
    }
    .locked-overlay.active { display: flex; }
    .locked-card {
      background: #fff; border-radius: 20px; padding: 40px 32px;
      max-width: 420px; width: 100%; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .locked-card .locked-avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px; }
    .locked-card h2 { font-size: 22px; margin: 0 0 12px; color: #1a1a2e; }
    .locked-card p { font-size: 15px; color: #555; margin: 0 0 24px; line-height: 1.5; }
    .locked-card .locked-cta {
      display: inline-block; background: #7c3aed; color: #fff;
      padding: 14px 32px; border-radius: 12px; font-size: 16px; font-weight: 600;
      text-decoration: none; transition: background .2s;
    }
    .locked-card .locked-cta:hover { background: #6d28d9; }
    .locked-card .locked-sub { display: block; margin-top: 12px; font-size: 13px; color: #888; }

    a { color: inherit; text-decoration: none; }

    .wrap { width: min(calc(100% - 32px), var(--max)); margin: 0 auto; }

    /* ── Header ─────────────────────────────────────────────── */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(16px);
      background: rgba(235,233,230,.75);
      border-bottom: 1px solid rgba(0,0,0,.06);
    }
    .app-header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--text);
    }
    .brand-icon {
      border-radius: 8px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Language Dropdown ───────────────────────────────────── */
    .lang-dropdown { position: relative; }
    .lang-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--card);
      cursor: pointer;
      line-height: 1;
      font-family: inherit;
      box-shadow: var(--shadow);
    }
    .lang-btn:hover {
      background: #f0eeec;
      border-color: rgba(0,0,0,.12);
    }
    .lang-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 150px;
      padding: 6px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-lg);
      display: none;
      z-index: 100;
    }
    .lang-menu.open { display: block; }
    .lang-menu button {
      width: 100%;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
    }
    .lang-menu button:hover { background: rgba(0,0,0,.04); }

    /* ── Profile Button ─────────────────────────────────────── */
    .profile-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--card);
      line-height: 1;
      font-family: inherit;
      box-shadow: var(--shadow);
    }
    .profile-btn:hover {
      background: #f0eeec;
    }

    /* ── Main Content ───────────────────────────────────────── */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 120px;
    }
    .app-content {
      width: 100%;
      max-width: var(--max);
    }

    /* ── Greeting ────────────────────────────────────────────── */
    .greeting {
      font-family: 'DM Sans', sans-serif;
      font-size: 26px;
      font-weight: 500;
      color: var(--text);
      margin: 0 0 28px;
      min-height: 38px;
    }
    .greeting .skeleton {
      display: inline-block;
      width: 240px;
      height: 26px;
      background: rgba(0,0,0,.06);
      border-radius: 8px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .4; }
      50% { opacity: .8; }
    }

    /* ── Primary CTA ─────────────────────────────────────────── */
    .cta-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 54px;
      padding: 0 32px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(180deg, #3f8cff 0%, #2167db 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
      box-shadow: 0 6px 20px rgba(33,103,219,.25);
      margin-bottom: 16px;
      touch-action: manipulation;
      user-select: none;
    }
    .cta-primary:hover {
      transform: translateY(-2px);
    }
    /* Mode colors — from landing page */
    .cta-primary.mode-brainstorm {
      background: linear-gradient(180deg, #f5c842 0%, #d4a017 100%);
      color: #1a1200;
      box-shadow: 0 6px 20px rgba(212,160,23,.25);
    }
    .cta-primary.mode-meeting {
      background: linear-gradient(180deg, #34c47a 0%, #1e9957 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(30,153,87,.25);
    }
    .cta-primary.mode-salespitch {
      background: linear-gradient(180deg, #ff5252 0%, #c62828 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(198,40,40,.25);
    }

    /* ── Mode Bar ────────────────────────────────────────────── */
    .mode-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .mode-pill {
      font-size: 13px;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
      letter-spacing: .01em;
      font-family: inherit;
      box-shadow: var(--shadow);
    }
    .mode-pill:hover {
      border-color: rgba(0,0,0,.15);
      color: var(--text);
    }
    /* Mode-specific active colors */
    .mode-pill[data-mode="brainstorm"].active {
      background: rgba(245,200,66,.12);
      border-color: rgba(245,200,66,.5);
      color: #b8860b;
    }
    .mode-pill[data-mode="meeting"].active {
      background: rgba(52,196,122,.10);
      border-color: rgba(52,196,122,.45);
      color: #1e9957;
    }
    .mode-pill[data-mode="salespitch"].active {
      background: rgba(255,82,82,.10);
      border-color: rgba(255,82,82,.45);
      color: #c62828;
    }

    /* ── Brainstorm Solo/Team Segment ────────────────────────── */
    .bs-pill-wrap {
      display: inline-flex;
      min-width: 114px;
      justify-content: center;
    }
    .bs-seg {
      display: inline-flex;
      border: 1px solid rgba(245,200,66,.45);
      border-radius: 20px;
      overflow: hidden;
      height: 32px;
      align-items: stretch;
      box-shadow: var(--shadow);
      background: var(--card);
    }
    .bs-seg-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 0 14px;
      cursor: pointer;
      transition: all .15s;
      position: relative;
    }
    .bs-seg-btn:first-child::after {
      content: "";
      position: absolute;
      right: 0;
      top: 20%;
      height: 60%;
      width: 1px;
      background: rgba(245,200,66,.25);
    }
    .bs-seg-btn:hover { color: var(--text); }
    .bs-seg-btn.active {
      background: rgba(245,200,66,.15);
      color: #b8860b;
    }
    /* ── Section Label ───────────────────────────────────────── */
    .section-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 10px;
    }

    /* ── Session Card ────────────────────────────────────────── */
    .session-card {
      border: 1.5px solid rgba(63,140,255,.25);
      border-radius: var(--radius);
      padding: 18px 20px;
      background: var(--card);
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .session-info {
      flex: 1;
      min-width: 0;
    }
    .session-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .session-meta .mode-icon { font-size: 14px; }
    .session-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-cta {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      padding: 9px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, #3f8cff 0%, #2167db 100%);
      cursor: pointer;
      font-family: inherit;
      transition: transform .15s;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(33,103,219,.20);
    }
    .session-cta:hover { transform: translateY(-1px); }
    .session-card.empty {
      text-align: center;
      padding: 28px 20px;
      justify-content: center;
      border-color: var(--line);
    }
    .session-card.empty .empty-text {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }
    .session-card .skeleton-line {
      height: 14px;
      background: rgba(0,0,0,.06);
      border-radius: 6px;
      animation: pulse 1.8s ease-in-out infinite;
      margin-bottom: 8px;
    }
    .session-card .skeleton-line:first-child { width: 40%; }
    .session-card .skeleton-line:nth-child(2) { width: 70%; }

    /* ── Secondary CTA ───────────────────────────────────────── */
    .cta-secondary {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
      box-shadow: var(--shadow);
    }
    .cta-secondary:hover {
      background: #f0eeec;
      color: var(--text);
      border-color: rgba(0,0,0,.12);
    }
    .cta-secondary .icon { font-size: 16px; }
    .cta-secondary .arrow { margin-left: auto; opacity: .4; }

    /* ── Bottom Nav ──────────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(235,233,230,.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(0,0,0,.06);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav-inner {
      display: flex;
      justify-content: center;
      gap: 48px;
      padding: 8px 0;
      max-width: var(--max);
      margin: 0 auto;
    }
    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      padding: 4px 12px;
      transition: color .15s;
    }
    .nav-tab .tab-icon { font-size: 20px; }
    .nav-tab.active { color: var(--accent-blue); }
    .nav-tab:hover { color: var(--accent-blue); }
    .nav-tab.disabled {
      opacity: .35;
      cursor: default;
      pointer-events: none;
    }

    /* ── Chat Overlay ────────────────────────────────────────── */
    .chat-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 200;
      touch-action: none;
    }
    .chat-backdrop.open { display: block; }
    .chat-overlay {
      display: none;
      position: fixed;
      z-index: 210;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
      /* Desktop: centered card */
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      max-height: calc(100vh - 80px);
      min-height: 400px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.20);
    }
    .chat-overlay.open { display: flex; }
    body.chat-open { overflow: hidden; }

    .chat-overlay-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px 12px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      background: #ffffff;
      border-bottom: 1px solid rgba(0,0,0,.08);
      flex-shrink: 0;
    }
    .chat-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(0,0,0,.03);
      color: #1a1a1a;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      font-family: inherit;
    }
    .chat-back:hover { background: rgba(0,0,0,.06); }
    .chat-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,.08);
      object-fit: cover;
    }
    .chat-header-name {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #ffffff;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .chat-msg { display: flex; flex-direction: column; max-width: 85%; }
    .chat-msg.sophie { align-self: flex-start; }
    .chat-msg.user { align-self: flex-end; }
    .chat-msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-msg.sophie .chat-msg-bubble {
      background: #f0f0f0;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }
    .chat-msg.user .chat-msg-bubble {
      background: linear-gradient(135deg, #4a5ebd, #5b4db8);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .chat-typing {
      align-self: flex-start;
      display: none;
      align-items: center;
      gap: 4px;
      padding: 8px 14px;
      background: #f0f0f0;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
    }
    .chat-typing.visible { display: flex; }
    .chat-typing span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(0,0,0,.3);
      animation: typingDot 1.4s infinite;
    }
    .chat-typing span:nth-child(2) { animation-delay: .2s; }
    .chat-typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes typingDot {
      0%, 60%, 100% { opacity: .3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    .chat-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 8px));
      background: #ffffff;
      border-top: 1px solid rgba(0,0,0,.08);
      flex-shrink: 0;
    }
    .chat-footer textarea {
      flex: 1;
      background: #f5f5f5;
      border: 1px solid rgba(0,0,0,.10);
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 16px;
      color: #1a1a1a;
      outline: none;
      resize: none;
      font-family: inherit;
      line-height: 1.4;
      min-height: 42px;
      max-height: 100px;
      overflow-y: auto;
    }
    .chat-footer textarea::placeholder { color: rgba(0,0,0,.40); }
    .chat-footer textarea:focus { border-color: rgba(90,77,184,.40); }
    .chat-send {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffffff 0%, #eef2f8 100%);
      border: none;
      color: #111827;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      flex-shrink: 0;
      transition: transform .15s;
    }
    .chat-send:hover:not(:disabled) { transform: translateY(-1px); }
    .chat-send:disabled { opacity: .35; cursor: not-allowed; }

    .chat-upload-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: #f5f5f5; border: 1px solid rgba(0,0,0,.10);
      color: rgba(0,0,0,.45); font-size: 20px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .15s ease; font-family: inherit;
      line-height: 1; padding: 0;
    }
    .chat-upload-btn:hover { background: #ebebeb; color: rgba(0,0,0,.65); }
    .chat-file-preview {
      display: none; flex-wrap: wrap; gap: 6px;
      padding: 6px 12px 0; background: #fff;
    }
    .chat-file-chip {
      display: flex; align-items: center; gap: 6px;
      background: #f5f5f5; border-radius: 12px; padding: 4px 10px;
      font-size: 12px; color: #333;
    }
    .chat-file-chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 6px; }
    .chat-file-chip .remove {
      cursor: pointer; color: #999; font-size: 14px; margin-left: 2px;
    }
    .chat-file-chip .remove:hover { color: #e33; }

    /* ── Mobile: chat fullscreen ─────────────────────────────── */
    @media (max-width: 640px) {
      .chat-overlay {
        top: 0; left: 0; right: 0; bottom: 0;
        transform: none;
        width: 100%; height: 100%;
        min-height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }
      .chat-backdrop.open { display: none; }
    }

    /* ── Desktop ─────────────────────────────────────────────── */
    @media (min-width: 641px) {
      .app-main { padding-top: 48px; }
      .greeting { font-size: 30px; }
      .bottom-nav { max-width: var(--max); left: 50%; transform: translateX(-50%); border-radius: 18px 18px 0 0; }
    }

    const chatHeaderLabel = document.getElementById("chatHeaderLabel");

    document.getElementById("chatCloseBtn").addEventListener("click", closeChat);

    chatInput.addEventListener("input", () => {

    });
    chatSendBtn.addEventListener("click", sendMessage);

    chatUploadBtn.addEventListener("click", () => { chatFileInput.value = ""; chatFileInput.click(); });
    chatFileInput.addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []);
      for (const f of files) {
        if (chatPendingFiles.length >= CHAT_MAX_FILES) { alert(`Max ${CHAT_MAX_FILES} Dateien pro Nachricht.`); break; }
        const ext = (f.name.split(".").pop() || "").toLowerCase();
        if (!CHAT_ALLOWED_TYPES.has(f.type) && !CHAT_ALLOWED_EXT.has(ext)) { alert(`Dateityp nicht unterstützt: ${f.name}`); continue; }
        if (f.size > CHAT_MAX_FILE_SIZE) { alert(`Datei zu groß (max 5MB): ${f.name}`); continue; }
        let dataUrl = await chatReadFile(f);
        if (f.type.startsWith("image/")) dataUrl = await chatCompressImage(dataUrl, 512, 0.6);

      }
      chatRenderFilePreview();
    });

    function chatReadFile(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    function chatCompressImage(dataUrl, maxDim, quality) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            const scale = maxDim / Math.max(w, h);
            w = Math.round(w * scale); h = Math.round(h * scale);
          }
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

      if (!chatPendingFiles.length) { chatFilePreview.style.display = "none"; chatFilePreview.innerHTML = ""; return; }

    async function getToken() {
      const { data: { session: s } } = await supabase.auth.getSession();
      return s?.access_token || null;

    async function startChatSession() {
      if (chatSessionId) return;
      const token = await getToken();
      const headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = `Bearer ${token}`;
      const res = await fetch("/api/chat?action=start", {
        method: "POST",
        headers,
        body: JSON.stringify({ language: currentLang }),

      if (!res.ok) throw new Error("Failed to start session");
      const data = await res.json();
      chatSessionId = data.session_id;
      // Show Sophie's opener if present
      if (data.opener) {
        appendBubble("sophie", data.opener);
        chatHistory.push({ role: "assistant", content: data.opener });
      }
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      const hasFiles = chatPendingFiles.length > 0;
      if ((!text && !hasFiles) || chatSending) return;
      chatSending = true;
      chatSendBtn.disabled = true;

      // Show user bubble
      const bubbleText = hasFiles ? (text || chatPendingFiles.map(f => f.name).join(", ")) : text;
      appendBubble("user", bubbleText);
      const msgEntry = { role: "user", content: text || "" };
      if (hasFiles) msgEntry.files = [...chatPendingFiles];
      chatHistory.push(msgEntry);
      chatInput.value = "";
      chatInput.style.height = "auto";
      chatPendingFiles = [];
      chatRenderFilePreview();

      // Show typing
      chatTyping.classList.add("visible");
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        // Ensure session exists
        await startChatSession();

        const token = await getToken();
        const headers = { "Content-Type": "application/json" };
        if (token) headers["Authorization"] = `Bearer ${token}`;

        const res = await fetch("/api/chat?action=message&stream=1", {
          method: "POST",
          headers,
          body: JSON.stringify({
            session_id: chatSessionId,
            messages: chatHistory.slice(-20),
            language: currentLang,
          }),
        });

        if (!res.ok) throw new Error("Chat request failed");

        // Parse SSE stream
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let result = null;

        function processEvents() {
          let boundary;
          while ((boundary = buffer.indexOf("\n\n")) !== -1) {
            const block = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            if (!block.trim()) continue;
            let eventType = "message", data = "";
            for (const line of block.split("\n")) {
              if (line.startsWith("event: ")) eventType = line.slice(7).trim();
              else if (line.startsWith("data: ")) data += line.slice(6);
            }
            if (!data) continue;
            try {
              const parsed = JSON.parse(data);
              if (eventType === "done") result = parsed;
            } catch {}
          }
        }

        await new Promise((resolve, reject) => {
          function pump() {
            reader.read().then(({ done, value }) => {
              if (done) {
                if (buffer.trim()) { buffer += "\n\n"; processEvents(); }
                resolve();
                return;
              }
              buffer += decoder.decode(value, { stream: true });
              processEvents();
              pump();
            }).catch(reject);
          }
          pump();
        });

        chatTyping.classList.remove("visible");

        if (result?.reply) {
          appendBubble("sophie", result.reply);
          chatHistory.push({ role: "assistant", content: result.reply });
          if (result.session_id) chatSessionId = result.session_id;
          // Messages now persisted server-side via RPC in /api/chat
        }
      } catch (err) {
        chatTyping.classList.remove("visible");
        appendBubble("sophie", "Sorry, something went wrong. Please try again.");
      }

      chatSending = false;
      chatSendBtn.disabled = false;
      chatInput.focus();
    }

    // ── Load profile + last session ──────────────────────
    async function loadAndRender() {
      const userId = session.user.id;

      // Greeting
      const greetingEl = document.getElementById("greeting");
      try {
        const { data: profile } = await supabase
          .from("user_profile")
          .select("first_name, preferred_name, preferred_language")
          .eq("user_id", userId)
          .maybeSingle();

        const name = profile?.preferred_name || profile?.first_name || "";
        greetingEl.textContent = t("greeting")(name);

        // Use profile language if set and user hasn't explicitly chosen one
        if (profile?.preferred_language && !localStorage.getItem("preferredLanguage")) {
          currentLang = profile.preferred_language;
          localStorage.setItem("preferredLanguage", currentLang);
          updateLangLabel();
          applyI18n();
          applyHeroMode(selectedMode);
        }
      } catch {
        greetingEl.textContent = t("greeting")("");
      }

      // Last session — check both user_sessions AND meetings, show newest
      const sessionCard = document.getElementById("sessionCard");
      try {
        // Fetch last activity from all sources
        const [sessRes, chatRes, meetRes] = await Promise.all([
          // Last talk/brainstorm/pitch with report
          supabase.from("user_sessions")
            .select("id, title, session_type, status, started_at, last_message_at, session_date, conversation_outputs(title)")
            .eq("user_id", userId)
            .in("session_type", ["talk", "brainstorm", "sales_pitch"])
            .eq("has_output", true)
            .not("started_at", "is", null)
            .order("started_at", { ascending: false })
            .limit(1)
            .maybeSingle(),
          // Last chat session
          supabase.from("user_sessions")
            .select("id, title, session_type, status, started_at, last_message_at")
            .eq("user_id", userId)
            .eq("session_type", "chat")
            .gt("turn_count", 0)
            .order("last_message_at", { ascending: false })
            .limit(1)
            .maybeSingle(),
          // Last meeting
          supabase.from("meetings")
            .select("id, title, meeting_type, phase, started_at")
            .eq("user_id", userId)
            .order("started_at", { ascending: false })
            .limit(1)
            .maybeSingle(),
        ]);

        // Pick the most recent across all sources
        const candidates = [
          sessRes.data && { ...sessRes.data, _src: "session" },
          chatRes.data && { ...chatRes.data, _src: "chat" },
          meetRes.data && { ...meetRes.data, _src: "meeting", started_at: meetRes.data.started_at },
        ].filter(Boolean);

        const entry = candidates.sort((a, b) =>
          new Date(b.last_message_at || b.started_at || b.session_date || 0) - new Date(a.last_message_at || a.started_at || a.session_date || 0)
        )[0] || null;

        if (entry) {
          const isMeeting = entry._src === "meeting";
          const isChat = entry._src === "chat";
          const mode = isMeeting ? "meeting" : (entry.session_type || "talk");
          const modeLabel = (MODE_LABELS[currentLang] || MODE_LABELS.en)[mode] || mode;
          const icon = MODE_ICONS[mode] || MODE_ICONS.talk;
          const co = Array.isArray(entry.conversation_outputs) ? entry.conversation_outputs[0] : entry.conversation_outputs;
          const title = co?.title || entry.title || modeLabel;
          const continuable = isMeeting
            ? ["prep", "live"].includes(entry.phase)
            : ["active", "paused"].includes(entry.status);

          sessionCard.classList.remove("empty");
          sessionCard.innerHTML = `
            <div class="session-info">
              <div class="session-meta">
                <span class="mode-icon">${icon}</span>
                <span>${modeLabel}</span>
              </div>
              <p class="session-title">${escHtml(title)}</p>
            </div>
            ${continuable
              ? `<button class="session-cta" data-session-id="${entry.id}">${t("continue")}</button>`
              : `<button class="session-cta" data-session-id="${entry.id}">${t("reopen")}</button>`
            }
          `;

          sessionCard.querySelector(".session-cta")?.addEventListener("click", () => {
            if (isMeeting) {
              location.href = `/meeting/?id=${entry.id}`;
            } else if (isChat) {
              chatSessionId = entry.id;
              openChat();
              (async () => {
                try {
                  const { data: msgs } = await supabase.from("conversation_messages")
                    .select("role, text").eq("session_id", entry.id).order("seq", { ascending: true });
                  if (msgs?.length) {
                    msgs.forEach(m => {
                      appendBubble(m.role === "user" ? "user" : "sophie", m.text);
                      chatHistory.push({ role: m.role === "user" ? "user" : "assistant", content: m.text });
                    });
                  }
                } catch {}
              })();
            } else {
              if (mode === "sales_pitch") localStorage.setItem("sophie_session_mode", "salespitch");
              else if (mode && mode !== "talk") localStorage.setItem("sophie_session_mode", mode);
              location.href = "/talk";
            }
          });
        } else {
          sessionCard.classList.add("empty");
          sessionCard.innerHTML = `<p class="empty-text">${t("no_session")}</p>`;
        }
      } catch {
        sessionCard.classList.add("empty");
        sessionCard.innerHTML = `<p class="empty-text">${t("no_session")}</p>`;
      }

      applyI18n();
    }

    function escHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    loadAndRender();

    // ── Resume chat from Reports page ────────────
    const resumeChatId = sessionStorage.getItem("sophie_resume_chat");
    if (resumeChatId) {
      sessionStorage.removeItem("sophie_resume_chat");
      chatSessionId = resumeChatId;
      openChat();
      // Load messages from DB (conversation_messages)
      (async () => {
        try {
          const { data: msgs } = await supabase
            .from("conversation_messages")
            .select("role, text")
            .eq("session_id", resumeChatId)
            .order("seq", { ascending: true });
          if (msgs && msgs.length > 0) {
            msgs.forEach(m => {
              appendBubble(m.role === "user" ? "user" : "sophie", m.text);
              chatHistory.push({ role: m.role === "user" ? "user" : "assistant", content: m.text });
            });
          }
        } catch {}
      })();
    }
  </script>
</body>

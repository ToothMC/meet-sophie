<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meet Sophie – Signing in</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0f14;
      color: white;
      text-align: center;
      padding: 24px;
    }

    .box {
      max-width: 460px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      margin: 0;
      opacity: .8;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Signing you in…</h2>
    <p id="status">Please wait a moment.</p>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://ohzfojsbmzinpxhcynpt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oemZvanNibXppbnB4aGN5bnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mzc1MjcsImV4cCI6MjA4NzAxMzUyN30.7eGSeEvOCj9vMqFJj9C0SR8DiiYygbFUvpQ8rIVEc0I";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById("status");
    let handled = false;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    async function finishAuth() {
      if (handled) return;
      handled = true;

      const { data: { user } } = await supabase.auth.getUser();

      if (!user) {
        setStatus("Login could not be completed.");
        setTimeout(() => {
          window.location.href = "/login-dev";
        }, 1500);
        return;
      }

      setStatus("Signed in! Closing this tab…");
      history.replaceState(null, "", window.location.pathname + window.location.search);

      // Notify the login tab via BroadcastChannel so it can navigate to /talk-dev.
      // Then close this callback tab.
      // If window.close() is blocked AND no login tab was listening (e.g. link
      // opened in a fresh browser), fall back to navigating here after 1 s.
      const bc = new BroadcastChannel("sophie_auth");
      let acked = false;
      bc.onmessage = (e) => { if (e.data === "ACK") acked = true; };
      bc.postMessage("AUTH_SUCCESS");
      window.close();
      setTimeout(() => {
        bc.close();
        if (!acked) window.location.href = "/talk-dev";
      }, 1000);
    }

    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
      await finishAuth();
    }

    supabase.auth.onAuthStateChange(async (event, session) => {
     if (event === "SIGNED_IN" && session?.user) {
      await finishAuth();
  }
});

    setTimeout(async () => {
      if (handled) return;

      const { data: { session: delayedSession } } = await supabase.auth.getSession();
      if (delayedSession?.user) {
        await finishAuth();
        return;
      }

      setStatus("Login could not be completed.");
      setTimeout(() => {
        window.location.href = "/login-dev";
      }, 1500);
    }, 3000);
  </script>
</body>
</html>

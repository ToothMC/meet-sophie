<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sophie</title>
  <style>
    body { margin:0; background:#0b0f14; }
  </style>
</head>
<body>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://ohzfojsbmzinpxhcynpt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oemZvanNibXppbnB4aGN5bnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mzc1MjcsImV4cCI6MjA4NzAxMzUyN30.7eGSeEvOCj9vMqFJj9C0SR8DiiYygbFUvpQ8rIVEc0I";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let done = false;

    // Read mode + language from URL params (passed via emailRedirectTo)
    const urlParams = new URLSearchParams(window.location.search);
    const detectedMode = urlParams.get("mode") || localStorage.getItem("sophie_detected_mode") || "";
    const lang = urlParams.get("lang") || localStorage.getItem("preferredLanguage") || "";
    if (lang && ["de", "en", "fr"].includes(lang)) {
      localStorage.setItem("preferredLanguage", lang);
    }

    // Build target path with mode
    function buildTarget(base) {
      if (detectedMode && detectedMode !== "talk") {
        // Meeting mode → dedicated meeting page
        if (detectedMode === "meeting") {
          localStorage.removeItem("sophie_session_mode");
          return "/meeting/";
        }
        // Map routing modes to session modes for /talk
        const SESSION_MAP = {
          brainstorm: "brainstorm", salespitch: "salespitch",
          explore: "", decide: "", reflect: "", relax: ""
        };
        const sessionMode = SESSION_MAP[detectedMode] !== undefined ? SESSION_MAP[detectedMode] : "";
        if (sessionMode) {
          localStorage.setItem("sophie_session_mode", sessionMode);
        }
        return base;
      }
      return base;
    }

    function go(path) {
      if (done) return;
      done = true;
      // Tell other Sophie tabs (login, landing) to close — only one window should remain
      try {
        const bc = new BroadcastChannel("sophie_auth");
        bc.postMessage({ type: "auth_complete", target: path });
        bc.close();
      } catch (_) {}
      window.location.replace(path);
    }

    // Determine default target: /talk only if a specific mode was selected (via "Mit Sophie sprechen")
    // Otherwise: landing page (user just logged in via "Einloggen")
    const defaultTarget = detectedMode ? "/talk" : "/";

    // PKCE exchange + session detection — redirect as soon as session is ready
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_IN" && session?.user) go(buildTarget(defaultTarget));
    });

    // Fallback after 3s
    setTimeout(async () => {
      const { data } = await supabase.auth.getSession();
      go(data.session?.user ? buildTarget(defaultTarget) : "/login");
    }, 3000);
  </script>
</body>
</html>

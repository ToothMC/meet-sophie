<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sophie</title>
  <style>
    body { margin:0; background:#0b0f14; color:#e8e0d8; font-family:-apple-system,BlinkMacSystemFont,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .close-hint { text-align:center; padding:24px; max-width:320px; }
    .close-hint h2 { font-size:18px; margin:0 0 8px; }
    .close-hint p { font-size:14px; opacity:0.7; margin:0; }
  </style>
</head>
<body>
  <div class="close-hint" id="closeHint" style="display:none">
    <h2 id="hintTitle">Du bist eingeloggt!</h2>
    <p id="hintText">Du kannst diesen Tab jetzt schließen.</p>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://ohzfojsbmzinpxhcynpt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oemZvanNibXppbnB4aGN5bnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mzc1MjcsImV4cCI6MjA4NzAxMzUyN30.7eGSeEvOCj9vMqFJj9C0SR8DiiYygbFUvpQ8rIVEc0I";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let done = false;

    // Read mode + language from URL params (passed via emailRedirectTo)
    const urlParams = new URLSearchParams(window.location.search);
    // ONLY use URL param — localStorage may have stale mode from previous session
    const detectedMode = urlParams.get("mode") || "";
    const lang = urlParams.get("lang") || localStorage.getItem("preferredLanguage") || "";
    if (lang && ["de", "en", "fr"].includes(lang)) {
      localStorage.setItem("preferredLanguage", lang);
    }

    // Build target path with mode
    function buildTarget(base) {
      if (detectedMode && detectedMode !== "talk") {
        // Meeting mode → dedicated meeting page
        if (detectedMode === "meeting") {
          localStorage.removeItem("sophie_session_mode");
          return "/meeting/";
        }
        // Map routing modes to session modes for /talk
        const SESSION_MAP = {
          brainstorm: "brainstorm", salespitch: "salespitch",
          explore: "", decide: "", reflect: "", chill: ""
        };
        const sessionMode = SESSION_MAP[detectedMode] !== undefined ? SESSION_MAP[detectedMode] : "";
        if (sessionMode) {
          localStorage.setItem("sophie_session_mode", sessionMode);
        }
        return base;
      }
      return base;
    }

    function go(path) {
      if (done) return;
      done = true;

      // Try to hand off to original tab via BroadcastChannel
      let handedOff = false;
      try {
        const bc = new BroadcastChannel("sophie_auth");
        bc.postMessage({ type: "auth_complete", target: path });
        bc.close();
        handedOff = true;
      } catch (_) {}

      if (handedOff) {
        // Original tab will navigate — THIS tab should close or show hint
        try { window.close(); } catch (_) {}
        // window.close() doesn't work on mobile Safari for email-opened tabs
        // Show "close this tab" hint + auto-redirect after 3s as last resort
        const hint = document.getElementById("closeHint");
        if (lang === "en") {
          document.getElementById("hintTitle").textContent = "You're logged in!";
          document.getElementById("hintText").textContent = "You can close this tab now.";
        } else if (lang === "fr") {
          document.getElementById("hintTitle").textContent = "Vous êtes connecté !";
          document.getElementById("hintText").textContent = "Vous pouvez fermer cet onglet.";
        }
        hint.style.display = "block";
        // Last resort: redirect after 3s if user doesn't close
        setTimeout(() => { window.location.replace(path); }, 3000);
        return;
      }

      // No BroadcastChannel support — redirect directly
      window.location.replace(path);
    }

    // Determine default target: /talk only if a specific mode was selected (via "Mit Sophie sprechen")
    // Otherwise: landing page (user just logged in via "Einloggen")
    const defaultTarget = detectedMode ? "/talk" : "/";

    // PKCE exchange + session detection — redirect as soon as session is ready
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_IN" && session?.user) go(buildTarget(defaultTarget));
    });

    // Fallback after 3s
    setTimeout(async () => {
      const { data } = await supabase.auth.getSession();
      go(data.session?.user ? buildTarget(defaultTarget) : "/login");
    }, 3000);
  </script>
</body>
</html>
